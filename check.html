<script>
/* =========================================================================
   Eclipsis dentro la sezione Check (dashboard di MS Coaching)
   -------------------------------------------------------------------------
   Questo file si carica PRIMA dello script principale di index.html: per
   questo contiene solo funzioni e le proprie costanti. Usa gli attrezzi
   dello script principale (S, DB, ctxFor, metricValue, openModal, ...) solo
   dentro le funzioni, quando la pagina è già pronta.

   Cosa fa:
   1. Controllo del check: completezza, valori impossibili, coerenza con il
      check precedente, segnali da guardare con il cliente.
   2. Valutazione finale scritta da Eclipsis (Claude Code sul Mac), che riceve
      i dati per CODICE, senza nome, senza contatti e senza foto.
   3. "Carica check vecchi": PDF, foto, Excel, Word, CSV. Eclipsis legge il
      file, propone i check trovati e Mattias conferma prima di salvare.
   4. "Passa a Eclipsis": il riassunto del check, per codice, finisce in
      memoria/grezzo/feedback/ e serve alla scheda successiva.
   5. Collegamento con la dashboard: #cliente=C001 e #nuovo=C001.

   Le soglie dei controlli stanno in ECL_SOGLIE qui sotto: sono segnali per
   Mattias, non regole del metodo.
   ========================================================================= */

const ECL = { on: false, pronto: false, motivo: '', persone: null };

/* Colori dei grafici: a schermo il tema della dashboard, nei PDF quello chiaro di stampa */
const ECL_TEMA = {
  scuro: {
    testo: '#A99BB3', linee: 'rgba(201,166,216,.12)', griglia: 'rgba(201,166,216,.09)', zero: 'rgba(201,166,216,.5)', punto: '#15101B', tooltip: '#2B1B35',
    font: "'Space Grotesk', -apple-system, 'Helvetica Neue', Arial, sans-serif",
    pal: ['#C9A6D8', '#5CC8E0', '#F0A27A', '#9DB6E8', '#F08BBF', '#B5DB6E'],
    ord: { t0: '#5E4572', ref: '#A04DB8', cur: '#E9C8F5' },
  },
  chiaro: {
    testo: '#64748B', linee: '#EEE9F3', griglia: '#F1EDF5', zero: '#9C93A8', punto: '#fff', tooltip: '#1A0B20',
    font: "Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif",
    pal: ['#7E22CE', '#0891B2', '#C2410C', '#2563EB', '#DB2777', '#65A30D'],
    ord: { t0: '#D8B4FE', ref: '#A855F7', cur: '#4B0055' },
  },
};
let ECL_T = ECL_TEMA.scuro;
function eclTema(nome) {
  ECL_T = ECL_TEMA[nome] || ECL_TEMA.scuro;
  Object.assign(ORD, ECL_T.ord);
  PAL.splice(0, PAL.length, ...ECL_T.pal);
  if (!window.Chart) return;
  const C = window.Chart;
  C.defaults.font.family = ECL_T.font;
  C.defaults.color = ECL_T.testo;
  C.defaults.borderColor = ECL_T.linee;
  C.defaults.plugins.tooltip.backgroundColor = ECL_T.tooltip;
}
const ECL_RE_CODICE = /^[CLPAE]\d{3,4}$/;
const ECL_SOGLIE = {
  pesoMin: 30, pesoMax: 250,            // kg
  pesoBia: 1.5,                         // kg di differenza tra bilancia e BIA
  pesataFuori: 3,                       // kg di distanza di una pesata dalla media
  grassoMin: 3, grassoMax: 60,          // % massa grassa BIA
  circMin: 10, circMax: 200,            // cm
  plicaMin: 2, plicaMax: 80,            // mm
  saltoCirc: 0.10, saltoPeso: 0.08,     // variazione insolita rispetto al check prima
  saltoGrasso: 6,                       // punti percentuali
  caloPesoSett: 1,                      // % di peso persa a settimana
  sonnoBasso: 2, stressAlto: 4, energiaBassa: 2,
  dolore: 4, doloreSalita: 2,
  aderenzaBassa: 70,                    // %
  caloForza: 5, caloForzaEsercizi: 2,   // % di e1RM, su almeno N esercizi
  caloMuscolo: 1,                       // kg di SMM
  giorniBlocco: 84,
};

/* ------------------------------ base ------------------------------ */
async function eclInit() {
  ECL.on = false; ECL.motivo = '';
  if (DB.mode !== 'cloud') { ECL.motivo = 'locale'; ECL.pronto = true; return; }
  try {
    const r = await DB.call('stato');
    if (!r || !('eclipsis' in r)) ECL.motivo = 'vecchio';
    else if (r.eclipsis) ECL.on = true;
    else ECL.motivo = 'claude';
  } catch (e) { ECL.motivo = 'vecchio'; }
  ECL.pronto = true;
  await eclPersone();
}
function eclOn() { return ECL.on; }
/** true quando la pagina gira dentro la dashboard di Eclipsis (dati sul Mac) */
function eclQui() { return DB.mode === 'cloud'; }
/** true quando non c'è nessun posto da cui far scrivere la valutazione (né la dashboard né l'app Claude) */
function valOff() { return !(eclQui() || (window.claude && typeof window.claude.use === 'function')); }
/** Perché Eclipsis non può lavorare adesso, in parole semplici */
function eclMotivo() {
  if (ECL.motivo === 'claude') return 'Manca la chiave dell\'AI: va aggiunta una volta sola nei segreti di Supabase (<b>ANTHROPIC_API_KEY</b>). Chiedi a Claude di guidarti.';
  return 'L\'AI non risponde in questo momento: ricarica la pagina e riprova.';
}
function eclSpento(cosa) {
  openModal({ title: 'Eclipsis non è collegato', body: `<p style="margin:0 0 12px;line-height:1.55">${cosa}</p><div class="alert warn">${ic('alert')}<div>${eclMotivo()}</div></div>`, actions: [{ label: 'Ho capito', cls: 'primary' }] });
}

/* ---------- codice cliente: il collegamento con l'elenco Clienti della dashboard ---------- */
/** Le persone della dashboard (codice e, solo su questa pagina, il nome della rubrica privata) */
async function eclPersone() {
  try {
    await window.MSC_API_PRONTA;
    ECL.persone = (await window.MSC_API.chiama('co_checkClienti', [null])).filter((p) => ECL_RE_CODICE.test(p.codice))
      .map((p) => ({ id: p.codice, nome: String(p.nome || '').trim(), biaTest: !!p.biaTest }));
  } catch (e) { ECL.persone = ECL.persone || []; }
  return ECL.persone;
}
function eclNorm(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).sort().join(' ');
}
/** Riga per collegare la scheda a un codice: propone quello giusto se il nome coincide con la rubrica della dashboard */
function eclCodiceHTML(c) {
  const usati = new Set(S.clients.map(eclCodice).filter(Boolean));
  const liberi = (ECL.persone || []).filter((p) => !usati.has(p.id));
  const mio = eclNorm(clientName(c));
  const trovato = mio ? liberi.find((p) => p.nome && eclNorm(p.nome) === mio) : null;
  if (trovato) return `<span>Nell'area coach questa persona è <b>${esc(trovato.id)}</b>. Collegala per vedere i suoi check nel profilo e far lavorare Eclipsis senza usare il nome.</span><span class="ecl-cod"><button class="btn sm primary" data-act="ecl-collega" data-cod="${esc(trovato.id)}">${ic('check')} Collega a ${esc(trovato.id)}</button></span>`;
  const opz = liberi.map((p) => `<option value="${esc(p.id)}">${esc(p.id)}${p.nome ? ' · ' + esc(p.nome) : ''}</option>`).join('');
  return `<span><b>Manca il codice cliente.</b> È il codice del cliente nell'area coach (es. C001): porta i risultati dei check nel suo profilo e permette all'AI di lavorare senza conoscerne il nome.</span>
    <span class="ecl-cod">${opz ? `<select class="sel" data-ecl-cod="sel"><option value="">Scegli dai tuoi clienti…</option>${opz}</select>` : ''}<input class="inp" data-ecl-cod="inp" placeholder="${opz ? 'oppure scrivi C001' : 'C001'}" maxlength="5"><button class="btn sm primary" data-act="ecl-collega">Collega</button></span>`;
}
async function eclCollega(el) {
  if (!S.client) return;
  const box = el.closest('.ecl-link, .alert') || document;
  const sel = box.querySelector('[data-ecl-cod="sel"]'), inp = box.querySelector('[data-ecl-cod="inp"]');
  const cod = String(el.dataset.cod || (inp && inp.value.trim()) || (sel && sel.value) || '').toUpperCase();
  if (!ECL_RE_CODICE.test(cod)) { toast('Scrivi un codice come C001 (una lettera tra C, L, P, A, E e tre cifre).', 'bad', 5000); return; }
  const altro = S.clients.find((x) => x.id !== S.client.id && eclCodice(x) === cod);
  if (altro) { toast(`Il codice ${esc(cod)} è già della scheda di ${esc(clientName(altro))}.`, 'bad', 6000); return; }
  S.client.anag.codice = cod;
  touch('client', S.client);
  await flush();
  const nota = (ECL.persone || []).some((p) => p.id === cod) ? '' : ' Nell\'area coach questo codice non c\'è ancora: crea il cliente lì, poi i risultati arrivano nel suo profilo.';
  toast(`${ic('check')} Scheda collegata a ${esc(cod)}.${nota}`, '', nota ? 7000 : 3500);
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ eclipsis: 'check-aggiornati' }, location.origin); } catch (e) { /* */ }
  await rerenderKeepScroll();
}
function eclCodice(client) {
  const c = String((client && client.anag && client.anag.codice) || '').trim().toUpperCase();
  return ECL_RE_CODICE.test(c) ? c : '';
}
function eclRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/** Toglie nome e cognome del cliente da un testo: il nome diventa {NOME}, il cognome sparisce */
function eclAnon(testo, client) {
  let s = String(testo || '');
  const a = (client && client.anag) || {};
  const forme = (w) => {
    const b = w.toLowerCase();
    return Array.from(new Set([w, b.charAt(0).toUpperCase() + b.slice(1), w.toUpperCase()]));
  };
  const togli = (parole, con) => parole.forEach((w) => {
    if (w.length < 2) return;
    forme(w).forEach((f) => { s = s.replace(new RegExp('(^|[^\\p{L}{])' + eclRe(f) + '(?![\\p{L}}])', 'gu'), '$1' + con); });
  });
  togli(String(a.cognome || '').split(/\s+/).filter(Boolean), '');
  togli(String(a.nome || '').split(/\s+/).filter(Boolean), '{NOME}');
  return s.replace(/\{NOME\}(\s+\{NOME\})+/g, '{NOME}').replace(/[ \t]{2,}/g, ' ');
}
/** Rimette il nome di battesimo al posto del segnaposto, sul Mac di Mattias */
function eclNome(testo, client) {
  const nome = String((client && client.anag && client.anag.nome) || '').trim().split(/\s+/)[0] || '';
  let s = String(testo || '');
  if (nome) return s.replace(/\{NOME\}|\[nome\]/g, nome);
  s = s.replace(/(\{NOME\}|\[nome\])\s*[,:]?\s*/g, '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function eclRighe(x, client) {
  const arr = Array.isArray(x) ? x : String(x || '').split('\n');
  return arr.map((r) => eclNome(String(r).replace(/^[-•*\s]+/, '').trim(), client)).filter(Boolean).join('\n');
}

/** Avvia un lavoro di Eclipsis sul server e aspetta il risultato */
async function eclJob(corpo, opt) {
  opt = opt || {};
  const avvio = await DB.call('eclipsis', corpo);
  const id = avvio.id;
  let fermato = false;
  const ferma = () => { fermato = true; DB.call('eclipsis/stop', { id }).catch(() => {}); };
  if (opt.signal) { if (opt.signal.aborted) ferma(); else opt.signal.addEventListener('abort', ferma); }
  let buchi = 0;
  try {
    for (;;) {
      await new Promise((r) => setTimeout(r, 1200));
      let st;
      try { st = await DB.call('eclipsis/stato?id=' + encodeURIComponent(id)); buchi = 0; } catch (e) {
        if (++buchi > 8) throw e;
        continue;
      }
      if (opt.onTick) opt.onTick(st);
      if (st.stato === 'fatto') return st.risultato;
      if (st.stato === 'errore') {
        const er = new Error(fermato ? 'Interrotto.' : st.errore || 'Eclipsis non è riuscito a finire.');
        er.code = fermato ? 'cancelled' : 'job';
        throw er;
      }
    }
  } finally {
    if (opt.signal) opt.signal.removeEventListener('abort', ferma);
  }
}
function eclFase(st, cosa) {
  const sec = st && st.secondi ? ` · ${st.secondi < 60 ? st.secondi + ' s' : Math.floor(st.secondi / 60) + ' min ' + (st.secondi % 60) + ' s'}` : '';
  if (st && st.scrive) return `Eclipsis sta scrivendo ${cosa}${sec}`;
  const f = st && st.fasi && st.fasi.length ? st.fasi[st.fasi.length - 1] : '';
  return `Eclipsis sta leggendo${f ? ': ' + f : '…'}${sec}`;
}

/* =========================================================================
   1 · Dati del check per Eclipsis (per codice, senza nome e senza foto)
   ========================================================================= */
function eclDati(ctx, opt) {
  const cl = ctx.client, c = ctx.check, prev = ctx.prev;
  const cod = eclCodice(cl) || 'senza codice';
  const riservato = !!(opt && opt.riservato);
  let base = ctx;
  const medico = [];
  if (riservato) {
    /* Nel file che resta in memoria/ i dettagli medici non entrano: resta solo il segnale, come per "vincoloMedico" */
    const k = clone(cl);
    const sc = k.screening || {};
    if (SCREENING_Q.some((q, i) => sc['q' + (i + 1)] === 'si')) medico.push('- Screening di salute: ci sono risposte "Sì". I dettagli restano nella scheda privata: chiedili a Mattias prima di preparare la scheda.');
    SCREENING_Q.forEach((q, i) => { if (sc['q' + (i + 1)] === 'si') sc['q' + (i + 1)] = ''; });
    sc.dettagli = '';
    k.screening = sc;
    if (k.riab && k.riab.attivo) {
      medico.push(`- Percorso riabilitativo attivo (diagnosi nella scheda privata: parlane con Mattias)${k.riab.movEvitare ? ' · movimenti da evitare: ' + String(k.riab.movEvitare).replace(/\s*\n\s*/g, ' / ') : ''}${k.riab.movReintrodurre ? ' · da reintrodurre con gradualità: ' + String(k.riab.movReintrodurre).replace(/\s*\n\s*/g, ' / ') : ''}`);
      k.riab = { attivo: false };
    }
    if (k.infortuni && Array.isArray(k.infortuni.passati)) k.infortuni.passati = k.infortuni.passati.map((r) => ({ zona: r.zona, tipo: '', anno: r.anno, risolto: r.risolto, limiti: r.limiti }));
    base = Object.assign({}, ctx, { client: k });
  }
  const L = [valutazioneDati(base).replace(/^Nome: [^·\n]*·/m, `Cliente: ${cod} ·`)];
  if (medico.length) { L.push('', '## VINCOLI MEDICI (solo il segnale, senza dettagli)'); medico.forEach((x) => L.push(x)); }
  const riga = (et, v) => { const s = String(v == null ? '' : v).replace(/\s*\n\s*/g, ' / ').trim(); return s ? `- ${et}: ${s}` : ''; };
  const blocco = (titolo, righe) => { const r = righe.filter(Boolean); if (r.length) { L.push('', titolo); r.forEach((x) => L.push(x)); } };
  blocco('## CONTESTO DALLA SCHEDA CLIENTE', [
    riga('Lavoro e carico quotidiano', cl.stile && cl.stile.lavoro),
    riga('Passi e spostamenti abituali', cl.stile && cl.stile.passi),
    riga('Altri sport', cl.stile && cl.stile.altriSport),
    riga('Sonno abituale', cl.stile && cl.stile.sonno),
    riga('Segnali di affaticamento', cl.stile && cl.stile.affaticamento),
    riga('Allenamento attuale', cl.storia && cl.storia.attuale),
    riga('Esercizi preferiti', cl.storia && cl.storia.preferiti),
    riga('Esercizi evitati o non tollerati', cl.storia && cl.storia.evitati),
    riga('Disponibilità settimanale', cl.organizzazione && cl.organizzazione.disponibilita),
    riga('Durata della seduta', cl.organizzazione && cl.organizzazione.durata),
    riga('Palestra o home gym', cl.organizzazione && cl.organizzazione.palestra),
    riga('Piano alimentare', optLabel('piano', cl.alimentazione && cl.alimentazione.piano)),
    riga('Cosa ha bloccato i risultati finora', cl.obiettivo && cl.obiettivo.blocchi),
    riga('Risultato minimo a 12 settimane', cl.obiettivo && cl.obiettivo.risultatoMinimo),
  ]);
  const prog = (k, titolo) => {
    const co = (k && k.coach) || {};
    blocco(titolo, [
      riga('Split', co.split), riga('Frequenza', co.frequenza), riga('Priorità muscolari', co.focus),
      riga('Mesociclo 1', co.meso1), riga('Mesociclo 2', co.meso2), riga('Mesociclo 3', co.meso3),
      riga('Deload', co.deload), riga('Target passi', co.passiTarget), riga('NEAT / cardio', co.neat),
      riga('Test da ripetere', co.testProssimo), riga('Altre note per la scheda', co.impostazione),
    ]);
  };
  if (prev) prog(prev, `## PROGRAMMAZIONE DEL BLOCCO APPENA CONCLUSO (scritta da Mattias al check del ${fmtDate(prev.date)})`);
  prog(c, '## PROGRAMMAZIONE GIÀ ABBOZZATA DA MATTIAS PER IL PROSSIMO BLOCCO');
  if (c.origine) L.push('', `Nota: questo check è stato importato da un documento vecchio (${c.origine.dubbi && c.origine.dubbi.length ? 'con ' + c.origine.dubbi.length + ' punti dubbi nella lettura' : 'lettura senza dubbi'}).`);
  return eclAnon(L.join('\n'), cl);
}

/* =========================================================================
   2 · Controllo del check
   ========================================================================= */
function eclPeso(c, cl) { const m = metricValue('pesoMedio', c, cl); return m !== null ? m : metricValue('peso', c, cl) !== null ? metricValue('peso', c, cl) : metricValue('b_peso', c, cl); }

/** Valori impossibili o incoerenti dentro un singolo check (serve anche all'anteprima dei check vecchi) */
function eclValoriStrani(c) {
  const T = ECL_SOGLIE, out = [];
  const add = (k, t, sec) => out.push({ k, t, sec });
  const pg = num(c.misure && c.misure.pesoGiorno), pb = num(c.bia && c.bia.peso);
  [['Peso del giorno', pg, 'peso'], ['Peso della BIA', pb, 'bia']].forEach(([l, v, sec]) => {
    if (v !== null && (v < T.pesoMin || v > T.pesoMax)) add('bad', `${l}: ${fmtN(v, 1)} kg non è un valore plausibile.`, sec);
  });
  const pes = ((c.misure && c.misure.pesate) || []).map(num).filter((x) => x !== null);
  if (pes.length >= 3) {
    const med = pes.reduce((a, b) => a + b, 0) / pes.length;
    const fuori = pes.filter((x) => Math.abs(x - med) > T.pesataFuori);
    if (fuori.length) add('warn', `Una pesata (${fuori.map((x) => fmtN(x, 1)).join(', ')} kg) è lontana più di ${T.pesataFuori} kg dalle altre: controlla la digitazione.`, 'peso');
  }
  if (pg !== null && pb !== null && Math.abs(pg - pb) > T.pesoBia) add('warn', `Peso del giorno (${fmtN(pg, 1)} kg) e peso della BIA (${fmtN(pb, 1)} kg) differiscono di ${fmtN(Math.abs(pg - pb), 1)} kg.`, 'bia');
  const b = c.bia || {};
  const pbf = num(b.pbf), mbf = num(b.mbf), slm = num(b.slm), smm = num(b.smm);
  if (pbf !== null && (pbf < T.grassoMin || pbf > T.grassoMax)) add('bad', `Massa grassa BIA al ${fmtN(pbf, 1)}%: valore non plausibile.`, 'bia');
  if (smm !== null && slm !== null && smm > slm) add('bad', `BIA: la massa muscolare scheletrica (${fmtN(smm, 1)} kg) non può superare la massa magra (${fmtN(slm, 1)} kg). Forse i due valori sono invertiti.`, 'bia');
  const pRif = pb !== null ? pb : pg;
  if (pbf !== null && mbf !== null && pRif !== null && Math.abs((mbf / pRif) * 100 - pbf) > 1.5) add('warn', `BIA: ${fmtN(mbf, 1)} kg di grasso su ${fmtN(pRif, 1)} kg fanno il ${fmtN((mbf / pRif) * 100, 1)}%, ma la percentuale inserita è ${fmtN(pbf, 1)}%.`, 'bia');
  if (mbf !== null && slm !== null && pRif !== null && (mbf + slm > pRif + 1 || pRif - (mbf + slm) > 7)) add('warn', `BIA: massa grassa più massa magra (${fmtN(mbf + slm, 1)} kg) non tornano con il peso (${fmtN(pRif, 1)} kg).`, 'bia');
  const circ = (c.misure && c.misure.circ) || {};
  CIRC_SINGLE.forEach(([k, l]) => { const v = num(circ[k]); if (v !== null && (v < T.circMin || v > T.circMax)) add('bad', `${l}: ${fmtN(v, 1)} cm non è un valore plausibile.`, 'peso'); });
  CIRC_BI.forEach(([k, l]) => ['sx', 'dx'].forEach((s) => { const v = num(circ[k] && circ[k][s]); if (v !== null && (v < T.circMin || v > T.circMax)) add('bad', `${l} ${s.toUpperCase()}: ${fmtN(v, 1)} cm non è un valore plausibile.`, 'peso'); }));
  const vm = num(circ.vitaMin), vo = num(circ.vitaOmb);
  if (vm !== null && vo !== null && vm > vo + 0.5) add('warn', `La vita minima (${fmtN(vm, 1)} cm) è più larga della vita ombelicale (${fmtN(vo, 1)} cm): controlla che non siano invertite.`, 'peso');
  const pl = PLICHE.map(([k, l]) => [l, num(c.pliche && c.pliche[k])]);
  pl.forEach(([l, v]) => { if (v !== null && (v < T.plicaMin || v > T.plicaMax)) add('bad', `Plica ${l.toLowerCase()}: ${fmtN(v, 1)} mm non è un valore plausibile.`, 'pliche'); });
  const nPl = pl.filter(([, v]) => v !== null).length;
  if (nPl > 0 && nPl < 7) add('warn', `Pliche incomplete (${nPl} su 7): per la percentuale di grasso servono tutte e sette.`, 'pliche');
  (c.forza || []).forEach((r) => {
    if (!r.es) { if (num(r.kg) !== null || num(r.reps) !== null) add('warn', 'Test di forza: c\'è una riga con carico o ripetizioni ma senza il nome dell\'esercizio.', 'forza'); return; }
    if (num(r.kg) === null || num(r.reps) === null) add('warn', `Test di forza, ${r.es}: manca ${num(r.kg) === null ? 'il carico' : 'il numero di ripetizioni'}.`, 'forza');
    else if (num(r.reps) > 30 || num(r.kg) > 500) add('bad', `Test di forza, ${r.es}: ${r.kg} kg × ${r.reps} non è plausibile.`, 'forza');
  });
  (c.dolori || []).forEach((d) => { const v = num(d.int); if (d.zona && v !== null && (v < 0 || v > 10)) add('bad', `Dolore ${d.zona}: l'intensità va da 0 a 10.`, 'ben'); });
  const ad = num(c.bilancio && c.bilancio.aderenza);
  if (ad !== null && (ad < 0 || ad > 100)) add('bad', 'Aderenza agli allenamenti: la percentuale va da 0 a 100.', 'bil');
  const passi = num(c.benessere && c.benessere.passi);
  if (passi !== null && (passi < 300 || passi > 40000)) add('warn', `Passi medi giornalieri: ${fmtN(passi, 0)} sembra un errore di digitazione.`, 'ben');
  return out;
}

function eclQuality(ctx) {
  const T = ECL_SOGLIE;
  const c = ctx.check, cl = ctx.client, prev = ctx.prev, meta = ctx.meta;
  const rapido = isQuick(c);
  const a = cl.anag || {};
  const circ = (c.misure && c.misure.circ) || {};
  const issues = eclValoriStrani(c);
  const add = (k, t, sec) => issues.push({ k, t, sec });
  const signals = [];
  const sig = (k, t) => signals.push({ k, t });

  /* completezza */
  const voci = [];
  const voce = (ok, l, sec) => voci.push({ ok: !!ok, l, sec });
  const peso = eclPeso(c, cl);
  voce(peso !== null, 'Peso', 'peso');
  voce(CIRC_SINGLE.filter(([k]) => num(circ[k]) !== null).length >= 3, 'Circonferenze del tronco', 'peso');
  if (!rapido) {
    voce(CIRC_BI.filter(([k]) => num(circ[k] && circ[k].sx) !== null || num(circ[k] && circ[k].dx) !== null).length >= 3, 'Circonferenze degli arti', 'peso');
    voce(num(c.bia && c.bia.pbf) !== null || PLICHE.every(([k]) => num(c.pliche && c.pliche[k]) !== null), 'Massa grassa (BIA o pliche)', 'bia');
    voce((c.forza || []).some((r) => r.es && num(r.kg) !== null && num(r.reps) !== null), 'Test di forza', 'forza');
    voce(Object.values(c.mobilita || {}).some((v) => v && ['sx', 'dx', 'v'].some((k) => num(v[k]) !== null)), 'Test fisici', 'mob');
  }
  voce(c.benessere && c.benessere.fase, 'Fase alimentare', 'dati');
  voce(c.benessere && c.benessere.sonno && c.benessere.stress, 'Sonno e stress', 'ben');
  if (meta.n > 1) voce(num(c.bilancio && c.bilancio.aderenza) !== null, 'Aderenza del blocco', 'bil');
  if (!(cl.consensi && cl.consensi.foto === 'no')) voce(PHOTO_POSES.some(([k]) => photoOf(c.id, k)), 'Foto', 'foto');
  voce(String((c.sintesi && c.sintesi.obiettivo) || '').trim() || goalsOf(c).length, 'Obiettivi del prossimo blocco', 'obiettivi');
  voce(String((c.sintesi && c.sintesi.feedback) || '').trim(), 'Feedback per il cliente', 'obiettivi');
  voce(c.sintesi && c.sintesi.prossimoCheck, 'Data del prossimo check', 'obiettivi');
  const fatte = voci.filter((v) => v.ok).length;
  const pct = voci.length ? Math.round((fatte / voci.length) * 100) : 0;

  /* scheda cliente */
  const mancaAnag = [['sesso', a.sesso], ['data di nascita', a.dataNascita], ['altezza', a.altezza]].filter(([, v]) => !v).map(([l]) => l);
  if (mancaAnag.length) add('warn', `Nella scheda cliente manca: ${mancaAnag.join(', ')}. Servono per BMI, rapporto vita/altezza e percentuale di grasso dalle pliche.`, null);
  if (ECL.on && !eclCodice(cl)) add('warn', 'Manca il codice cliente (es. C001) nella scheda, sezione Dati personali: senza codice l\'AI non può analizzare questo check e i risultati non arrivano nel profilo del cliente.', null);

  /* date */
  const giorno = String(c.date || '').slice(0, 10);
  if (giorno && giorno > todayISO()) add('warn', `La data del check (${fmtDate(giorno)}) è nel futuro.`, 'dati');
  if (meta.sorted.some((k) => k.id !== c.id && String(k.date || '').slice(0, 10) === giorno)) add('warn', `C'è un altro check di questo cliente con la stessa data (${fmtDate(giorno)}): potrebbe essere un doppione.`, 'dati');
  const pc = c.sintesi && c.sintesi.prossimoCheck;
  if (pc && giorno && pc <= giorno) add('bad', 'La data del prossimo check è precedente a questo check.', 'obiettivi');
  if (c.protocollo === 'no') add('info', 'Protocollo pre-check non rispettato: peso e BIA di oggi sono meno confrontabili con gli altri check.', 'dati');
  if (c.origine && !c.origine.visto && c.origine.dubbi && c.origine.dubbi.length) add('info', `Check importato da un documento vecchio, con ${c.origine.dubbi.length} ${c.origine.dubbi.length === 1 ? 'punto dubbio' : 'punti dubbi'} nella lettura: vedi "Dati del check".`, 'dati');

  /* confronto con il check precedente */
  if (prev) {
    const sett = Math.max(1, (daysBetween(String(prev.date).slice(0, 10), giorno) || 7) / 7);
    const salto = (mk, l, soglia, sec) => {
      const v = metricValue(mk, c, cl), p = metricValue(mk, prev, cl);
      if (v === null || p === null || !p) return;
      const d = (v - p) / p;
      if (Math.abs(d) > soglia && sett < 30) add('warn', `${l}: ${fmtN(p, 1)} → ${fmtN(v, 1)} (${fmtSigned(d * 100, 0)}%) rispetto al check precedente. Se non è reale, è un errore di digitazione.`, sec);
    };
    salto('peso', 'Peso del giorno', T.saltoPeso, 'peso');
    CIRC_SINGLE.forEach(([k, l]) => salto('c_' + k, l, T.saltoCirc, 'peso'));
    CIRC_BI.forEach(([k, l]) => ['sx', 'dx'].forEach((s) => salto(`c_${k}_${s}`, `${l} ${s.toUpperCase()}`, T.saltoCirc, 'peso')));
    const g = metricValue('b_pbf', c, cl), gp = metricValue('b_pbf', prev, cl);
    if (g !== null && gp !== null && Math.abs(g - gp) > T.saltoGrasso) add('warn', `Massa grassa BIA: ${fmtN(gp, 1)}% → ${fmtN(g, 1)}%. Una variazione di ${fmtN(Math.abs(g - gp), 1)} punti in un blocco è insolita: controlla il valore e le condizioni della misura.`, 'bia');
    (c.forza || []).forEach((r) => {
      const pr = r.es ? forzaRow(prev, r.es) : null;
      if (pr && num(r.kg) !== null && num(pr.kg) !== null && num(r.kg) !== num(pr.kg)) add('info', `${r.es}: carico diverso dal check precedente (${pr.kg} → ${r.kg} kg). Il confronto usa la stima del massimale (e1RM), meno precisa del confronto a carico fisso.`, 'forza');
    });

    /* segnali da guardare con il cliente */
    const w = eclPeso(c, cl), wp = eclPeso(prev, cl);
    if (w !== null && wp !== null && wp > 0) {
      const perSett = ((w - wp) / wp) * 100 / sett;
      if (perSett < -T.caloPesoSett) sig('warn', `Peso in calo del ${fmtN(Math.abs(perSett), 1)}% a settimana (${fmtN(wp, 1)} → ${fmtN(w, 1)} kg in ${fmtN(sett, 0)} settimane): oltre l'${T.caloPesoSett}% a settimana.`);
    }
    const scala = (mk) => [metricValue(mk, c, cl), metricValue(mk, prev, cl)];
    const [so, sop] = scala('w_sonno');
    if (so !== null && so <= T.sonnoBasso) sig('warn', `Qualità del sonno ${fmtN(so, 0)}/5${sop !== null && sop > so ? ` (era ${fmtN(sop, 0)}/5)` : ''}.`);
    else if (so !== null && sop !== null && sop - so >= 2) sig('warn', `Sonno peggiorato: da ${fmtN(sop, 0)}/5 a ${fmtN(so, 0)}/5.`);
    const [st, stp] = scala('w_stress');
    if (st !== null && st >= T.stressAlto) sig('warn', `Stress ${fmtN(st, 0)}/5${stp !== null && stp < st ? ` (era ${fmtN(stp, 0)}/5)` : ''}.`);
    else if (st !== null && stp !== null && st - stp >= 2) sig('warn', `Stress in aumento: da ${fmtN(stp, 0)}/5 a ${fmtN(st, 0)}/5.`);
    const cali = (c.forza || []).filter((r) => r.es).map((r) => {
      const v = metricValue('e1rm:' + r.es, c, cl), p = metricValue('e1rm:' + r.es, prev, cl);
      return v !== null && p ? { es: r.es, d: ((v - p) / p) * 100 } : null;
    }).filter((x) => x && x.d < -T.caloForza);
    if (cali.length >= T.caloForzaEsercizi) sig('warn', `Forza in calo su ${cali.length} esercizi: ${cali.map((x) => `${x.es} ${fmtSigned(x.d, 0)}%`).join(', ')}.`);
    const sm = metricValue('b_smm', c, cl), smp = metricValue('b_smm', prev, cl);
    if (sm !== null && smp !== null && sm - smp <= -T.caloMuscolo) sig('warn', `Massa muscolare (BIA) in calo di ${fmtN(Math.abs(sm - smp), 1)} kg: da leggere insieme a forza, idratazione e condizioni della misura.`);
  } else {
    const so = metricValue('w_sonno', c, cl), st = metricValue('w_stress', c, cl);
    if (so !== null && so <= T.sonnoBasso) sig('warn', `Qualità del sonno ${fmtN(so, 0)}/5.`);
    if (st !== null && st >= T.stressAlto) sig('warn', `Stress ${fmtN(st, 0)}/5.`);
  }
  const en = num(c.bilancio && c.bilancio.energia);
  if (en !== null && en <= T.energiaBassa) sig('warn', `Energia media del blocco ${fmtN(en, 0)}/5.`);
  const ad = num(c.bilancio && c.bilancio.aderenza);
  if (ad !== null && ad >= 0 && ad < T.aderenzaBassa) sig('warn', `Aderenza agli allenamenti al ${fmtN(ad, 0)}%: i risultati del blocco vanno letti con questo dato.`);
  (c.dolori || []).filter((d) => d.zona).forEach((d) => {
    const v = num(d.int);
    const p = prev ? (prev.dolori || []).find((x) => exKey(x.zona) === exKey(d.zona)) : null;
    const pv = p ? num(p.int) : null;
    if (v !== null && v >= T.dolore) sig('bad', `Dolore ${d.zona}: ${fmtN(v, 0)}/10${pv !== null ? ` (era ${fmtN(pv, 0)}/10)` : ''}. Questione medica: da valutare tu, ed eventualmente con il medico o il fisioterapista.`);
    else if (v !== null && pv !== null && v - pv >= T.doloreSalita) sig('warn', `Dolore ${d.zona} in aumento: da ${fmtN(pv, 0)} a ${fmtN(v, 0)}/10.`);
    else if (v !== null && v > 0 && prev && !p) sig('info', `Nuovo fastidio segnalato: ${d.zona} ${fmtN(v, 0)}/10.`);
  });

  const ordine = { bad: 0, warn: 1, info: 2 };
  issues.sort((x, y) => ordine[x.k] - ordine[y.k]);
  signals.sort((x, y) => ordine[x.k] - ordine[y.k]);
  return { pct, fatte, totale: voci.length, mancano: voci.filter((v) => !v.ok), issues, signals, errori: issues.filter((i) => i.k === 'bad').length };
}

function eclQualityHTML(ctx) {
  let q;
  try { q = eclQuality(ctx); } catch (e) { console.warn(e); return ''; }
  const livello = q.errori ? 'bad' : q.issues.some((i) => i.k === 'warn') || q.pct < 70 ? 'warn' : 'good';
  const icona = { bad: 'alert', warn: 'alert', info: 'info' };
  const riga = (i) => `<div class="q-it ${i.k}" ${i.sec ? `data-act="jump" data-to="ck-${i.sec}" title="Vai alla sezione"` : ''}>${ic(icona[i.k])}<span>${esc(i.t)}</span></div>`;
  return `<div class="dash-card q-card ${livello}">
    <div class="dc-h"><div><div class="t">Controllo del check</div><div class="s">Completezza e coerenza dei dati, aggiornato mentre scrivi</div></div><span class="grow"></span><span class="q-pct">${q.pct}%</span></div>
    <div class="q-bar"><i style="width:${q.pct}%"></i></div>
    ${q.mancano.length ? `<div class="q-miss"><span>Ancora da compilare</span>${q.mancano.map((v) => `<button class="q-chip" data-act="jump" data-to="ck-${v.sec}">${esc(v.l)}</button>`).join('')}</div>` : `<div class="q-ok">${ic('check')} Tutte le parti del check sono compilate.</div>`}
    ${q.issues.length ? `<div class="q-sub">Da controllare</div><div class="q-list">${q.issues.map(riga).join('')}</div>` : ''}
    ${q.signals.length ? `<div class="q-sub">Da guardare con il cliente</div><div class="q-list">${q.signals.map(riga).join('')}</div>` : ''}
    ${!q.issues.length && !q.signals.length ? `<div class="q-ok" style="margin-top:8px">${ic('check')} Nessun valore anomalo e nessun segnale di attenzione.</div>` : ''}
  </div>`;
}
/** I controlli automatici, in testo, per Eclipsis */
function eclSegnali(ctx) {
  let q;
  try { q = eclQuality(ctx); } catch (e) { return ''; }
  const r = [];
  q.issues.filter((i) => i.k !== 'info').forEach((i) => r.push('- Dato da controllare: ' + i.t));
  q.signals.forEach((s) => r.push('- Segnale: ' + s.t));
  if (q.mancano.length) r.push('- Parti del check non compilate: ' + q.mancano.map((v) => v.l).join(', '));
  return eclAnon(r.join('\n'), ctx.client);
}
/** Prima del PDF per il cliente: se ci sono valori impossibili, chiede conferma */
async function eclPrimaDelPdf(kind) {
  if ((kind !== 'client' && kind !== 'coach') || !S.check || !S.client || S.view.v !== 'check') return true;
  if (kind === 'client') {
    let q = null;
    try { q = eclQuality(curCtx()); } catch (e) { q = null; }
    if (q && q.errori) {
      const el = q.issues.filter((i) => i.k === 'bad').slice(0, 6).map((i) => `<li>${esc(i.t)}</li>`).join('');
      const ok = await confirmBox('Ci sono valori da correggere', `Prima di creare il PDF per il cliente controlla ${q.errori === 1 ? 'questo valore' : 'questi valori'}:<ul style="margin:10px 0 0;padding-left:18px;line-height:1.5">${el}</ul>`, 'Crea il PDF comunque');
      if (!ok) return false;
    }
  }
  const v = S.check.valutazione || {};
  if (String(v.sintesi || v.noteCoach || '').trim() || !eclQui()) return true;
  const cod = eclCodice(S.client);
  const puo = ECL.on && !!cod;
  const perche = puo ? '' : `<div class="alert warn" style="margin-top:12px">${ic('alert')}<div>${ECL.on ? 'Per farla scrivere a Eclipsis serve prima il codice cliente: lo colleghi nella sezione "Valutazione finale" di questo check.' : eclMotivo()}</div></div>`;
  const scelta = await new Promise((res) => {
    let fatto = false;
    const fine = (x) => { if (!fatto) { fatto = true; res(x); } };
    openModal({
      title: 'Mancano conclusioni e consigli',
      body: `<p style="margin:0;line-height:1.55">Questo check non ha ancora la <b>valutazione di Eclipsis</b>: senza, nel PDF ci sono i dati e i grafici ma non le conclusioni, i punti di forza e i consigli per il prossimo blocco.${puo ? ' Eclipsis la scrive in circa un minuto: tu la rileggi, la correggi e poi crei il PDF.' : ''}</p>${perche}`,
      actions: [{ label: 'Annulla', fn: () => fine('') }, { label: 'Crea il PDF senza', fn: () => fine('senza') }].concat(puo ? [{ label: `${ic('sparkle')} Scrivi la valutazione`, cls: 'primary', fn: () => fine('genera') }] : [{ label: 'Vai alla valutazione', cls: 'primary', fn: () => fine('vai') }]),
      onClose: () => fine(''),
    });
  });
  if (scelta === 'senza') return true;
  if (scelta === 'genera' || scelta === 'vai') {
    const sez = document.getElementById('ck-valutazione');
    if (sez) sez.scrollIntoView({ block: 'start' });
    if (scelta === 'genera') eclValutazione();
  }
  return false;
}

      ${cod ? '' : `<div class="alert warn ecl-link-in">${ic('alert')}<div class="ecl-link warn" style="margin:0;padding:0;background:none">${eclCodiceHTML(ctx.client)}</div></div>`}

        <button class="btn grad" data-act="val-gen" id="val-gen" ${cod && ECL.on ? '' : 'disabled'}>${ic('sparkle')} ${has ? 'Rigenera la valutazione' : 'Genera la valutazione finale'}</button>
        <button class="btn" data-act="val-stop" id="val-stop" hidden>${ic('x')} Interrompi</button>

    </div>
    ${has ? `<div class="g6" style="margin-top:14px">

      ${String(v.allerta || '').trim() ? `<div class="w6 alert warn">${ic('alert')}<div><b>Da verificare, decidi tu:</b><br>${nl2br(v.allerta)}</div></div>` : ''}
      ${ta('sintesi', 'Sintesi per il cliente', 'Compare nel PDF cliente.', 5)}

      ${ta('aree', 'Aree di miglioramento', 'Una voce per riga.', 5, 'w3')}
      ${ta('raccomandazioni', 'Raccomandazioni per le prossime 12 settimane', 'Una voce per riga. Compaiono nel PDF cliente.', 4)}
      ${ta('foto', 'Confronto fotografico', 'Eclipsis non vede le foto: se vuoi questa parte nel PDF cliente, scrivila tu. Vuoto = non compare.', 2)}
      <div class="w6 ecl-sep"><span>Solo per te</span></div>

async function eclValutazione() {
  if (VAL.running || !S.check) return;
  if (!ECL.on) { eclSpento('La valutazione la scrive Eclipsis a partire dai dati del check.'); return; }
  const cod = eclCodice(S.client);
  if (!cod) { toast('Manca il codice cliente (es. C001) nella scheda, sezione Dati personali.', 'bad', 6000); return; }
  const v0 = S.check.valutazione || {};
  if ((v0.sintesi || v0.noteCoach) && v0.edited) {
    const ok = await confirmBox('Rigenerare la valutazione?', 'La valutazione attuale, con le tue modifiche, verrà sostituita da una nuova.', 'Rigenera');
    if (!ok) return;
  }
  await flush();
  const ctx = curCtx();
  const checkId = S.check.id, client = S.client;
  VAL.running = true;
  VAL.ctl = new AbortController();
  const stato = (html) => { const st = $('#val-status'); if (st && S.check && S.check.id === checkId) st.innerHTML = html; };
  const tasti = (lavora) => { const b = $('#val-gen'), s = $('#val-stop'); if (b) b.disabled = lavora; if (s) s.hidden = !lavora; };
  tasti(true);
  stato('<span class="spin-sm"></span> Passo i dati a Eclipsis, senza nome e senza foto…');
  try {
    const out = await eclJob({ tipo: 'valutazione', codice: cod, dati: eclDati(ctx), segnali: eclSegnali(ctx) }, {
      signal: VAL.ctl.signal,
      onTick: (st) => stato(`<span class="spin-sm"></span> ${esc(eclFase(st, 'la valutazione'))}. Di solito servono da uno a tre minuti.`),
    });
    const target = S.checks.find((c) => c.id === checkId);
    if (!target) return;
    const o = out || {};
    target.valutazione = {
      sintesi: eclNome(String(o.sintesi || '').trim(), client), puntiForza: eclRighe(o.punti_forza, client), aree: eclRighe(o.aree_miglioramento, client),
      foto: v0.foto || '', raccomandazioni: eclRighe(o.raccomandazioni, client), noteCoach: eclNome(String(o.note_coach || '').trim(), client),
      spunti: eclRighe(o.spunti_scheda, client), domande: eclRighe(o.domande, client), qualita: eclRighe(o.qualita_dati, client),
      allerta: eclRighe(o.allerta, client), generatedAt: Date.now(), edited: false, inPdf: v0.inPdf !== false, conFoto: 0, da: 'eclipsis',
    };
    touch('check', target);
    if (S.check && S.check.id === checkId) { const box = $('#val-box'); if (box) box.innerHTML = valBodyHTML(curCtx()); }
    toast(`${ic('check')} Valutazione di Eclipsis pronta: rileggila e correggila se serve.`, '', 5000);
  } catch (e) {
    const msg = e && e.code === 'cancelled' ? 'Generazione interrotta.' : (e && e.message) || 'Non sono riuscito a generare la valutazione: riprova tra poco.';
    stato(esc(msg));
    if (!(e && e.code === 'cancelled')) toast(esc(msg), 'bad', 7000);
  } finally {
    VAL.running = false;
    tasti(false);
  }
}

function eclS(v) { const n = num(v); return n === null ? '' : String(Math.round(n * 100) / 100); }
function eclScala(v) { const n = num(v); return n === null ? '' : String(Math.min(5, Math.max(1, Math.round(n)))); }

/** Da un check letto da Eclipsis a un check del gestionale (non ancora salvato) */
function eclCheckDaImport(clientId, d, file) {
  const c = newCheck(clientId, null);
  const data = /^\d{4}-\d{2}-\d{2}$/.test(String(d.data || '')) ? d.data : '';
  c.date = data ? data + 'T09:00' : '';
  c.misure.pesoGiorno = eclS(d.peso);
  (Array.isArray(d.pesate) ? d.pesate : []).slice(0, 7).forEach((p, i) => { c.misure.pesate[i] = eclS(p); });
  if (['deficit', 'mantenimento', 'surplus'].includes(d.fase)) c.benessere.fase = d.fase;
  const ci = d.circ || {};
  CIRC_SINGLE.forEach(([k]) => { if (eclS(ci[k])) c.misure.circ[k] = eclS(ci[k]); });
  CIRC_BI.forEach(([k]) => {
    const v = ci[k];
    if (!v) return;
    const o = typeof v === 'object' ? { sx: eclS(v.sx), dx: eclS(v.dx) } : { sx: '', dx: eclS(v) };
    if (o.sx || o.dx) c.misure.circ[k] = o;
  });
  const b = d.bia || {};
  ['peso', 'bmi', 'pbf', 'mbf', 'slm', 'smm'].forEach((k) => { if (eclS(b[k])) c.bia[k] = eclS(b[k]); });
  ['lean', 'fat'].forEach((t) => SEGMENTS.forEach(([k]) => { const v = b.seg && b.seg[t] && b.seg[t][k]; if (eclS(v)) c.bia.seg[t][k] = eclS(v); }));
  PLICHE.forEach(([k]) => { if (eclS(d.pliche && d.pliche[k])) c.pliche[k] = eclS(d.pliche[k]); });
  const fz = (Array.isArray(d.forza) ? d.forza : []).filter((r) => r && String(r.es || '').trim()).map((r) => ({ es: String(r.es).trim().slice(0, 80), kg: eclS(r.kg), reps: eclS(r.reps) }));
  if (fz.length) c.forza = fz;
  const ids = new Set(testDefs().map((t) => t.id));
  Object.entries(d.test || {}).forEach(([id, v]) => {
    if (!ids.has(id) || !v || typeof v !== 'object') return;
    const o = {};
    ['sx', 'dx', 'v'].forEach((k) => { if (eclS(v[k])) o[k] = eclS(v[k]); });
    if (Object.keys(o).length) c.mobilita[id] = o;
  });
  c.benessere.sonno = eclScala(d.sonno);
  c.benessere.stress = eclScala(d.stress);
  c.benessere.passi = eclS(d.passi);
  c.dolori = (Array.isArray(d.dolori) ? d.dolori : []).filter((x) => x && String(x.zona || '').trim()).map((x) => ({ zona: String(x.zona).trim().slice(0, 80), int: eclS(x.int), quando: String(x.quando || '').slice(0, 200) }));
  const bil = {};
  if (eclS(d.aderenza)) bil.aderenza = eclS(d.aderenza);
  if (eclScala(d.alim)) bil.alim = eclScala(d.alim);
  if (eclScala(d.energia)) bil.energia = eclScala(d.energia);
  if (eclS(d.cardio)) bil.cardio = eclS(d.cardio);
  if (d.funzionato) bil.funzionato = String(d.funzionato).slice(0, 2000);
  if (d.nonFunzionato) bil.nonFunzionato = String(d.nonFunzionato).slice(0, 2000);
  c.bilancio = bil;
  if (d.obiettivo) c.sintesi.obiettivo = String(d.obiettivo).slice(0, 2000);
  if (d.focus) c.sintesi.focus = (Array.isArray(d.focus) ? d.focus.join('\n') : String(d.focus)).slice(0, 2000);
  if (d.feedback) c.sintesi.feedback = String(d.feedback).slice(0, 4000);
  if (d.note_coach) c.tecnica = String(d.note_coach).slice(0, 4000);
  c.sintesi.prossimoCheck = data ? addDaysISO(data, ECL_SOGLIE.giorniBlocco) : '';
  const completo = num(c.bia.pbf) !== null || Object.keys(c.pliche).length || fz.length || Object.keys(c.mobilita).length || CIRC_BI.some(([k]) => c.misure.circ[k]);
  c.tipo = completo ? 'completo' : 'rapido';
  const lista = (x) => (Array.isArray(x) ? x : x ? [x] : []).map((s) => String(s).trim().slice(0, 400)).filter(Boolean).slice(0, 40);
  c.origine = { file: String(file || '').slice(0, 160), quando: Date.now(), dubbi: lista(d.dubbi), dubbiFile: lista(d.dubbi_file), nonMappati: lista(d.non_mappati) };
  return c;
}

/** Riassunto leggibile di un check importato, per l'anteprima */
function eclAnteprimaRighe(c) {
  const R = [];
  const add = (t, v) => { if (v) R.push([t, v]); };
  const kg = (v) => (num(v) !== null ? fmtN(num(v), 1) + ' kg' : '');
  const pes = (c.misure.pesate || []).filter((x) => num(x) !== null);
  add('Peso', [kg(c.misure.pesoGiorno), pes.length ? `${pes.length} pesate dei giorni prima` : ''].filter(Boolean).join(' · '));
  add('Fase alimentare', optLabel('fase', c.benessere.fase));
  const ci = c.misure.circ || {};
  add('Circonferenze', CIRC_SINGLE.filter(([k]) => num(ci[k]) !== null).map(([k, l]) => `${l} ${fmtN(num(ci[k]), 1)}`)
    .concat(CIRC_BI.filter(([k]) => ci[k]).map(([k, l]) => `${l} ${[ci[k].sx ? 'SX ' + fmtN(num(ci[k].sx), 1) : '', ci[k].dx ? 'DX ' + fmtN(num(ci[k].dx), 1) : ''].filter(Boolean).join(' / ')}`)).join(' · '));
  const b = c.bia || {};
  const nSeg = ['lean', 'fat'].reduce((n, t) => n + Object.keys((b.seg && b.seg[t]) || {}).length, 0);
  add('BIA', [b.peso ? 'peso ' + kg(b.peso) : '', b.pbf ? `grasso ${fmtN(num(b.pbf), 1)}%` : '', b.mbf ? 'massa grassa ' + kg(b.mbf) : '', b.slm ? 'massa magra ' + kg(b.slm) : '', b.smm ? 'muscolo ' + kg(b.smm) : '', b.bmi ? 'BMI ' + fmtN(num(b.bmi), 1) : '', nSeg ? `${nSeg} valori segmentali` : ''].filter(Boolean).join(' · '));
  add('Pliche', PLICHE.filter(([k]) => c.pliche[k]).map(([k, l]) => `${l} ${fmtN(num(c.pliche[k]), 1)}`).join(' · '));
  add('Forza', (c.forza || []).filter((r) => r.es).map((r) => `${r.es} ${r.kg || '?'} kg × ${r.reps || '?'}`).join(' · '));
  const td = testDefs();
  add('Test fisici', Object.entries(c.mobilita || {}).map(([id, v]) => { const t = td.find((x) => x.id === id); return `${t ? t.nome : id} ${v.v !== undefined ? v.v : [v.sx ? 'SX ' + v.sx : '', v.dx ? 'DX ' + v.dx : ''].filter(Boolean).join(' / ')}${t && t.unita ? ' ' + t.unita : ''}`; }).join(' · '));
  add('Benessere', [c.benessere.sonno ? `sonno ${c.benessere.sonno}/5` : '', c.benessere.stress ? `stress ${c.benessere.stress}/5` : '', c.benessere.passi ? `${fmtN(num(c.benessere.passi), 0)} passi` : ''].filter(Boolean).join(' · '));
  add('Dolori', (c.dolori || []).map((x) => `${x.zona}${x.int ? ' ' + x.int + '/10' : ''}`).join(' · '));
  const bl = c.bilancio || {};
  add('Bilancio del blocco', [bl.aderenza ? `aderenza ${bl.aderenza}%` : '', bl.alim ? `alimentazione ${bl.alim}/5` : '', bl.energia ? `energia ${bl.energia}/5` : '', bl.cardio ? `cardio ${bl.cardio} min` : '', bl.funzionato ? 'cosa ha funzionato' : '', bl.nonFunzionato ? 'cosa non ha funzionato' : ''].filter(Boolean).join(' · '));
  add('Testi', [c.sintesi.obiettivo ? 'obiettivo' : '', c.sintesi.focus ? 'focus' : '', c.sintesi.feedback ? 'feedback del coach' : '', c.tecnica ? 'note tecniche' : ''].filter(Boolean).join(' · '));
  return R;
}

    const a = st.anag;
    el.innerHTML = `${st.file.some((f) => f.stato === 'errore') ? `<div class="alert warn" style="margin-bottom:12px">${ic('alert')}<div>${st.file.filter((f) => f.stato === 'errore').map((f) => `<b>${esc(f.nome)}</b>: ${esc(f.msg)}`).join('<br>')}</div></div>` : ''}
      ${st.voci.length ? `<p class="imp-lead">Eclipsis ha trovato <b>${st.voci.length} ${st.voci.length === 1 ? 'check' : 'check'}</b>${st.file.length > 1 ? ` in ${st.file.length} file` : ''}. Controlla date e valori, togli la spunta a quelli che non vuoi e conferma.</p>` : `<div class="alert warn">${ic('alert')}<div>In ${st.file.length === 1 ? 'questo file' : 'questi file'} Eclipsis non ha trovato dati di un check.${st.file.map((f) => (f.descr ? `<br><span class="small">${esc(f.nome)}: ${esc(f.descr)}</span>` : '')).join('')}</div></div>`}
      ${st.file.filter((f) => f.dubbi && f.dubbi.length).map((f) => `<div class="imp-note info" style="margin:0 0 10px">${ic('info')}<div><b>Note di Eclipsis su ${esc(f.nome)}</b><ul>${f.dubbi.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`).join('')}
      ${st.voci.map((v, i) => {
        const c = v.check, g = String(c.date || '').slice(0, 10);
        const strani = eclValoriStrani(c).filter((x) => x.k !== 'info');
        const righe = eclAnteprimaRighe(c);
        return `<div class="imp-card ${v.includi && g ? '' : 'off'}">
          <div class="imp-card-h">
            <label class="chk"><input type="checkbox" data-imp="inc" data-i="${i}" ${v.includi && g ? 'checked' : ''} ${g ? '' : 'disabled'}> <b>Importa</b></label>
            <input class="inp" type="date" data-imp="data" data-i="${i}" value="${esc(g)}" style="width:150px;height:32px">
            <span class="badge ${c.tipo === 'rapido' ? 'neu' : ''}">${c.tipo === 'rapido' ? 'Check rapido' : 'Check completo'}</span>
            <span class="grow"></span><span class="small muted" title="${esc(v.file)}">${esc(v.file.length > 34 ? v.file.slice(0, 32) + '…' : v.file)}</span>
          </div>
          ${!g ? `<div class="imp-note bad">${ic('alert')} Nel documento la data non c'era o non era chiara: scrivila tu per poter importare questo check.</div>` : ''}
          ${g && date.has(g) ? `<div class="imp-note warn">${ic('alert')} Esiste già un check di questo cliente con la stessa data: se lo importi ne avrai due.</div>` : ''}
          ${g && st.voci.some((o, j) => j !== i && o.includi && String(o.check.date).slice(0, 10) === g) ? `<div class="imp-note warn">${ic('alert')} Un altro check di questa anteprima ha la stessa data.</div>` : ''}
          ${righe.length ? `<table class="imp-t">${righe.map(([t, val]) => `<tr><th>${esc(t)}</th><td>${esc(val)}</td></tr>`).join('')}</table>` : '<div class="imp-note warn">Nessun valore riconosciuto in questo check.</div>'}
          ${strani.length ? `<div class="imp-note warn">${ic('alert')}<div><b>Valori da controllare</b><ul>${strani.map((x) => `<li>${esc(x.t)}</li>`).join('')}</ul></div></div>` : ''}
          ${c.origine.dubbi.length ? `<div class="imp-note info">${ic('info')}<div><b>Punti dubbi nella lettura</b><ul>${c.origine.dubbi.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div>` : ''}
          ${c.origine.nonMappati.length ? `<details class="imp-more"><summary>Voci del documento senza un campo nel check (${c.origine.nonMappati.length}): restano annotate nel check</summary><ul>${c.origine.nonMappati.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
        </div>`;
      }).join('')}
      ${a ? `<label class="chk imp-anag"><input type="checkbox" id="imp-anag" ${st.usaAnag ? 'checked' : ''}> Completa la scheda cliente con i dati trovati nel documento: ${esc(a.map(([, l, v]) => `${l} ${v}`).join(', '))}</label>` : ''}
      <div class="row" style="margin-top:16px;gap:8px"><button class="btn" id="imp-altri">${ic('upload')} Altri file</button><span class="grow"></span><button class="btn" id="imp-annulla">Annulla</button><button class="btn primary" id="imp-ok" ${buoni.length ? '' : 'disabled'}>${ic('check')} ${buoni.length === 1 ? 'Importa 1 check' : `Importa ${buoni.length} check`}</button></div>`;
    el.querySelectorAll('[data-imp="inc"]').forEach((x) => { x.onchange = () => { st.voci[+x.dataset.i].includi = x.checked; disegna(); }; });
    el.querySelectorAll('[data-imp="data"]').forEach((x) => { x.onchange = () => {
      const v = st.voci[+x.dataset.i], d = x.value;
      v.check.date = d ? d + 'T09:00' : '';
      v.check.sintesi.prossimoCheck = d ? addDaysISO(d, ECL_SOGLIE.giorniBlocco) : '';
      if (d && !v.toccato) v.includi = true;
      disegna();
    }; });
    const an = el.querySelector('#imp-anag'); if (an) an.onchange = () => { st.usaAnag = an.checked; };
    el.querySelector('#imp-annulla').onclick = () => chiudi();
    el.querySelector('#imp-altri').onclick = () => { st.fase = 'scegli'; st.errore = ''; disegna(); };
    el.querySelector('#imp-ok').onclick = () => salva();
  };

  const carica = async (file) => {
    let r;
    try {
      r = await fetch('/api/checkup/carica-vecchio?nome=' + encodeURIComponent(file.name), { method: 'POST', headers: { 'X-Eclipsis': '1', 'Content-Type': 'application/octet-stream' }, body: file, signal: st.ctl.signal });
    } catch (e) { throw new Error(st.chiuso ? 'Interrotto.' : 'Server della dashboard non raggiungibile.'); }
    let j = {};
    try { j = await r.json(); } catch (e) { /* */ }
    if (!r.ok) throw new Error(j.errore || `Caricamento non riuscito (errore ${r.status}).`);
    return j;
  };

  const avvia = async (files) => {
    files = files.filter((f) => f && f.name);
    if (!files.length) return;
    const troppo = files.find((f) => f.size > 40 * 1024 * 1024);
    if (troppo) { st.errore = `"${troppo.name}" supera i 40 MB.`; disegna(); return; }
    const nuovi = files.map((f) => ({ file: f, nome: f.name, stato: 'attesa', msg: 'In attesa', descr: '' }));
    st.file = st.file.filter((f) => f.stato === 'fatto' || f.stato === 'errore').concat(nuovi);
    st.fase = 'lavoro';
    disegna();
    const test = testDefs().slice(0, 60).map((t) => ({ id: t.id, nome: t.nome, unita: t.unita || '', bi: !!t.bi }));
    for (const f of nuovi) {
      if (st.chiuso) return;
      try {
        f.stato = 'lavoro'; f.msg = 'Carico il file…'; disegna();
        const up = await carica(f.file);
        st.ids.push(up.id);
        f.msg = up.convertito ? 'File convertito in testo. Eclipsis inizia a leggere…' : 'Eclipsis inizia a leggere…'; disegna();
        const out = await eclJob({ tipo: 'import', file: up.id, test }, { signal: st.ctl.signal, onTick: (s) => { f.msg = eclFase(s, 'i dati dei check'); if (st.fase === 'lavoro') disegna(); } });
        const checks = Array.isArray(out && out.checks) ? out.checks.filter((x) => x && typeof x === 'object') : [];
        const generali = Array.isArray(out && out.dubbi) ? out.dubbi : [];
        checks.forEach((d) => {
          const c = eclCheckDaImport(client.id, Object.assign({}, d, { dubbi_file: generali }), f.nome);
          st.voci.push({ check: c, file: f.nome, includi: !!c.date && !esistenti().has(String(c.date).slice(0, 10)), toccato: false });
        });
        const an = (out && out.anagrafica) || {};
        const trovati = [];
        if ((an.sesso === 'M' || an.sesso === 'F') && !client.anag.sesso) trovati.push(['sesso', 'sesso', an.sesso === 'M' ? 'uomo' : 'donna', an.sesso]);
        if (num(an.altezza) !== null && num(an.altezza) > 100 && num(an.altezza) < 230 && !client.anag.altezza) trovati.push(['altezza', 'altezza', `${fmtN(num(an.altezza), 0)} cm`, String(num(an.altezza))]);
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(an.dataNascita || '')) && !client.anag.dataNascita) trovati.push(['dataNascita', 'data di nascita', fmtDate(an.dataNascita), an.dataNascita]);
        if (trovati.length) st.anag = (st.anag || []).filter((x) => !trovati.some((t) => t[0] === x[0])).concat(trovati);
        f.stato = 'fatto'; f.descr = String((out && out.descrizione) || ''); f.dubbi = generali.map((x) => String(x).trim()).filter(Boolean).slice(0, 20);
        f.msg = checks.length ? `${checks.length} check ${checks.length === 1 ? 'trovato' : 'trovati'}${f.descr ? ' · ' + f.descr : ''}` : `Nessun check trovato${f.descr ? ' · ' + f.descr : ''}`;
      } catch (e) {
        if (st.chiuso) return;
        f.stato = 'errore'; f.msg = (e && e.message) || 'Conversione non riuscita.';
      }
      disegna();
    }
    if (st.chiuso) return;
    st.voci.sort((x, y) => String(x.check.date || '9999').localeCompare(String(y.check.date || '9999')));
    st.fase = 'anteprima';
    disegna();
  };

  const pulisci = () => { st.ids.splice(0).forEach((id) => DB.call('import-pulisci', { id }).catch(() => {})); };
  const chiudi = () => { if (modal) { const b = modal.querySelector('[data-close]'); if (b) b.click(); } };

  const salva = async () => {
    const scelti = st.voci.filter((v) => v.includi && v.check.date);
    if (!scelti.length) return;
    const btn = corpo().querySelector('#imp-ok'); if (btn) btn.disabled = true;
    try {
      for (const v of scelti) {
        v.check.updatedAt = Date.now();
        S.checks.push(v.check);
        await DB.put('checks', v.check);
      }
      if (st.anag && st.usaAnag) {
        st.anag.forEach(([k, , , val]) => { if (!client.anag[k]) client.anag[k] = val; });
        touch('client', client);
      }
      st.salvato = true;
      chiudi();
      await flush();
      go({ v: 'client', clientId: client.id, tab: 'overview' });
      toast(`${ic('check')} ${scelti.length === 1 ? '1 check importato' : scelti.length + ' check importati'}: aprili dalla linea temporale per controllarli o completarli.`, '', 6000);
    } catch (e) {
      if (btn) btn.disabled = false;
      toast(esc((e && e.message) || 'Salvataggio non riuscito.'), 'bad', 6000);
    }
  };

  openModal({
    title: 'Carica check vecchi', wide: true,
    body: '<div id="imp-body" class="imp"></div>',
    onOpen: (m) => { modal = m; m.querySelector('.modal').classList.add('imp-modal'); disegna(); },
    onClose: () => { st.chiuso = true; try { st.ctl.abort(); } catch (e) { /* */ } pulisci(); modal = null; },
  });
}

/* =========================================================================
   6 · Collegamento con la dashboard
   ========================================================================= */
/** "Carica check vecchi" dalla barra in alto: prima si sceglie di chi sono */
function eclImportScegli() {
  if (!ECL.on) { eclSpento('I check vecchi (PDF, foto, Excel, Word) li legge e li converte Eclipsis.'); return; }
  const lista = S.clients.slice().sort((a, b) => clientName(a).localeCompare(clientName(b), 'it'));
  if (!lista.length) { newClientModal(); toast('Crea prima la scheda del cliente: poi carichi i suoi check vecchi dalla sua pagina.', '', 7000); return; }
  openModal({
    title: 'Di chi sono i check vecchi?',
    body: `<p style="margin:0 0 12px;line-height:1.55">Scegli il cliente: Eclipsis legge i file e li trasforma in check uguali a quelli compilati a mano, dentro il suo storico.</p>
      <div class="fld"><label>Cliente</label><select class="sel" id="imp-chi">${lista.map((c) => `<option value="${esc(c.id)}">${esc(clientName(c))}${eclCodice(c) ? ' · ' + eclCodice(c) : ''}</option>`).join('')}</select></div>
      <p class="small muted" style="margin:10px 0 0">Se il cliente non c'è ancora, chiudi e crealo con "Nuovo".</p>`,
    actions: [{ label: 'Annulla' }, { label: 'Continua', cls: 'primary', fn: (bg) => { const id = bg.querySelector('#imp-chi').value; setTimeout(() => { go({ v: 'client', clientId: id, tab: 'overview' }); setTimeout(eclImportModal, 250); }, 0); } }],
  });
}

function eclClienteHTML(c) {
  const cod = eclCodice(c);
  if (cod) {
    const p = (ECL.persone || []).find((x) => x.id === cod);
    if (!p) return `<div class="ecl-link warn">${ic('alert')}<span>Il codice <b>${esc(cod)}</b> non c'è tra i clienti dell'area coach: crealo lì, poi i risultati dei check arrivano nel suo profilo.</span></div>`;
    return `<div class="ecl-link good">${ic('check')}<span>Collegato al cliente <b>${esc(cod)}</b> dell'area coach: al PDF cliente peso, misure e foto arrivano nel suo profilo.</span>
      <label class="toggle" style="margin-left:auto"><input type="checkbox" data-act="ck-bia" data-cod="${esc(cod)}" ${p.biaTest ? 'checked' : ''}><span class="sw"></span> Mostra al cliente anche BIA e test</label></div>`;
  }
  if (DB.mode !== 'cloud') return '';
  return `<div class="ecl-link warn">${ic('alert')}${eclCodiceHTML(c)}</div>`;
}
function eclTrovaCliente(cod) {
  return S.clients.find((c) => eclCodice(c) === cod) || null;
}
/** #cliente=C001 apre il cliente con quel codice; #nuovo=C001 propone di crearlo */
function eclRotta() {
  const h = decodeURIComponent(String(location.hash || '').replace(/^#/, ''));
  const m = /^(cliente|nuovo)=([A-Za-z]\d{3,4})$/.exec(h);
  if (!m) return;
  const cod = m[2].toUpperCase();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* */ }
  const cl = eclTrovaCliente(cod);
  if (cl) { go({ v: 'client', clientId: cl.id, tab: 'overview' }); return; }
  go({ v: 'home' });
  newClientModal(cod);
  toast(`Nel gestionale dei check non c'è ancora una scheda con il codice ${esc(cod)}: creala qui, oppure scrivi il codice nella scheda di un cliente che esiste già.`, '', 8000);
}

/* ------------------------------ azioni ------------------------------ */
async function eclAct(act, el, e) {
  switch (act) {
    case 'ecl-import': await flush(); if (S.client && (S.view.v === 'client' || S.view.v === 'check')) eclImportModal(); else eclImportScegli(); return true;
    case 'ecl-collega': if (e) e.preventDefault(); await eclCollega(el); return true;
    case 'ecl-passa': await eclPassa(); return true;
    case 'ck-bia': {
      const on = !!el.checked, cod = el.dataset.cod;
      try {
        await window.MSC_API.chiama('co_salvaCliente', [null, cod, { biaTest: on }]);
        const p = (ECL.persone || []).find((x) => x.id === cod); if (p) p.biaTest = on;
        toast(on ? `${ic('check')} ${esc(cod)} vedrà anche BIA, pliche e test nel suo profilo.` : `${esc(cod)} vedrà solo peso, misure e foto.`, '', 4500);
      } catch (e) { el.checked = !on; toast('Non salvato: ' + esc(String(e.message || e).replace(/^[A-Z]+\|/, '')), 'bad', 6000); }
      return true;
    }
    case 'ecl-scheda': {
      if (e) e.preventDefault();
      if (!S.client) return true;
      await flush();
      go({ v: 'client', clientId: S.client.id, tab: 'sheet' });
      setTimeout(() => { const i = $('[data-b="anag.codice"]'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); } }, 120);
      return true;
    }
    case 'ecl-orig-ok': {
      if (e) e.preventDefault();
      if (!S.check || !S.check.origine) return true;
      S.check.origine.visto = true;
      touch('check');
      const b = el.closest('.ecl-orig'); if (b) b.remove();
      refreshDash();
      return true;
    }
    default: return false;
  }
}

<script>
/* Sezione Check dentro l'area coach (Matti 26/11): la pagina segue il tema dell'area coach (scuro o chiaro),
   anche quando lo cambi con la pagina aperta. I grafici a schermo si ridisegnano con i colori del tema;
   i PDF restano chiari. Aggiunto da tools/porta-check.py subito dopo eclipsis.js. */

/* grafici a schermo nel tema chiaro: stessi colori dell'area coach */
ECL_TEMA.schermoChiaro = {
  testo: '#7D6E86', linee: 'rgba(122,74,136,.14)', griglia: 'rgba(122,74,136,.10)', zero: 'rgba(122,74,136,.45)', punto: '#FFFFFF', tooltip: '#1C1022',
  font: ECL_TEMA.scuro.font,
  pal: ['#9B2FA3', '#0891B2', '#C2410C', '#2563EB', '#DB2777', '#65A30D'],
  ord: { t0: '#D8B4FE', ref: '#B878D6', cur: '#7A1C82' },
};

/* il tema scelto nell'area coach: dalla pagina che contiene i check, altrimenti dall'ultima scelta salvata */
function ckTemaScelto() {
  let t = null;
  try { if (window.parent !== window) t = window.parent.document.documentElement.getAttribute('data-tema'); } catch (e) { /* */ }
  if (!t) { try { t = localStorage.getItem('msc_tema'); } catch (e) { /* */ } }
  return t === 'chiaro' ? 'chiaro' : 'scuro';
}
/* colori dei grafici a schermo per il tema della pagina */
function ckTemaGrafici() {
  return document.documentElement.getAttribute('data-tema') === 'chiaro' ? 'schermoChiaro' : 'scuro';
}
function ckTemaAggiorna() {
  const t = ckTemaScelto();
  if (document.documentElement.getAttribute('data-tema') === t) return;
  document.documentElement.setAttribute('data-tema', t);
  eclTema(ckTemaGrafici());
  try {
    if (typeof S !== 'undefined' && S.dashCtx && document.getElementById('dash')) ['comp', 'circ', 'forza', 'ben'].forEach((k) => drawChart(k, S.dashCtx));
  } catch (e) { console.warn(e); }
}
(function () {
  document.documentElement.setAttribute('data-tema', ckTemaScelto());
  if (window.parent !== window) {
    try { new MutationObserver(ckTemaAggiorna).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-tema'] }); } catch (e) { /* */ }
  }
  window.addEventListener('storage', (e) => { if (e.key === 'msc_tema') ckTemaAggiorna(); });
})();

</script>

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

function getP(obj, path) {
  return path.split('.').reduce((a, k) => (a == null ? undefined : a[k]), obj);
}
function setP(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) {
    const k = ks[i];
    if (o[k] == null || typeof o[k] !== 'object') o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    o = o[k];
  }
  o[ks[ks.length - 1]] = val;
}

/** Converte input (anche con virgola) in numero o null */
function num(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).trim().replace(/\s/g, '').replace(',', '.');
  if (s === '' || s === '-' || s === '.') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function fmtN(v, d = 1) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  return Number(v).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
}
const withU = (u) => (u ? (u === '°' ? '°' : ' ' + u) : '');
function fmtSigned(v, d = 1) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const r = Number(v.toFixed(d));
  const s = Math.abs(r).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
  return (r > 0 ? '+' : r < 0 ? '−' : '±') + s;
}
function avg(arr) {
  const v = (arr || []).map(num).filter((x) => x !== null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function parseDate(s) {
  if (!s) return null;
  const d = new Date(s.length <= 10 ? s + 'T12:00:00' : s);
  return isNaN(d) ? null : d;
}
function fmtDate(s, opts) {
  const d = typeof s === 'string' ? parseDate(s) : s;
  if (!d) return '—';
  return d.toLocaleDateString('it-IT', opts || { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDateLong(s) {
  return fmtDate(s, { day: 'numeric', month: 'long', year: 'numeric' });
}
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function nowLocalISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function addDaysISO(s, days) {
  const d = parseDate(s);
  if (!d) return '';
  d.setDate(d.getDate() + days);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  const da = parseDate(a), db = parseDate(b);
  if (!da || !db) return null;
  return Math.round((db - da) / 86400000);
}
function ageFrom(birth, at) {
  const b = parseDate(birth);
  const t = at ? parseDate(at) : new Date();
  if (!b || !t) return null;
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function slug(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '');
}

const DOC_MAX = 2000000;
function ckSenzaAccesso() {
  document.body.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:var(--bg,#0B0810);color:var(--ink,#eee)"><div style="max-width:420px;text-align:center;line-height:1.55"><h2 style="margin:0 0 10px">Entra prima nell'area coach</h2><p style="margin:0 0 16px;opacity:.8">La sezione Check si apre dall'area coach, con il tuo accesso da coach.</p><a href="./index.html" style="display:inline-block;padding:10px 18px;border-radius:10px;background:#7C5CFF;color:#fff;text-decoration:none;font-weight:600">Vai all'area coach</a></div></div>`;
}
const DB = {
  mode: 'memory', memory: null, chains: {},
  async call(path, body) {
    await window.MSC_API_PRONTA;
    if (path === 'eclipsis' && body) body = Object.assign({}, body, { regole: String(S.settings.metodoAI || '') });
    let r;
    try { r = await window.MSC_API.chiama('co_check', [null, path, body]); } catch (e) {
      const m = String((e && e.message) || e || '');
      const er = new Error(m.replace(/^[A-Z]+\|/, '') || 'Errore');
      er.code = window.CK_SENZA_ACCESSO && window.CK_SENZA_ACCESSO(m) ? 'accesso' : /connessione|fetch|network/i.test(m) ? 'unavailable' : 'server';
      throw er;
    }
    if (r && r.scarica) saveFile(r.scarica.nome, new Blob([r.scarica.testo + '\n'], { type: 'text/markdown' }));
    return r;
  },
  async open() {
    this.memory = { clients: new Map(), checks: new Map(), photos: new Map(), settings: new Map() };
    try { await this.call('stato'); this.mode = 'cloud'; return true; } catch (e) {
      console.warn(e);
      if (e.code === 'accesso') { ckSenzaAccesso(); return new Promise(() => {}); }
      return false;
    }
  },
  keyOf(store, o) { return store === 'settings' ? o.key : o.id; },
  async all(store) {
    if (this.mode !== 'cloud') return Array.from(this.memory[store].values()).map(clone);
    return (await this.call('lista?store=' + store)).elementi;
  },
  async byIndex(store, index, value) {
    if (this.mode !== 'cloud') return Array.from(this.memory[store].values()).filter((x) => x[index] === value).map(clone);
    return (await this.call(`lista?store=${store}&campo=${encodeURIComponent(index)}&valore=${encodeURIComponent(value)}`)).elementi;
  },
  async get(store, key) {
    if (this.mode !== 'cloud') { const v = this.memory[store].get(key); return v ? clone(v) : undefined; }
    const r = await this.call(`doc?store=${store}&id=${encodeURIComponent(key)}`);
    return r.elemento || undefined;
  },
  chain(path, fn) {
    const prev = this.chains[path] || Promise.resolve();
    const p = prev.catch(() => {}).then(fn);
    this.chains[path] = p;
    return p;
  },
  async put(store, obj) {
    const key = this.keyOf(store, obj);
    if (this.mode !== 'cloud') { this.memory[store].set(key, clone(obj)); return; }
    const body = { store, id: key, elemento: JSON.parse(JSON.stringify(obj)) };
    const size = JSON.stringify(body).length;
    if (size > DOC_MAX) { const e = new Error(`Dati troppo grandi per un singolo salvataggio (${Math.round(size / 1024)} KB).`); e.code = 'too_big'; throw e; }
    return this.chain(store + '/' + key, () => this.call('salva', body));
  },
  async del(store, key) {
    if (this.mode !== 'cloud') { this.memory[store].delete(key); return; }
    return this.chain(store + '/' + key, () => this.call('elimina', { store, id: key }));
  },
  async clear(store) {
    const items = await this.all(store);
    await this.parallel(items, (o) => this.del(store, this.keyOf(store, o)));
  },
  async bulkPut(store, arr) {
    if (!arr || !arr.length) return;
    await this.parallel(arr, (o) => this.put(store, o));
  },
  async parallel(items, fn, n = 4) {
    let i = 0;
    const errs = [];
    const worker = async () => { while (i < items.length) { const it = items[i++]; try { await fn(it); } catch (e) { errs.push(e); } } };
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
    if (errs.length) throw errs[0];
  },
  async getSetting(key, def) {
    const r = await this.get('settings', key);
    return r ? r.value : def;
  },
  async setSetting(key, value) {
    return this.put('settings', { key, value });
  },
};

/* ------------------- Compressione foto via <canvas> ------------------- */
function compressImage(file, maxSide = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Formato immagine non leggibile'));
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: c.toDataURL('image/jpeg', quality), w, h });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/** Comprime fino a stare sotto maxChars (per i documenti del database) */
async function fitDataUrl(src, maxChars = 230000) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Immagine non leggibile')); i.src = src; });
  const steps = [[1200, 0.82], [1200, 0.72], [1100, 0.66], [1000, 0.62], [900, 0.6], [800, 0.58], [700, 0.55]];
  let out = null;
  for (const [side, q] of steps) {
    const sc = Math.min(1, side / Math.max(img.width, img.height));
    const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
    out = { dataUrl: c.toDataURL('image/jpeg', q), w, h };
    if (out.dataUrl.length <= maxChars) return out;
  }
  return out;
}
async function compressPhoto(file) {
  const first = await compressImage(file, 1200, 0.82);
  return first.dataUrl.length <= 230000 ? first : fitDataUrl(first.dataUrl);
}
function compressDataUrlLogo(file, maxSide = 520) {
  // per il logo manteniamo PNG (trasparenza)
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Formato immagine non leggibile'));
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let u = c.toDataURL('image/png');
        if (u.length > 160000) u = c.toDataURL('image/webp', 0.9);
        if (u.length > 160000) u = c.toDataURL('image/webp', 0.75);
        resolve(u);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  if (['c_vitaOmb', 'c_vitaMin', 'c_fianchi'].includes(k) && -delta / wk > 0.5) notes.push(`più di 0,5 cm a settimana: molto ambizioso`);
  if (k.startsWith('e1rm:') && (delta / start) * (12 / wk) > 0.15) notes.push(`+${fmtN((delta / start) * 100, 0)}% di e1RM: ambizioso per chi si allena da tempo`);
  return notes.length ? notes.join(' · ') : '';
}

/* ----------------------------- toast/modal ----------------------------- */
function toast(msg, kind = '', ms = 3200) {
  let box = $('.toasts');
  if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = msg;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, ms);
}
function openModal({ title, body, actions = [], wide = false, onOpen, onClose }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog">
    <div class="modal-h"><div class="h2">${title}</div><span class="grow"></span><button class="btn ghost icon" data-close>${ic('x')}</button></div>
    <div class="modal-b">${body}</div>
    ${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-mact="${i}">${a.label}</button>`).join('')}</div>` : ''}
  </div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  bg.querySelector('[data-close]').onclick = close;
  bg.querySelectorAll('[data-mact]').forEach((b) => {
    b.onclick = async () => {
      const a = actions[+b.dataset.mact];
      const r = a.fn ? await a.fn(bg) : true;
      if (r !== false) close();
    };
  });
  document.body.appendChild(bg);
  const first = bg.querySelector('input,textarea');
  if (first) setTimeout(() => first.focus(), 30);
  if (onOpen) onOpen(bg);
  return close;
}
function confirmBox(title, text, okLabel = 'Conferma', danger = false) {
  return new Promise((res) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; res(v); } };
    openModal({
      title, body: `<p style="margin:0;line-height:1.55">${text}</p>`,
      actions: [
        { label: 'Annulla', fn: () => finish(false) },
        { label: okLabel, cls: danger ? 'danger' : 'primary', fn: () => finish(true) },
      ],
      onClose: () => finish(false),
    });
  });
}
function lightbox(src) {
  const d = document.createElement('div');
  d.className = 'lightbox';
  d.innerHTML = `<img src="${src}" alt="">`;
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}

function fieldHTML(f, data, scope) {
  const w = `w${f.w || 6}`;

    case 'text':
      return `<div class="fld ${w}">${lbl}${hint}${inputHTML(f.p, scope, val, { ph: f.ph || '' })}</div>`;
    case 'num':
      return `<div class="fld ${w}">${lbl}${hint}${inputHTML(f.p, scope, val, { numeric: true, unit: f.u })}</div>`;
    case 'date':
    case 'datetime':
      return `<div class="fld ${w}">${lbl}${hint}<input class="inp" type="${f.t === 'date' ? 'date' : 'datetime-local'}" data-b="${f.p}" data-s="${scope}" value="${esc(val || '')}">${f.after ? `<div class="hint" data-calc="${f.after}"></div>` : ''}</div>`;

    case 'scale': {
      const opts = [];
      for (let i = f.min; i <= f.max; i++) opts.push([String(i), String(i)]);
      return `<div class="fld ${w}">${lbl}${hint}${segHTML(f.p, scope, opts, val, 'scale')}${f.lo ? `<div class="hint" style="display:flex;justify-content:space-between;max-width:${(f.max - f.min + 1) * 42}px"><span>${esc(f.lo)}</span><span>${esc(f.hi)}</span></div>` : ''}</div>`;

      return `<div class="fld ${w}" style="justify-content:flex-end"><label class="chk"><input type="checkbox" data-b="${f.p}" data-s="${scope}" ${val ? 'checked' : ''}> ${esc(f.l)}</label></div>`;
    case 'multi':

   04 · Confronti, delta, highlights, storico e configurazioni grafici
   ========================================================================= */

// palette categoriale validata (CVD-safe) + scala ordinale brand T0 → rif → attuale
const PAL = ['#7E22CE', '#0891B2', '#C2410C', '#2563EB', '#DB2777', '#65A30D'];
const ORD = { t0: '#D8B4FE', ref: '#A855F7', cur: '#4B0055' };

function unitTxt(m) { return m.u && m.u !== '/5' ? ' ' + m.u : m.u === '/5' ? '/5' : ''; }
function valTxt(m, v) {
  if (v === null || v === undefined) return '—';
  return fmtN(v, m.d) + unitTxt(m);
}
function deltaParts(m, cur, ref) {
  if (cur === null || ref === null || cur === undefined || ref === undefined) return null;
  const d = cur - ref;
  const pct = ref !== 0 && !m.nopct && m.u !== '%' && m.u !== '/5' && m.u !== '' ? (d / Math.abs(ref)) * 100 : null;
  const unit = m.u === '%' ? ' pt' : m.u === '/5' ? '' : withU(m.u);
  return { d, pct, txt: `${fmtSigned(d, m.d)}${unit}`, pctTxt: pct !== null ? `${fmtSigned(pct, 1)}%` : '' };
}
function deltaBadge(m, cur, ref, check, client, { short = false, label = '' } = {}) {
  const p = deltaParts(m, cur, ref);
  if (!p) return '';
  const st = deltaState(m, cur, ref, check, client) || 'neutral';
  const arrow = st === 'stable' ? (Math.abs(p.d) < 1e-9 ? '=' : '≈') : p.d > 0 ? '▲' : '▼';
  const err = errOf(m);
  return `<span class="delta ${st}" title="${st === 'good' ? 'Miglioramento reale (oltre l\'errore di misura)' : st === 'bad' ? 'Da monitorare (oltre l\'errore di misura)' : st === 'stable' ? `Entro l'errore di misura (±${fmtN(err, err < 1 ? 2 : 1)}): non è un cambiamento reale` : 'Variazione'}">${label ? label + ' ' : ''}<span style="font-size:8px">${arrow}</span> ${p.txt}${!short && p.pctTxt ? ` · ${p.pctTxt}` : ''}</span>`;
}

/* ---------- contesto di confronto per un check ---------- */
function ctxFor(client, checks, check) {
  const meta = checkMeta(checks, check);
  return { client, check, meta, ref: meta.ref, t0: meta.t0, prev: meta.prev, series: meta.sorted.slice(0, meta.index + 1) };
}

/** HTML compatto di confronto inline per un campo */
function cmpHTML(mk, ctx, { compact = false } = {}) {
  const m = metricDef(mk);
  if (!m) return '';
  const cur = metricValue(mk, ctx.check, ctx.client);
  if (!ctx.ref) return compact ? '' : `<span class="small muted">Valore di partenza</span>`;
  const rv = metricValue(mk, ctx.ref, ctx.client);
  let h = `<span class="prev">${compact ? '' : (ctx.ref === ctx.t0 ? 'T0' : 'Prec.') + ': '}<b>${rv === null ? '—' : fmtN(rv, m.d)}</b></span>`;
  h += deltaBadge(m, cur, rv, ctx.check, ctx.client, { short: compact });

    const p = deltaParts(m, cur, tv);
    if (p) h += `<span class="delta t0">da T0 ${p.txt}</span>`;
  }

}

function asyBadge(a) {
  if (a === null) return '<span class="muted small">—</span>';
  const cls = a > 10 ? 'bad' : a > 5 ? 'warn' : 'ok';
