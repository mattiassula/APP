}

/* ---------- Highlights ---------- */
const HL_GROUPS = ['peso', 'bia', 'circ', 'pliche', 'forza', 'mob', 'indici'];
function allMetricKeys(series) {
  const keys = METRICS.map((m) => m.k);
  const ex = [];
  series.forEach((c) => (c.forza || []).forEach((r) => { if (r.es && !ex.includes(exKey(r.es))) ex.push(exKey(r.es)); }));
  const names = {};
  series.forEach((c) => (c.forza || []).forEach((r) => { if (r.es) names[exKey(r.es)] = r.es.trim(); }));
  return keys.concat(ex.map((k) => 'e1rm:' + names[k]));
}
function computeHighlights(ctx, n = 4) {
  const { check, client, ref } = ctx;
  const rep = check.report || {};
  const mk = (k) => {
    const m = metricDef(k);
    if (!m) return null;
    const cur = metricValue(k, check, client);
    const rv = ref ? metricValue(k, ref, client) : null;
    return { k, m, cur, ref: rv, st: ref ? deltaState(m, cur, rv, check, client) : null };
  };
  if (rep.highlightsMode === 'manual' && rep.highlights?.length) {
    return rep.highlights.map(mk).filter((x) => x && x.cur !== null).slice(0, n);
  }
  const out = [];
  const pesoK = metricValue('pesoMedio', check, client) !== null ? 'pesoMedio' : 'peso';
  const p = mk(pesoK);
  if (p && p.cur !== null) out.push(p);
  if (!ref) {
    ['b_pbf', 'p_bf', 'b_smm', 'c_vitaOmb', 'c_braccioCon_dx'].forEach((k) => {
      if (ctx.exclude && ctx.exclude.has(k)) return;
      const x = mk(k);
      if (out.length < n && x && x.cur !== null && !(k === 'p_bf' && out.some((o) => o.k === 'b_pbf'))) out.push(x);
    });
    return out.slice(0, n);
  }
  const cands = allMetricKeys(ctx.series)
    .filter((k) => k !== pesoK && k !== 'peso' && k !== 'pesoMedio' && !(ctx.exclude && ctx.exclude.has(k)))
    .map(mk)
    .filter((x) => x && x.cur !== null && x.ref !== null && x.m.cli !== false && HL_GROUPS.includes(x.m.g) && x.m.g !== 'mob'
      && (x.m.g !== 'pliche' || ['p_sum', 'p_bf'].includes(x.m.k)))
    .map((x) => {
      const dp = deltaParts(x.m, x.cur, x.ref);
      const rel = x.m.u === '%' ? Math.abs(dp.d) * 3 : Math.abs(dp.pct ?? (dp.d / (Math.abs(x.ref) || 1)) * 100);
      const gw = { bia: 1.6, pliche: 1.5, circ: 1.4, forza: 1.2, indici: 0.6, mob: 0.1 }[x.m.g] || 1;
      return Object.assign(x, { score: (x.st === 'good' ? 1000 : x.st === 'stable' ? 0 : -1000) + rel * gw });
    })
    .sort((a, b) => b.score - a.score);
  const usedG = new Set();
  for (const c of cands) { if (out.length >= n) break; if (c.st === 'good' && !usedG.has(c.m.g)) { out.push(c); usedG.add(c.m.g); } }
  for (const c of cands) { if (out.length >= n) break; if (!out.includes(c) && c.st === 'good') out.push(c); }
  for (const c of cands) { if (out.length >= n) break; if (!out.includes(c)) out.push(c); }
  return out.slice(0, n);
}
function highlightsHTML(ctx) {
  const hl = computeHighlights(ctx);
  if (!hl.length) return `<div class="hl" style="grid-column:span 4"><div class="hl-l">Highlights</div><div class="small muted" style="margin-top:4px">Inserisci peso e misure: qui compaiono le variazioni principali del blocco.</div></div>`;
  return hl.map((x, i) => `<div class="hl ${i === 0 ? 'lead' : ''}"><div class="hl-l" title="${esc(x.m.l)}">${esc(x.m.l)}</div>
    <div class="hl-v">${fmtN(x.cur, x.m.d)}<small>${esc(x.m.u === '/5' ? '/5' : x.m.u)}</small></div>
    ${ctx.ref ? deltaBadge(x.m, x.cur, x.ref, ctx.check, ctx.client) : '<span class="delta neutral">Punto di partenza</span>'}</div>`).join('');
}

/* ---------- Storico multi-check ---------- */
function historyRows(ctx, { clientOnly = false } = {}) {
  const series = ctx.series;
  const keys = allMetricKeys(series);
  const rows = [];
  let lastG = null;
  const order = ['peso', 'bia', 'biaSeg', 'pliche', 'circ', 'indici', 'forza', 'mob', 'ben', 'bil'];
  const byG = {};
  keys.forEach((k) => { const m = metricDef(k); if (m) (byG[m.g] = byG[m.g] || []).push(m); });
  order.forEach((g) => (byG[g] || []).forEach((m) => {
    if (clientOnly && m.cli === false) return;
    const vals = series.map((c) => metricValue(m.k, c, ctx.client));
    if (vals.every((v) => v === null)) return;
    if (g !== lastG) { rows.push({ group: GROUP_LABEL[g] }); lastG = g; }
    rows.push({ m, vals });
  }));
  return rows;
}
function historyTableHTML(ctx) {

      ${r.vals.map((v, i) => `<td class="${i === last ? 'cur' : ''}">${v === null ? '<span class="muted">—</span>' : fmtN(v, r.m.d)}</td>`).join('')}
      ${hasPrev ? `<td class="dl">${deltaBadge(r.m, r.vals[last], r.vals[last - 1], check, client, { short: true }) || '<span class="muted">—</span>'}</td>
      <td class="dl">${deltaBadge(r.m, r.vals[last], r.vals[0], check, client, { short: true }) || '<span class="muted">—</span>'}</td>` : ''}
    </tr>`).join('')}
  </tbody></table>`;
}

/* ---------- Asimmetrie ---------- */
function asymList(check, ref) {
  const L = [];
  CIRC_BI.forEach(([k, l]) => L.push({ l, u: 'cm', sx: num(check.misure?.circ?.[k]?.sx), dx: num(check.misure?.circ?.[k]?.dx), a: asym(check.misure?.circ?.[k]?.sx, check.misure?.circ?.[k]?.dx), pa: ref ? asym(ref.misure?.circ?.[k]?.sx, ref.misure?.circ?.[k]?.dx) : null }));
  [['b', 'Braccio · massa magra BIA'], ['g', 'Gamba · massa magra BIA']].forEach(([k, l]) => {

}

const CIRC_TABS = [['tronco', 'Tronco'], ['arti', 'Arti'], ['var', 'Variazioni'], ['radar', 'Radar']];

}
function goalsDashHTML(ctx) {

const clientChecks = (id) => sortChecks(S.checks.filter((c) => c.clientId === id));
const photoOf = (checkId, slot) => { for (const p of S.photos.values()) if (p.checkId === checkId && p.slot === slot) return p; return null; };
const logoSrc = () => S.settings.logo || LOGO_DEFAULT;
const initials = (c) => ((c.anag?.nome || '?')[0] + (c.anag?.cognome || '')[0] || '').toUpperCase();

function clientAlerts(client) {
  const A = [];
  const sc = client.screening || {};
  const med = SCREENING_MEDICAL.filter((n) => sc['q' + n] === 'si');
  const oth = [5, 6, 7].filter((n) => sc['q' + n] === 'si');
  if (med.length) A.push(['bad', 'alert', `<b>Parere medico richiesto</b> prima di iniziare o proseguire: risposta "Sì" alle domande ${med.join(', ')} dello screening.`]);
  if (oth.length) A.push(['warn', 'info', `Screening: risposta "Sì" alle domande ${oth.join(', ')}${sc.dettagli ? ` · ${esc(sc.dettagli).slice(0, 140)}` : ' · verifica i dettagli.'}`]);
  const checks = clientChecks(client.id);
  const last = checks[checks.length - 1];
  const nextDue = last?.sintesi?.prossimoCheck || addDaysISO(todayISO(), BLOCK_WEEKS * 7);
  if (sc.certificato === 'no') A.push(['warn', 'file', 'Certificato medico di idoneità non presente.']);
  else if (sc.certScadenza) {
    if (sc.certScadenza < todayISO()) A.push(['bad', 'file', `<b>Certificato medico scaduto</b> il ${fmtDate(sc.certScadenza)}.`]);
    else if (sc.certScadenza < nextDue) A.push(['warn', 'file', `Il certificato medico scade il ${fmtDate(sc.certScadenza)}, prima del prossimo check (${fmtDate(nextDue)}).`]);
  }
  if (client.riab?.attivo) A.push(['info', 'activity', `<b>Percorso riabilitativo attivo</b>${client.riab.diagnosi ? ` · ${esc(client.riab.diagnosi)}` : ''}${client.riab.movEvitare ? ` · Da evitare: ${esc(client.riab.movEvitare)}` : ''}`]);
  if (client.consensi?.dati !== 'si') A.push(['warn', 'lock', 'Consenso al trattamento dei dati (inclusi quelli sulla salute) non ancora registrato: scarica il modulo nella sezione 14 della scheda e fallo firmare.']);
  else if (!client.consensi?.firmato) A.push(['info', 'file', 'Consensi registrati ma modulo firmato non segnato (sezione 14 della scheda).']);
  if (last?.sintesi?.prossimoCheck && last.sintesi.prossimoCheck < todayISO()) A.push(['warn', 'calendar', `Prossimo check previsto il ${fmtDate(last.sintesi.prossimoCheck)}: è in ritardo.`]);
  return A;
}
const alertsHTML = (A) => (A.length ? `<div class="alerts">${A.map(([k, i, t]) => `<div class="alert ${k}">${ic(i)}<div>${t}</div></div>`).join('')}</div>` : '');

function dueBadge(client) {
  const cs = clientChecks(client.id);
  if (!cs.length) return '<span class="ci-badge due">Check T0</span>';
  const due = cs[cs.length - 1].sintesi?.prossimoCheck;
  if (!due) return `<span class="ci-badge">${cs.length} check</span>`;
  const dd = daysBetween(todayISO(), due);
  if (dd < 0) return '<span class="ci-badge over">Check scaduto</span>';
  if (dd <= 10) return `<span class="ci-badge due">Check tra ${dd} gg</span>`;
  return `<span class="ci-badge">${cs.length} check</span>`;
}

  if (!cloud) { cls += ' bad'; txt = S.dbOk === false ? 'Archivio temporaneo' : 'Connessione…'; }

function destroyCharts() {
  Object.values(S.charts).forEach((c) => { try { c.destroy(); } catch (e) { /* */ } });
  S.charts = {};
}
function go(view) {
  S.view = view;
  S.client = view.clientId ? S.clients.find((c) => c.id === view.clientId) || null : null;
  S.check = view.checkId ? S.checks.find((c) => c.id === view.checkId) || null : null;
  if (view.v === 'check' && (!S.check || !S.client)) S.view = { v: S.client ? 'client' : 'home', clientId: S.client?.id, tab: 'overview' };
  $('.layout').classList.toggle('side-collapsed', S.view.v === 'check' && !S.sideOpenInCheck);
  $('.layout').classList.remove('side-open');
  renderSidebar();
  renderMain();
}
async function renderMain() {
  destroyCharts();
  const main = $('#main');
  if (S.view.v === 'home') { main.innerHTML = homeHTML(); return; }
  if (S.client && !S.loadedPhotos.has(S.client.id)) {
    const ph = await DB.byIndex('photos', 'clientId', S.client.id);
    ph.forEach((p) => S.photos.set(p.id, p));
    S.loadedPhotos.add(S.client.id);
  }
  if (S.view.v === 'client') {
    main.innerHTML = clientHTML();
    if (S.view.tab !== 'sheet') {
      const cs = clientChecks(S.client.id);
      if (cs.length) mountDash(ctxFor(S.client, cs, cs[cs.length - 1]));
    }
    refreshCalcs();
    main.scrollTop = S.view.scroll || 0;
    return;
  }
  if (S.view.v === 'check') {
    main.innerHTML = checkHTML();
    const ctx = curCtx();
    mountDash(ctx);
    refreshCalcs();
  }
}
const curCtx = () => ctxFor(S.client, clientChecks(S.client.id), S.check);

function birows(items, base, ctx, prefix, headL = 'Circonferenza', headR = ['Sinistra', 'Destra']) {

/* ---------------------------- Foto ---------------------------- */
function photoSlotHTML(check, slot, label, disabled = false, cap = '') {
  const p = photoOf(check.id, slot);
  if (p) {
    return `<div class="ph-slot has" data-slot="${slot}" data-act="zoom" data-src="photo:${p.id}"><img src="${p.dataUrl}" alt="">${cap ? `<div class="ph-cap">${cap}</div>` : ''}
      <div class="ph-actions"><button title="Sostituisci" data-act="photo-pick" data-slot="${slot}">${ic('upload')}</button><button title="Elimina" data-act="photo-del" data-id="${p.id}">${ic('trash')}</button></div></div>`;
  }
  return `<div class="ph-slot ${disabled ? 'ref' : ''}" data-slot="${slot}" ${disabled ? '' : `data-act="photo-pick"`}>${ic('camera')}<span>${disabled ? 'Non disponibile' : esc(label)}</span>${disabled ? '' : '<span style="font-size:10.5px">Clicca o trascina qui</span>'}</div>`;
}
function refPhotoHTML(ctx, slot) {
  const client = ctx.client;
  const cmp = photoCompareCheck(ctx);
  if (!cmp) return `<div class="ph-slot ref">${ic('image')}<span>Nessun check di confronto</span></div>`;
  const found = refPhotoFor(ctx, slot);
  if (!found) return `<div class="ph-slot ref">${ic('image')}<span>Nessuna foto di questa posa nei check precedenti</span></div>`;
  const { photo: p, check: refCheck } = found;
  const w = metricValue('pesoMedio', refCheck, client) ?? metricValue('peso', refCheck, client);
  return `<div class="ph-slot has ref" data-act="zoom" data-src="photo:${p.id}"><img src="${p.dataUrl}" alt=""><div class="ph-cap">${fmtDate(refCheck.date)}${w !== null ? ' · ' + fmtN(w, 1) + ' kg' : ''}</div></div>`;
}
function photoCompareCheck(ctx) {
  return ctx.check.foto?.compare === 't0' ? ctx.t0 : ctx.ref;
}
/** Foto di confronto per una posa: quella del check scelto o, se manca, la più recente dei check precedenti */
function refPhotoFor(ctx, slot) {
  const cmp = photoCompareCheck(ctx);
  if (!cmp) return null;
  const p = photoOf(cmp.id, slot);
  if (p) return { photo: p, check: cmp, fallback: false };
  const s = ctx.meta.sorted;
  const ci = s.findIndex((k) => k.id === cmp.id);
  const order = s.slice(0, ctx.meta.index).map((k, i) => [k, i]).sort((a, b) => Math.abs(a[1] - ci) - Math.abs(b[1] - ci) || b[1] - a[1]);
  for (const [k] of order) { const q = photoOf(k.id, slot); if (q) return { photo: q, check: k, fallback: true }; }
  return null;
}
function photosHTML(ctx) {
  const c = ctx.check, cl = ctx.client;
  const fotoNo = cl.consensi?.foto === 'no';
  if (fotoNo) return `<div class="alert warn">${ic('lock')}<div>Il cliente <b>non ha dato il consenso</b> a fotografie e video (sezione 14 della scheda). Il modulo foto è disattivato.</div></div>`;
  const cmp = photoCompareCheck(ctx);
  const poses = PHOTO_POSES.concat((c.foto?.extra || []).map((x) => [x.key, x.label, true]));
  const w = metricValue('pesoMedio', c, cl) ?? metricValue('peso', c, cl);
  return `${cl.consensi?.foto !== 'si' ? `<div class="alert warn" style="margin-bottom:12px">${ic('info')}<div>Consenso alle foto non ancora registrato nella scheda cliente.</div></div>` : ''}
    <div class="row wrap" style="margin-bottom:14px;gap:18px">
      <label class="toggle"><input type="checkbox" data-b="foto.includePdf" data-s="check" ${c.foto?.includePdf !== false ? 'checked' : ''}><span class="sw"></span> Includi sezione Foto nel Report PDF del Cliente</label>
      ${ctx.ref ? `<div class="ref-sel">Confronta con ${`<select class="sel" data-b="foto.compare" data-s="check" data-rerender="1"><option value="ref" ${c.foto?.compare !== 't0' ? 'selected' : ''}>Check di riferimento</option>${ctx.t0 && ctx.t0 !== ctx.ref ? `<option value="t0" ${c.foto?.compare === 't0' ? 'selected' : ''}>Check #1 · Inizio</option>` : ''}</select>`}</div>` : ''}
    </div>
    <div class="ph-grid">
      <div class="ph-row" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600"><span>Posa</span><span>Confronto</span><span>Attuale · ${fmtDate(c.date)}${w !== null ? ' · ' + fmtN(w, 1) + ' kg' : ''}</span></div>
      ${poses.map(([k, l, extra]) => `<div class="ph-row"><div class="pl">${esc(l)}${extra ? `<small><a href="#" data-act="pose-del" data-key="${k}">rimuovi posa</a></small>` : ''}</div>${refPhotoHTML(ctx, k)}${photoSlotHTML(c, k, l, false, `Oggi · ${fmtDate(c.date)}${w !== null ? ' · ' + fmtN(w, 1) + ' kg' : ''}`)}</div>`).join('')}
    </div>
    <button class="btn sm" style="margin-top:12px" data-act="pose-add">${ic('plus')} Aggiungi posa</button>`;
}

function calcHTML(key, ctx) {
  const c = ctx?.check, cl = ctx?.client || S.client;
  if (key === 'age') { const a = ageFrom(cl?.anag?.dataNascita); return a !== null ? `${a} anni` : ''; }
  if (!c) return '';
  if (key === 'pesoStats') {
    const v = (c.misure?.pesate || []).map(num).filter((x) => x !== null);
    if (!v.length) return '<div class="small muted">Inserisci le pesate: media, oscillazione e confronto si calcolano da soli.</div>';
    const mean = avg(v), mn = Math.min(...v), mx = Math.max(...v);
    const pd = ctx.ref ? metricValue('pesoMedio', ctx.ref, cl) : null;
    let rate = '';
    if (pd !== null && ctx.ref) {
      const wk = (daysBetween(ctx.ref.date.slice(0, 10), c.date.slice(0, 10)) || 0) / 7;
      if (wk > 0) { const kgw = (mean - pd) / wk; rate = `<div class="cb"><span>Variazione settimanale</span><b>${fmtSigned(kgw, 2)} kg</b> <span>${fmtSigned((kgw / pd) * 100, 2)}% del peso / sett.</span></div>`; }
    }
    return `<div class="cb"><span>Media 7 giorni</span><b>${fmtN(mean, 2)} kg</b></div><div class="cb"><span>Oscillazione (min–max)</span><b>${fmtN(mn, 1)}–${fmtN(mx, 1)}</b> <span>${fmtN(mx - mn, 1)} kg · ${v.length}/7 pesate</span></div>${rate}`;
  }
  if (key === 'pesoMedioVal') { const a = avg(c.misure?.pesate); return a === null ? '' : fmtN(a, 2); }
  if (key === 'indici') {
    const out = ['whr', 'whtr', 'bmi'].map((k) => { const m = METRIC[k], v = metricValue(k, c, cl); return v === null ? '' : `<div class="cb"><span>${m.l}${k === 'bmi' ? ' (solo coach)' : ''}</span><b>${fmtN(v, m.d)}</b> ${ctx.ref ? deltaBadge(m, v, metricValue(k, ctx.ref, cl), c, cl, { short: true }) : ''}</div>`; }).join('');
    return out || '';
  }
  if (key === 'segAsym') {
    const L = c.bia?.seg?.lean || {};
    const a = asym(L.bsx, L.bdx), g = asym(L.gsx, L.gdx);
    return a === null && g === null ? '' : `<div class="cb"><span>Asimmetria braccia (magra)</span>${asyBadge(a)}</div><div class="cb"><span>Asimmetria gambe (magra)</span>${asyBadge(g)}</div>`;
  }
  if (key === 'pliche') {
    const s = plicheSum(c);
    if (!s.n) return '';
    const bf = plicheBF(c, cl);
    const missing = !cl.anag?.sesso || !cl.anag?.dataNascita;
    const fm = metricValue('p_fm', c, cl), ffm = metricValue('p_ffm', c, cl);
    return `<div class="cb"><span>Somma ${s.n}/7 pliche</span><b>${fmtN(s.sum, 1)} mm</b> ${ctx.ref ? deltaBadge(METRIC.p_sum, s.sum, metricValue('p_sum', ctx.ref, cl), c, cl, { short: true }) : ''}</div>
      ${bf !== null ? `<div class="cb"><span>Massa grassa stimata</span><b>${fmtN(bf, 1)}%</b> ${ctx.ref ? deltaBadge(METRIC.p_bf, bf, metricValue('p_bf', ctx.ref, cl), c, cl, { short: true }) : ''}</div><div class="cb"><span>Massa grassa / magra</span><b>${fmtN(fm, 1)} / ${fmtN(ffm, 1)} kg</b></div>`
        : `<div class="cb" style="max-width:340px"><span>% massa grassa</span><span style="color:var(--ink-2)">${!s.complete ? 'Servono tutte e 7 le pliche.' : missing ? 'Inserisci sesso e data di nascita nella scheda cliente.' : ''}</span></div>`}`;
  }
  if (key.startsWith('dblmean|')) {
    const [, pth, u] = key.split('|');
    const v = num(getP(c, pth));
    return v === null ? '' : `= <b>${fmtN(v, pth.startsWith('pliche') ? 1 : 1)}</b> ${esc(u)}`;
  }
  if (key.startsWith('dblwarn|')) {
    const pth = key.slice(8);
    const r = c.raw?.[rawKey(pth)] || [];
    const w = dblWarn(pth, num(r[0]), num(r[1]));
    return w ? `${ic('alert')} ${w}` : '';
  }
  if (key.startsWith('goalwarn|')) {
    const g = (c.obiettivi || [])[+key.split('|')[1]];
    const w = goalRealism(g, c, cl);
    return w ? `${ic('alert')} <span><b>Da valutare:</b> ${esc(w)}.</span>` : '';
  }
  if (key.startsWith('goalnow|')) {
    const g = (c.obiettivi || [])[+key.split('|')[1]];
    if (!g || !g.mk || g.mk === 'free') return '';
    const m = metricDef(g.mk); const v = metricValue(g.mk, c, cl);
    if (!m || v === null) return 'oggi: —';
    const t = num(g.val);
    return `oggi ${fmtN(v, m.d)}${t !== null ? ` → ${fmtN(g.mode === 'delta' ? v + t : t, m.d)}` : ''}`;
  }
  if (key.startsWith('goalstate|') || key.startsWith('goalprog|')) {
    const rev = goalsReview(ctx) || [];
    const r = rev[+key.split('|')[1]];
    if (!r) return '';
    return key.startsWith('goalstate|') ? goalStateBadge(r) : goalProgressHTML(r);
  }
  if (key.startsWith('asy|')) {
    const [, base, k] = key.split('|');
    return asyBadge(asym(getP(c, `${base}.${k}.sx`), getP(c, `${base}.${k}.dx`)));
  }
  if (key.startsWith('tbl|')) {
    const [, p, i, ck] = key.split('|');
    const row = (getP(ctx.check, p) || [])[+i] || {};
    if (ck === 'e1rm') { const v = e1rm(row.kg, row.reps); return v === null ? '<span class="muted">—</span>' : fmtN(v, 1) + ' kg'; }
    if (ck === 'fz') {
      if (!ctx.ref || !row.es) return '';
      const pr = forzaRow(ctx.ref, row.es);
      if (!pr) return '<span class="small muted" style="font-weight:400">nuovo esercizio</span>';
      const sameKg = num(pr.kg) === num(row.kg);
      const pe = e1rm(pr.kg, pr.reps), ce = e1rm(row.kg, row.reps);
      const mR = { u: 'rip', d: 0, eps: 0, dir: 'up', k: 'reps' }, mE = { u: 'kg', d: 1, eps: 0.5, dir: 'up', k: 'e1rm' };
      return `<div class="mcmp" style="font-weight:400"><span class="prev">Prec.: <b>${esc(pr.kg)} kg × ${esc(pr.reps)}</b></span>${sameKg && num(row.reps) !== null ? deltaBadge(mR, num(row.reps), num(pr.reps), c, cl, { short: true }) : ''}${ce !== null && pe !== null ? deltaBadge(mE, ce, pe, c, cl, { short: true, label: 'e1RM' }) : ''}</div>`;
    }
    if (ck === 'dol') {
      if (!row.zona) return '';
      const pr = (ctx.ref.dolori || []).find((d) => exKey(d.zona) === exKey(row.zona));
      if (!pr || num(pr.int) === null) return '<span class="small muted" style="font-weight:400">—</span>';
      const m = { u: '', d: 0, eps: 0, dir: 'down', k: 'dol' };
      return `<div class="mcmp" style="font-weight:400"><span class="prev"><b>${esc(pr.int)}</b>/10</span>${num(row.int) !== null ? deltaBadge(m, num(row.int), num(pr.int), c, cl, { short: true }) : ''}</div>`;
    }
  }
  return '';
}

/* --------------------------- salvataggio --------------------------- */
const pending = new Set();
function setSaveState(s, msg) {
  S.saveState = s;
  S.saveMsg = msg || '';
  if (s === 'saved') S.lastSaved = Date.now();
  renderTopbar();
}
function touch(scope, obj) {
  obj = obj || (scope === 'client' ? S.client : S.check);
  if (!obj) return;
  obj.updatedAt = Date.now();
  pending.add((scope === 'client' ? 'clients' : 'checks') + ':' + obj.id);
  setSaveState('saving');
  flushSoon();
}
let flushing = null, retryTimer = null;
async function flush() {
  if (flushing) { await flushing; if (!pending.size) return; }
  flushing = (async () => {
    const items = Array.from(pending);
    pending.clear();
    let failed = null;
    for (const it of items) {
      try {
        if (it === 'settings') { await DB.setSetting('app', S.settings); continue; }
        const [store, id] = it.split(':');
        const obj = (store === 'clients' ? S.clients : S.checks).find((x) => x.id === id);
        if (obj) await DB.put(store, obj);
      } catch (e) {
        failed = e;
        if (e.code !== 'too_big' && e.code !== 'invalid_argument') pending.add(it);
      }
    }
    if (failed) {
      const msg = failed.code === 'too_big' ? failed.message + ' Riduci i testi molto lunghi.'
        : failed.code === 'quota_exceeded' ? 'Spazio dell\'archivio esaurito: elimina clienti o foto che non servono più.'
        : failed.code === 'revoked' || failed.code === 'not_granted' ? 'Accesso all\'archivio non più disponibile: ricarica la pagina.'
        : 'Salvataggio non riuscito, riprovo tra pochi secondi.';
      setSaveState('error', msg);
      if (pending.size) { clearTimeout(retryTimer); retryTimer = setTimeout(flush, 5000); }
    } else setSaveState('saved');
  })();
  try { await flushing; } finally { flushing = null; }
}
const flushSoon = debounce(flush, 300);
async function saveSettings() {
  try { await DB.setSetting('app', S.settings); setSaveState('saved'); } catch (e) { setSaveState('error', e.code === 'too_big' ? 'Logo troppo grande: usa un\'immagine più piccola.' : 'Impostazioni non salvate, riprova.'); }
  renderTopbar();
}

    if (path.startsWith('screening.') || path.startsWith('consensi.') || path.startsWith('riab.')) {

      if (path.startsWith('screening.q')) { const sb = $('#scr-box'); if (sb) sb.outerHTML = screeningHTML(S.client, 'client').replace(/<p class="small muted"[\s\S]*$/, ''); }
    }
    return;
  }
  // check
  if (el.dataset.rerender) { rerenderKeepScroll(); return; }
  if (path === 'tipo') { rerenderKeepScroll(); return; }
  if (path.startsWith('valutazione.') && path !== 'valutazione.inPdf' && S.check.valutazione) S.check.valutazione.edited = true;
  if (el.dataset.goalRr) { const gb = $('#goals-box'); if (gb) gb.innerHTML = goalsEditorHTML(S.check); }
  if (path === 'date') {
    const meta = checkMeta(clientChecks(S.client.id), S.check);
    const t = $('#chk-title'); if (t) t.textContent = meta.title;
    const s = $('#chk-sub'); if (s) s.textContent = `${meta.sub} · ${fmtDateLong(S.check.date)}`;
  }
  if (path.startsWith('report.')) {
    const sec = $('#ck-report'); if (sec) sec.innerHTML = secHead('⎙', 'Report PDF') + reportPanelHTML(curCtx());
  }
  refreshCalcs();
  refreshDash();
}

/* ------------------------------ input ------------------------------ */
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'search') { S.search = el.value; renderSidebar(); return; }
  if (el.dataset.raw && S.check) {
    const pth = el.dataset.raw, k = rawKey(pth);
    S.check.raw = S.check.raw || {};
    const r = S.check.raw[k] = (S.check.raw[k] || ['', '']).slice(0, 2);
    if (r.length < 2) r.push('');
    r[+el.dataset.ri] = el.value;
    const a = num(r[0]), b = num(r[1]);
    const v = a !== null && b !== null ? ((a + b) / 2).toFixed(2).replace(/0$/, '') : a !== null ? r[0] : b !== null ? r[1] : '';
    setP(S.check, pth, v);
    touch('check');
    refreshCalcs(); refreshDash();
    return;
  }
  if (!el.dataset.b || el.type === 'checkbox' || el.type === 'file') return;
  const scope = el.dataset.s, obj = scopeObj(scope);
  if (!obj) return;
  setP(obj, el.dataset.b, el.value);
  touch(scope, obj);
  afterChange(el, scope, el.dataset.b);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.type === 'checkbox' && el.dataset.b) {
    const scope = el.dataset.s, obj = scopeObj(scope);
    if (!obj) return;
    setP(obj, el.dataset.b, el.checked);
    touch(scope, obj);
    afterChange(el, scope, el.dataset.b);

  if (el.id === 'photo-input' && el.files?.length) { savePhoto(S.pendingSlot, el.files[0]); el.value = ''; }

/* ------------------------------ click ------------------------------ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'home': await flush(); go({ v: 'home' }); break;
    case 'social': await flush(); socialCardModal(); break;
    case 'val-gen': generaValutazione(); break;
    case 'val-stop': if (VAL.ctl) VAL.ctl.abort(); break;
    case 'tests-edit': $$('.modal-bg').forEach((m) => m.remove()); testsEditor(); break;
    case 'menu': $('.layout').classList.toggle('side-open'); break;
    case 'goal-add': {
      S.check.obiettivi = S.check.obiettivi || [];
      S.check.obiettivi.push(el.dataset.kind === 'free' ? { id: uid(), mk: 'free', text: '' } : { id: uid(), mk: '', mode: 'to', val: '' });
      $('#goals-box').innerHTML = goalsEditorHTML(S.check);
      touch('check'); refreshCalcs();
      break;
    }
    case 'goal-del': {
      S.check.obiettivi.splice(+el.dataset.i, 1);
      $('#goals-box').innerHTML = goalsEditorHTML(S.check);
      touch('check'); refreshCalcs();
      break;
    }
    case 'pick-logo': $('#logo-input').click(); break;
    case 'pick-coach-photo': $('#coach-photo-input').click(); break;
    case 'proto-reset': { const a = $('#st-pforza'), b = $('#st-pfoto'); if (a) a.value = DEFAULT_PROTOCOLS.forza; if (b) b.value = DEFAULT_PROTOCOLS.foto; break; }
    case 'soglie-reset': $$('[data-soglia]').forEach((i) => { i.value = ''; }); break;
    case 'tem-calc': {
      const lines = ($('#tem-in')?.value || '').split(/\n+/).map((l) => l.trim()).filter(Boolean);
      const pairs = lines.map((l) => l.split(/[;\t\s]+/).map(num)).filter((p) => p.length >= 2 && p[0] !== null && p[1] !== null);
      const out = $('#tem-out');
      if (pairs.length < 3) { out.innerHTML = '<span class="bad-t">Servono almeno 3 coppie di misure (meglio 10 o più).</span>'; break; }
      const tem = Math.sqrt(pairs.reduce((a, [x, y]) => a + (x - y) ** 2, 0) / (2 * pairs.length));
      const mdc = tem * 1.96 * Math.SQRT2;
      const fam = $('#tem-fam').value;
      out.innerHTML = `Errore tecnico di misura (TEM): <b>${fmtN(tem, 2)}</b> · Cambiamento minimo rilevabile (MDC95): <b>${fmtN(mdc, 2)}</b> <button class="btn xs primary" data-act="tem-use" data-fam="${fam}" data-v="${mdc.toFixed(2)}">Usa ${fmtN(mdc, 2)} come soglia</button>`;
      break;
    }
    case 'tem-use': { const i = $(`[data-soglia="${el.dataset.fam}"]`); if (i) { i.value = String(el.dataset.v).replace('.', ','); i.focus(); } break; }
    case 'new-client': newClientModal(); break;
    case 'demo': await createDemo(); break;
    case 'open-client': await flush(); go({ v: 'client', clientId: el.dataset.id, tab: 'overview' }); break;
    case 'tab': await flush(); go({ v: 'client', clientId: S.client.id, tab: el.dataset.tab }); break;
    case 'open-check': await flush(); go({ v: 'check', clientId: S.client.id, checkId: el.dataset.id }); break;
    case 'new-check': {
      await flush();
      const cs = clientChecks(S.client.id);
      const last = cs[cs.length - 1];
      const tipo = await new Promise((res) => {
        let done = false;
        const fin = (v) => { if (!done) { done = true; res(v); } };
        openModal({
          title: cs.length ? `Nuovo check #${cs.length + 1}` : 'Check iniziale (T0)',
          body: `<div class="report-btns">
            <button class="report-btn cli" data-tipo="completo"><span class="ic">${ic('ruler')}</span><span><b>Check completo</b><span>In presenza: misure, BIA, pliche, test di forza e mobilità, foto.</span></span></button>
            <button class="report-btn coa" data-tipo="rapido"><span class="ic">${ic('zap')}</span><span><b>Check rapido</b><span>Online o veloce: peso, circonferenze del tronco, foto, benessere, obiettivi.</span></span></button></div>`,
          onOpen: (m) => m.querySelectorAll('[data-tipo]').forEach((b) => { b.onclick = () => { fin(b.dataset.tipo); m.remove(); }; }),
          onClose: () => fin(null),
        });
      });
      if (!tipo) break;
      const c = newCheck(S.client.id, last);
      c.tipo = tipo;
      S.checks.push(c);
      await DB.put('checks', c);
      touch('check', c);
      go({ v: 'check', clientId: S.client.id, checkId: c.id });
      toast(tipo === 'rapido' ? `Check rapido #${cs.length + 1} creato.` : cs.length ? `Check #${cs.length + 1} creato: esercizi e carichi del test di forza precompilati dal check precedente.` : 'Check T0 creato.');
      break;
    }
    case 'del-client': {
      const ok = await confirmBox('Eliminare il cliente?', `Verranno eliminati definitivamente <b>${esc(clientName(S.client))}</b>, tutti i suoi check e tutte le foto. Ti consiglio di esportare prima un backup.`, 'Elimina definitivamente', true);
      if (!ok) return;
      const id = S.client.id;
      for (const c of S.checks.filter((x) => x.clientId === id)) await DB.del('checks', c.id);
      for (const p of Array.from(S.photos.values()).filter((x) => x.clientId === id)) { await DB.del('photos', p.id); S.photos.delete(p.id); }
      const all = await DB.byIndex('photos', 'clientId', id); for (const p of all) await DB.del('photos', p.id);
      await DB.del('clients', id);
      S.checks = S.checks.filter((x) => x.clientId !== id);
      S.clients = S.clients.filter((x) => x.id !== id);
      S.settings.dirty = true; saveSettings();
      go({ v: 'home' });
      toast('Cliente eliminato.');
      break;
    }
    case 'del-check': {
      const meta = checkMeta(clientChecks(S.client.id), S.check);
      const ok = await confirmBox('Eliminare il check?', `Il <b>${esc(meta.title)}</b> del ${fmtDate(S.check.date)} e le sue foto verranno eliminati definitivamente.`, 'Elimina', true);
      if (!ok) return;
      const id = S.check.id;
      for (const p of Array.from(S.photos.values()).filter((x) => x.checkId === id)) { await DB.del('photos', p.id); S.photos.delete(p.id); }
      await DB.del('checks', id);
      S.checks = S.checks.filter((x) => x.id !== id);
      S.settings.dirty = true; saveSettings();
      go({ v: 'client', clientId: S.client.id, tab: 'overview' });
      toast('Check eliminato.');
      break;
    }
    case 'toggle-side': S.sideOpenInCheck = !S.sideOpenInCheck; $('.layout').classList.toggle('side-collapsed', !S.sideOpenInCheck); setTimeout(() => Object.values(S.charts).forEach((c) => c.resize()), 230); break;
    case 'seg': {
      const scope = el.dataset.s, obj = scopeObj(scope);
      if (!obj) return;
      const cur = getP(obj, el.dataset.b);
      const v = String(cur) === el.dataset.v ? '' : el.dataset.v;
      setP(obj, el.dataset.b, v);
      el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
      touch(scope, obj);
      afterChange(el, scope, el.dataset.b);
      break;
    }
    case 'row-add': {
      const scope = el.dataset.s, obj = scopeObj(scope), p = el.dataset.p;
      let arr = getP(obj, p); if (!Array.isArray(arr)) { arr = []; setP(obj, p, arr); }
      arr.push({});
      $('#tb-' + slug(p)).outerHTML = tableHTML(p, obj);
      touch(scope, obj); refreshCalcs(); refreshDash();
      const rows = $$('#tb-' + slug(p) + ' tbody tr'); rows[rows.length - 1]?.querySelector('input')?.focus();
      break;
    }
    case 'row-del': {
      const scope = el.dataset.s, obj = scopeObj(scope), p = el.dataset.p;
      const arr = getP(obj, p) || [];
      arr.splice(+el.dataset.i, 1);
      $('#tb-' + slug(p)).outerHTML = tableHTML(p, obj);
      touch(scope, obj); refreshCalcs(); refreshDash();
      break;
    }
    case 'jump': { const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'ctab': {
      S.tabs[el.dataset.k] = el.dataset.v;
      el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el));
      const ctx = S.view.v === 'check' ? curCtx() : S.dashCtx;
      if (ctx) drawChart(el.dataset.k, ctx);
      break;
    }
    case 'photo-pick': {
      e.stopPropagation();
      S.pendingSlot = el.dataset.slot || el.closest('[data-slot]')?.dataset.slot;
      $('#photo-input').click();
      break;
    }
    case 'photo-del': {
      e.stopPropagation();
      const ok = await confirmBox('Eliminare la foto?', 'La foto verrà rimossa da questo check.', 'Elimina', true);
      if (!ok) return;
      await DB.del('photos', el.dataset.id); S.photos.delete(el.dataset.id);
      S.settings.dirty = true; saveSettings();
      rerenderKeepScroll();
      break;
    }
    case 'zoom': { const id = el.dataset.src.replace('photo:', ''); const p = S.photos.get(id); if (p) lightbox(p.dataUrl); break; }
    case 'pose-add': {
      openModal({
        title: 'Aggiungi posa', body: `<div class="fld"><label>Nome della posa</label><input class="inp" id="pose-name" placeholder="es. Doppio bicipite frontale"></div>`,
        actions: [{ label: 'Annulla' }, { label: 'Aggiungi', cls: 'primary', fn: (m) => {
          const v = m.querySelector('#pose-name').value.trim(); if (!v) return false;
          S.check.foto.extra = S.check.foto.extra || [];
          S.check.foto.extra.push({ key: 'x_' + uid(), label: v });
          touch('check'); rerenderKeepScroll();
        } }],
      });
      break;
    }
    case 'pose-del': {
      const k = el.dataset.key;
      S.check.foto.extra = (S.check.foto.extra || []).filter((x) => x.key !== k);
      const p = photoOf(S.check.id, k); if (p) { await DB.del('photos', p.id); S.photos.delete(p.id); }
      touch('check'); rerenderKeepScroll();
      break;
    }
    case 'hl-pick': {
      const r = S.check.report = S.check.report || {};
      r.highlights = r.highlights || [];
      const k = el.dataset.k;
      if (el.checked) { if (r.highlights.length >= 4) { el.checked = false; toast('Massimo 4 highlights.'); return; } r.highlights.push(k); }
      else r.highlights = r.highlights.filter((x) => x !== k);
      touch('check'); refreshDash();
      break;
    }
    case 'export': exportArchive(); break;
    case 'import': $('#import-input').click(); break;
    case 'settings': settingsModal(); break;
    case 'cons-up': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,application/pdf'; inp.multiple = true;
      inp.onchange = () => uploadSigned(Array.from(inp.files || []));
      inp.click(); break;
    }
    case 'cons-del': {
      const ok = await confirmBox('Eliminare il modulo caricato?', 'Le pagine del modulo firmato verranno tolte dalla scheda. Le scelte registrate nella sezione 14 restano.', 'Elimina', true);
      if (!ok) return;
      for (const p of signedPages(S.client.id)) { await DB.del('photos', p.id); S.photos.delete(p.id); }
      rerenderKeepScroll(); break;
    }
    case 'file-menu': archiveInfo(); break;
    case 'pdf': {
      await flush();
      if (el.dataset.kind === 'sanitario' && !sanitarioOk(S.client)) {
        const ok = await confirmBox('Autorizzazione non registrata', S.client.consensi?.sanitari === 'no' ? 'Il cliente <b>non ha acconsentito</b> allo scambio di informazioni con i professionisti sanitari (consenso 3, sezione 14). Generare comunque la relazione?' : 'Nella scheda cliente non risulta l\'autorizzazione a confrontarti con il professionista sanitario (sezione 03 o consenso 3 della sezione 14). Generare comunque la relazione?', 'Genera comunque');
        if (!ok) break;
      }
      if (!(await eclPrimaDelPdf(el.dataset.kind))) break;
      printReport(el.dataset.kind);
      break;
    }
    default: await eclAct(act, el, e); break;
  }
});

/* drag & drop foto */
document.addEventListener('dragover', (e) => {
  const s = e.target.closest('.ph-slot[data-slot]');
  if (s && !s.classList.contains('ref')) { e.preventDefault(); s.classList.add('drag'); }
});
document.addEventListener('dragleave', (e) => { const s = e.target.closest('.ph-slot'); if (s) s.classList.remove('drag'); });
document.addEventListener('drop', (e) => {
  const s = e.target.closest('.ph-slot[data-slot]');
  if (!s) { if (e.dataTransfer?.files?.length) e.preventDefault(); return; }
  e.preventDefault();
  s.classList.remove('drag');
  if (s.classList.contains('ref')) return;
  const f = e.dataTransfer?.files?.[0];
  if (f && f.type.startsWith('image/')) savePhoto(s.dataset.slot, f);
});

async function savePhoto(slot, file) {
  if (!S.check || !slot) return;
  try {
    toast('Ottimizzo la foto…', '', 1200);
    const { dataUrl, w, h } = await compressPhoto(file);
    const old = photoOf(S.check.id, slot);
    if (old) { await DB.del('photos', old.id); S.photos.delete(old.id); }
    const p = { id: uid(), clientId: S.client.id, checkId: S.check.id, slot, dataUrl, w, h, createdAt: Date.now() };
    await DB.put('photos', p);
    S.photos.set(p.id, p);
    S.settings.dirty = true; saveSettings();
    rerenderKeepScroll();
  } catch (err) {
    toast('Impossibile leggere l\'immagine: ' + esc(err.message), 'bad');
  }
}

/** Salva un file sul dispositivo tramite Claude (chiede conferma all'utente) */
async function saveFile(filename, blob) {
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
  if (!dl) {
    // fuori da Claude: download normale del browser
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      if (window.__saveFile) { const buf = new Uint8Array(await blob.arrayBuffer()); await window.__saveFile(filename, Array.from(buf)); }
      return true;
    } catch (e) { toast('Download non riuscito: ' + esc(e?.message || ''), 'bad'); return false; }
  }
  try { await dl.save({ filename, data: blob }); return true; } catch (e) {
    if (e && e.code === 'declined') return false;
    if (e && e.code === 'rate_limited') { toast('C\'è già una richiesta di download aperta.', 'bad'); return false; }
    toast('Download non riuscito: ' + esc(e?.message || e?.code || ''), 'bad'); return false;
  }
}

async function doImport(data, mode) {
  await flush();
  const prog = progressBox('Importo l\'archivio…');
  try {
    const photos = [];
    for (const ph of data.photos || []) {
      if (ph.dataUrl && ph.dataUrl.length > 230000) { const f = await fitDataUrl(ph.dataUrl); photos.push(Object.assign({}, ph, f)); } else photos.push(ph);
    }
    if (mode === 'replace') {
      prog.set('Svuoto l\'archivio attuale…');
      for (const s of ['clients', 'checks', 'photos']) await DB.clear(s);
      prog.set('Carico clienti e check…');
      await DB.bulkPut('clients', data.clients);
      await DB.bulkPut('checks', data.checks || []);
      prog.set(`Carico ${photos.length} foto…`);
      await DB.bulkPut('photos', photos);
      const st = (data.settings || []).find((s) => s.key === 'app');
      if (st) { S.settings = Object.assign({}, S.settings, st.value); await saveSettings(); }
    } else {
      const cur = { clients: new Map(S.clients.map((c) => [c.id, c])), checks: new Map(S.checks.map((c) => [c.id, c])) };
      const newer = (store, o) => { const e = cur[store].get(o.id); return !e || (o.updatedAt || 0) >= (e.updatedAt || 0); };
      prog.set('Carico clienti e check…');
      await DB.bulkPut('clients', data.clients.filter((o) => newer('clients', o)));
      await DB.bulkPut('checks', (data.checks || []).filter((o) => newer('checks', o)));
      prog.set(`Carico ${photos.length} foto…`);
      await DB.bulkPut('photos', photos);
      const st = (data.settings || []).find((s) => s.key === 'app');
      if (st && !S.settings.logo && st.value?.logo) { S.settings.logo = st.value.logo; await saveSettings(); }
    }
    S.clients = await DB.all('clients');
    S.checks = await DB.all('checks');
    S.photos = new Map(); S.loadedPhotos = new Set();
    rebuildTestMetrics();
    prog.close();
    renderTopbar();
    go({ v: 'home' });
    toast(`${ic('check')} Archivio importato (${mode === 'replace' ? 'sostituito' : 'unito'}).`);
  } catch (e) {
    prog.close();
    toast('Importazione interrotta: ' + esc(e.message || e.code || '') + '. Riprova: i dati già caricati restano.', 'bad', 7000);
    S.clients = await DB.all('clients'); S.checks = await DB.all('checks'); go({ v: 'home' });
  }
}

/* aggiorna i dati quando torni sulla pagina (modifiche fatte da un altro dispositivo) */
let lastSync = Date.now();
async function syncFromCloud() {
  if (DB.mode !== 'cloud' || pending.size || flushing) return;
  if (Date.now() - lastSync < 60000) return;
  lastSync = Date.now();
  try {
    const [cl, ck] = await Promise.all([DB.all('clients'), DB.all('checks')]);
    let changed = false;
    const mergeInto = (arr, fresh) => {
      const map = new Map(arr.map((x) => [x.id, x]));
      const ids = new Set(fresh.map((x) => x.id));
      fresh.forEach((f) => { const e = map.get(f.id); if (!e) { arr.push(f); changed = true; } else if ((f.updatedAt || 0) > (e.updatedAt || 0)) { Object.keys(e).forEach((k) => delete e[k]); Object.assign(e, f); changed = true; } });
      for (let i = arr.length - 1; i >= 0; i--) if (!ids.has(arr[i].id)) { arr.splice(i, 1); changed = true; }
    };
    mergeInto(S.clients, cl); mergeInto(S.checks, ck);
    if (changed) { S.loadedPhotos = new Set(); S.photos = new Map(); go(Object.assign({}, S.view)); toast('Archivio aggiornato con le modifiche fatte da un altro dispositivo.'); }
  } catch (e) { /* riprova alla prossima occasione */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncFromCloud(); else if (pending.size) flush(); });

/** Sagoma stilizzata per le foto del cliente di esempio (nessuna persona reale) */
function demoSilhouette(waist, side) {
  const cv = document.createElement('canvas'); cv.width = 600; cv.height = 800;
  const g = cv.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, 800); bg.addColorStop(0, '#EEEAE6'); bg.addColorStop(1, '#DCD6D0');
  g.fillStyle = bg; g.fillRect(0, 0, 600, 800);
  g.fillStyle = '#C9C2BB'; g.fillRect(0, 690, 600, 110);
  const skin = '#9C7F70', cx = 300, sw = side ? 0.62 : 1;
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(cx, 120, 38 * (side ? 0.9 : 1), 46, 0, 0, Math.PI * 2); g.fill();
  g.fillRect(cx - 16, 158, 32, 30);
  const sh = 118 * sw, wa = 78 * waist * sw, hip = 84 * sw;
  g.beginPath();
  g.moveTo(cx - sh, 200); g.quadraticCurveTo(cx, 182, cx + sh, 200);
  g.lineTo(cx + sh - 12 * sw, 300); g.quadraticCurveTo(cx + wa + 6, 380, cx + wa, 430);
  g.lineTo(cx + hip, 470); g.lineTo(cx - hip, 470); g.lineTo(cx - wa, 430);
  g.quadraticCurveTo(cx - wa - 6, 380, cx - sh + 12 * sw, 300); g.closePath(); g.fill();
  if (!side) { [-1, 1].forEach((d) => { g.beginPath(); g.moveTo(cx + d * sh, 205); g.quadraticCurveTo(cx + d * (sh + 30), 330, cx + d * (sh + 14), 450); g.lineTo(cx + d * (sh - 8), 450); g.quadraticCurveTo(cx + d * (sh + 2), 330, cx + d * (sh - 26), 230); g.closePath(); g.fill(); }); }
  else { g.beginPath(); g.ellipse(cx + 6, 330, 24, 120, 0.05, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#2A2738'; g.fillRect(cx - hip - 2, 440, (hip + 2) * 2, 80);
  g.fillStyle = skin;
  const leg = side ? [[cx - 34, 52]] : [[cx - hip + 6, 58], [cx + hip - 64, 58]];
  leg.forEach(([x, w]) => g.fillRect(x, 518, w, 175));
  g.fillStyle = 'rgba(0,0,0,.35)'; g.font = '600 18px Inter, Arial, sans-serif'; g.textAlign = 'center';
  g.fillText('FOTO DI ESEMPIO', cx, 44);
  return cv.toDataURL('image/jpeg', 0.85);
}

/* ------------------------------ avvio ------------------------------ */
async function init() {
  setupChartDefaults();
  $('#main').innerHTML = `<div class="page"><div class="card empty"><div class="spinner"></div><div class="h2">Apro il tuo archivio…</div></div></div>`;
  renderTopbar();
  S.dbOk = await DB.open();
  await eclInit();
  try {
    const st = await DB.getSetting('app', null); if (st) Object.assign(S.settings, st);
    S.coachPhoto = await DB.getSetting('coachPhoto', null);
    // scelta del coach: rotazione interna d'anca, ASLR e sprint disattivati
    if (!S.settings.testsV2) {
      if (Array.isArray(S.settings.tests)) S.settings.tests.forEach((t) => { if (['anca', 'aslr', 's10', 's20'].includes(t.id)) t.attivo = false; });
      S.settings.testsV2 = true;
      if (DB.mode === 'cloud') DB.setSetting('app', S.settings).catch(() => {});
    }
    // scelta del coach: side plank sostituito dai test di stabilità (Y-Balance)
    if (!S.settings.testsV3) {
      if (Array.isArray(S.settings.tests)) {
        S.settings.tests.forEach((t) => { if (t.id === 'sideplank') t.attivo = false; });
        DEFAULT_TESTS.filter((d) => ['ybt_lq', 'ybt_uq', 'ckcuest'].includes(d.id) && !S.settings.tests.some((t) => t.id === d.id)).forEach((d) => S.settings.tests.push(clone(d)));
      }
      S.settings.testsV3 = true;
      if (DB.mode === 'cloud') DB.setSetting('app', S.settings).catch(() => {});
    }
    // scelta del coach: CKCUEST al posto dello Y-Balance arti superiori + test di flessibilità
    if (!S.settings.testsV4) {
      if (Array.isArray(S.settings.tests)) {
        S.settings.tests.forEach((t) => { if (t.id === 'ybt_uq') t.attivo = false; if (t.id === 'ckcuest') t.attivo = true; });
        DEFAULT_TESTS.filter((d) => ['sitreach', 'thomas'].includes(d.id) && !S.settings.tests.some((t) => t.id === d.id)).forEach((d) => S.settings.tests.push(clone(d)));
      }
      S.settings.testsV4 = true;
      if (DB.mode === 'cloud') DB.setSetting('app', S.settings).catch(() => {});
    }
    rebuildTestMetrics();
    S.clients = await DB.all('clients');
    S.checks = await DB.all('checks');
  } catch (e) {
    S.loadError = e.message || e.code || 'errore sconosciuto';
  }
  setSaveState('idle');
  go({ v: 'home' });
  eclRotta();
  window.addEventListener('hashchange', eclRotta);
  window.addEventListener('beforeunload', (e) => { if (pending.size) { flush(); e.preventDefault(); e.returnValue = ''; } });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

        if (a === 'up' && i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; render(m); }
        if (a === 'down' && i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; render(m); }
        if (a === 'del') {
          const t = list[i]; const n = t.id ? used(t.id) : 0;
          if (n && !(await confirmBox('Eliminare il test?', `<b>${esc(t.nome)}</b> ha dati in ${n} check. Eliminandolo quei dati non compariranno più nello storico e nei PDF. Ti consiglio di disattivarlo.`, 'Elimina comunque', true))) return;
          list.splice(i, 1); render(m);
        }
      });
    },
  });
}

/* ---------- grafici renderizzati come immagini ad alta definizione ---------- */
async function chartImg(spec, wmm, hmm) {
  if (!window.Chart || !spec || spec.empty) return '';
  const pxW = Math.round(wmm * 3.78), pxH = Math.round(hmm * 3.78);
  const holder = document.createElement('div');
  holder.style.cssText = `position:fixed;left:-10000px;top:0;width:${pxW}px;height:${pxH}px`;
  const cv = document.createElement('canvas');
  cv.width = pxW; cv.height = pxH;
  cv.style.width = pxW + 'px'; cv.style.height = pxH + 'px';
  holder.appendChild(cv);
  document.body.appendChild(holder);
  const cfg = spec.config;
  cfg.options = Object.assign({}, cfg.options, { responsive: false, animation: false, devicePixelRatio: 3 });
  cfg.options.plugins = Object.assign({}, cfg.options.plugins, { tooltip: { enabled: false } });
  let url = '';
  try {
    const ch = new Chart(cv, cfg);
    url = ch.toBase64Image('image/png', 1);
    ch.destroy();
  } catch (e) { console.warn(e); }
  holder.remove();
  return url ? `<img class="rp-chart" src="${url}" style="width:${wmm}mm;height:${hmm}mm" alt="">` : '';
}

/* ---------- helpers HTML report ---------- */
const rpSec = (n, t, body, cls = '') => body ? `<section class="rp-sec ${cls}"><div class="rp-h"><span class="n">${esc(n)}</span><span class="t">${esc(t)}</span></div>${body}</section>` : '';
function rpDelta(m, cur, ref, check, client) {
  const p = deltaParts(m, cur, ref);
  if (!p) return '<span class="rp-na">—</span>';
  const st = deltaState(m, cur, ref, check, client) || 'neutral';
  const approx = st === 'stable' && Math.abs(p.d) > 1e-9 ? '≈ ' : '';
  return `<span class="rp-d ${st}">${approx}${p.txt}${p.pctTxt ? `<small> ${p.pctTxt}</small>` : ''}</span>`;
}
const rpV = (m, v) => (v === null || v === undefined ? '<span class="rp-na">—</span>' : fmtN(v, m.d));
const rpUnit = (m) => esc(m.u === '/5' ? '/5' : m.u || '');

/** Tabella comparativa: Misura | T0 | Rif | Attuale | Δ blocco | Δ totale */
function rpCompareTable(keys, ctx, { title } = {}) {
  const { check, client, ref, t0 } = ctx;
  const rows = keys.map(metricDef).filter(Boolean).filter((m) => metricValue(m.k, check, client) !== null && !(ctx.exclude && ctx.exclude.has(m.k)));
  if (!rows.length) return '';
  const showT0 = t0 && t0 !== ref;
  const head = !ref
    ? '<th>Misura</th><th class="r">Valore</th><th>Unità</th>'
    : `<th>Misura</th>${showT0 ? `<th class="r">Inizio<br><small>${fmtDate(t0.date)}</small></th>` : ''}<th class="r">${ref === t0 ? 'Inizio' : 'Precedente'}<br><small>${fmtDate(ref.date)}</small></th><th class="r cur">Attuale<br><small>${fmtDate(check.date)}</small></th><th class="r">Δ ${ref === t0 ? 'dall\'inizio' : 'ultimo blocco'}</th>${showT0 ? '<th class="r">Δ dall\'inizio</th>' : ''}`;
  const body = rows.map((m) => {
    const cur = metricValue(m.k, check, client);
    if (!ref) return `<tr><td>${esc(m.l)}</td><td class="r cur">${rpV(m, cur)}</td><td class="u">${rpUnit(m)}</td></tr>`;
    const rv = metricValue(m.k, ref, client), tv = showT0 ? metricValue(m.k, t0, client) : null;
    return `<tr><td>${esc(m.l)} <span class="u">${rpUnit(m)}</span></td>${showT0 ? `<td class="r">${rpV(m, tv)}</td>` : ''}<td class="r">${rpV(m, rv)}</td><td class="r cur">${rpV(m, cur)}</td><td class="r">${rpDelta(m, cur, rv, check, client)}</td>${showT0 ? `<td class="r">${rpDelta(m, cur, tv, check, client)}</td>` : ''}</tr>`;
  }).join('');
  return `<div class="${rows.length <= 8 ? 'rp-keep' : ''}">${title ? `<div class="rp-sub">${esc(title)}</div>` : ''}<table class="rp-t"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function rpForzaTable(ctx) {
  const { check, ref, client } = ctx;
  const rows = (check.forza || []).filter((r) => r.es && (num(r.kg) !== null || num(r.reps) !== null));
  if (!rows.length) return '';
  const mR = { u: 'rip', d: 0, eps: 0, dir: 'up', k: 'reps' }, mE = { u: 'kg', d: 1, eps: 0.5, dir: 'up', k: 'e1rm' };
  return `<table class="rp-t"><thead><tr><th>Esercizio</th><th class="r">Carico test</th>${ref ? '<th class="r">Ripetizioni prima</th>' : ''}<th class="r cur">Ripetizioni ora</th>${ref ? '<th class="r">Δ ripetizioni</th>' : ''}<th class="r">e1RM stimato</th>${ref ? '<th class="r">Δ e1RM</th>' : ''}</tr></thead><tbody>
    ${rows.map((r) => {
      const pr = ref ? forzaRow(ref, r.es) : null;
      const ce = e1rm(r.kg, r.reps), pe = pr ? e1rm(pr.kg, pr.reps) : null;
      const same = pr && num(pr.kg) === num(r.kg);
      return `<tr><td><b>${esc(r.es)}</b></td><td class="r">${esc(r.kg || '—')} kg</td>${ref ? `<td class="r">${pr ? esc(pr.reps || '—') + (same ? '' : ` <small>(${esc(pr.kg)} kg)</small>`) : '<span class="rp-na">nuovo</span>'}</td>` : ''}
        <td class="r cur">${esc(r.reps || '—')}</td>${ref ? `<td class="r">${same && num(r.reps) !== null && num(pr.reps) !== null ? rpDelta(mR, num(r.reps), num(pr.reps), check, client) : '<span class="rp-na">—</span>'}</td>` : ''}
        <td class="r">${ce !== null ? fmtN(ce, 1) + ' kg' : '—'}</td>${ref ? `<td class="r">${ce !== null && pe !== null ? rpDelta(mE, ce, pe, check, client) : '<span class="rp-na">—</span>'}</td>` : ''}</tr>`;
    }).join('')}</tbody></table>
    <p class="rp-note">Test a carico fisso: lo stesso carico viene riutilizzato a ogni check, quindi più ripetizioni significano più forza. e1RM = massimale teorico stimato con la formula di Epley.</p>`;
}

function rpSegTable(ctx) {
  const { check, ref, client } = ctx;
  const L = check.bia?.seg?.lean || {}, F = check.bia?.seg?.fat || {};

  }
  return `<div class="rp-keep"><div class="rp-sub">Analisi segmentale</div><table class="rp-t"><thead><tr><th>Segmento</th><th class="r cur">Massa magra</th>${ref ? '<th class="r">Δ</th>' : ''}<th class="r cur">Massa grassa</th>${ref ? '<th class="r">Δ</th>' : ''}</tr></thead><tbody>
    ${SEGMENTS.map(([k, l]) => {
      const ml = METRIC['bl_' + k], mf = METRIC['bf_' + k];
      const cl = metricValue(ml.k, check, client), cf = metricValue(mf.k, check, client);
      return `<tr><td>${l}</td><td class="r cur">${rpV(ml, cl)} kg</td>${ref ? `<td class="r">${rpDelta(ml, cl, metricValue(ml.k, ref, client), check, client)}</td>` : ''}<td class="r cur">${rpV(mf, cf)} kg</td>${ref ? `<td class="r">${rpDelta(mf, cf, metricValue(mf.k, ref, client), check, client)}</td>` : ''}</tr>`;
    }).join('')}</tbody></table></div>`;
}

function rpHighlights(ctx) {
  const hl = computeHighlights(ctx);
  if (!hl.length) return '';
  return `<div class="rp-hl">${hl.map((x, i) => {

}

function rpPhotos(ctx) {

function rpGoalsReview(ctx) {
  const rev = goalsReview(ctx);

  const ok = rev.filter((r) => r.state === 'si').length;
  const cls = (st) => (st === 'si' ? 'good' : st === 'parz' ? 'stable' : st === 'no' ? 'bad' : 'neutral');
  return `<div class="rp-gcount"><b>${ok}</b> su ${rev.length} raggiunti</div>${rev.map((r) => `<div class="rp-gi">
    <div class="rp-gi-t"><span>${esc(r.label)}</span><span class="rp-d ${cls(r.state)}">${r.state === 'si' ? '✓ ' : ''}${GOAL_STATE[r.state]}</span></div>
    ${r.m && r.start !== null ? `<div class="rp-gi-v">da ${fmtN(r.start, r.m.d)} a <b>${r.cur === null ? '—' : fmtN(r.cur, r.m.d)}</b> ${esc(r.m.u === '/5' ? '' : r.m.u || '')} · obiettivo ${r.target === null ? '—' : fmtN(r.target, r.m.d)}${r.pct !== null && r.state !== 'si' ? ` · ${fmtN(Math.max(0, r.pct), 0)}% del percorso` : ''}</div>
    <div class="rp-gbar"><span style="width:${Math.max(0, Math.min(100, r.pct || 0)).toFixed(0)}%"></span></div>` : ''}
  </div>`).join('')}`;
}
function rpWorkOn(ctx) {
  const si = ctx.check.sintesi || {};
  if (String(si.lavoro || '').trim()) return `<div class="rp-work-t">${nl2br(si.lavoro)}</div>`;
  if (!ctx.ref) return '';
  let worst = null;
  allMetricKeys(ctx.series).forEach((k) => {
    const m = metricDef(k);
    if (!m || m.cli === false || (ctx.exclude && ctx.exclude.has(k)) || !['peso', 'bia', 'circ', 'pliche', 'forza', 'mob'].includes(m.g)) return;
    const cur = metricValue(k, ctx.check, ctx.client), rv = metricValue(k, ctx.ref, ctx.client);
    if (deltaState(m, cur, rv, ctx.check, ctx.client) !== 'bad') return;
    const rel = Math.abs((cur - rv) / (Math.abs(rv) || 1));
    if (!worst || rel > worst.rel) worst = { m, cur, rv, rel };
  });
  if (!worst) return '';
  const p = deltaParts(worst.m, worst.cur, worst.rv);
  return `<div class="rp-work-t">${esc(worst.m.l)}</div><div class="rp-gi-v">${p.txt} rispetto al check precedente (da ${fmtN(worst.rv, worst.m.d)} a ${fmtN(worst.cur, worst.m.d)} ${esc(worst.m.u || '')}): la teniamo sotto controllo nel prossimo blocco.</div>`;
}
function rpNextGoals(ctx) {
  const gs = goalsOf(ctx.check);
  if (!gs.length) return '';
  return `<div class="rp-ng">${gs.map((g, i) => {
    const m = g.mk && g.mk !== 'free' ? metricDef(g.mk) : null;
    const now = m ? metricValue(g.mk, ctx.check, ctx.client) : null;
    const v = num(g.val);
    const target = m && v !== null && now !== null ? (g.mode === 'delta' ? now + v : v) : null;
    return `<div class="rp-ng-i"><span class="rp-fn">${i + 1}</span><div><div class="rp-ng-t">${esc(goalLabel(g))}</div>${m && now !== null ? `<div class="rp-gi-v">oggi ${fmtN(now, m.d)} ${esc(m.u === '/5' ? '' : m.u || '')} → obiettivo <b>${target === null ? '—' : fmtN(target, m.d)}</b></div>` : ''}</div></div>`;
  }).join('')}</div>`;
}

/* ---------- metodo unico per la massa grassa nel PDF cliente ---------- */
function fatMethod(client, check) {
  const has = (m) => (m === 'bia' ? metricValue('b_pbf', check, client) !== null : plicheSum(check).n > 0);
  const pref = client.metodoGrasso;
  if (pref && has(pref)) return pref;
  if (pref && !has(pref)) return pref === 'bia' ? 'pliche' : 'bia';
  return has('bia') ? 'bia' : has('pliche') ? 'pliche' : 'bia';
}
function fatExclude(method) {
  return new Set(method === 'bia'
    ? ['p_sum', 'p_bf', 'p_fm', 'p_ffm'].concat(PLICHE.map(([k]) => 'p_' + k))
    : ['b_pbf', 'b_mbf', 'b_slm'].concat(SEGMENTS.map(([k]) => 'bf_' + k)));
}

function kvBlock(items) {
  const f = items.filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== '' && v !== false);
  if (!f.length) return '';
  return `<dl class="rp-kv">${f.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v === true ? 'Sì' : nl2br(v)}</dd>`).join('')}</dl>`;
}
function anamnesiHTML(client) {
  return CLIENT_SECTIONS.map((s) => {
    if (s.toggle && !getP(client, s.toggle)) return '';
    const parts = [];
    s.fields.forEach((f) => {
      if (f.t === 'screening') {
        const sc = client.screening || {};
        const ans = SCREENING_Q.map((q, i) => { const v = sc['q' + (i + 1)]; return v ? `<tr class="${v === 'si' ? 'flag' : ''}"><td>${i + 1}. ${esc(q)}</td><td class="r"><b>${v === 'si' ? 'SÌ' : 'No'}</b></td></tr>` : ''; }).join('');
        if (ans) parts.push(`<table class="rp-t sm">${ans}</table>`);
        return;
      }
      if (f.t === 'table') {
        const rows = (getP(client, f.p) || []).filter((r) => Object.values(r).some((v) => String(v || '').trim()));
        if (!rows.length) return;
        parts.push(`<div class="rp-sub">${esc(f.l)}</div><table class="rp-t sm"><thead><tr>${f.cols.map((c) => `<th>${esc(c.l)}</th>`).join('')}${f.e1rm ? '<th class="r">e1RM</th>' : ''}</tr></thead><tbody>${rows.map((r) => `<tr>${f.cols.map((c) => `<td>${esc(c.sel ? optLabel(c.sel, r[c.k]) : r[c.k] || '')}</td>`).join('')}${f.e1rm ? `<td class="r">${e1rm(r.kg, r.reps) !== null ? fmtN(e1rm(r.kg, r.reps), 1) : ''}</td>` : ''}</tr>`).join('')}</tbody></table>`);
        return;
      }
      if (f.t === 'note' || !f.p) return;
      let v = getP(client, f.p);
      if (f.t === 'seg') v = optLabel(f.o, v) || '';
      if (f.t === 'date') v = v ? fmtDate(v) : '';
      if (f.t === 'num' && v) v = `${v} ${f.u || ''}`;
      if (f.t === 'multi') v = f.items.filter(([k]) => getP(client, `${f.p}.${k}`)).map(([, l]) => l).join(', ');
      if (f.t === 'check') v = v ? 'Sì' : '';
      if (f.t === 'scale' && v !== '' && v !== undefined) v = `${v}/10`;
      if (v !== undefined && v !== null && String(v).trim() !== '') parts.push(`<dl class="rp-kv"><dt>${esc(f.l)}</dt><dd>${nl2br(v)}</dd></dl>`);
    });
    if (!parts.length) return '';
    return `<div class="rp-an"><div class="rp-an-h">${esc(s.n)} · ${esc(s.title)}</div>${parts.join('')}</div>`;
  }).join('');
}

/** Versione bianca del logo caricato (solo se ha lo sfondo trasparente) per la fascia scura */
async function darkLogo() {
  if (!S.settings.logo) return null;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = S.settings.logo; });
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height);
    let transparent = 0;
    for (let i = 3; i < d.data.length; i += 4 * 97) if (d.data[i] < 20) transparent++;
    if (transparent < (d.data.length / (4 * 97)) * 0.15) return null;
    for (let i = 0; i < d.data.length; i += 4) { d.data[i] = d.data[i + 1] = d.data[i + 2] = 255; }
    x.putImageData(d, 0, 0);
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}

/* ============================ generazione PDF ============================ */
/* Il PDF viene creato direttamente nella pagina (html2pdf: html2canvas + jsPDF)
   e consegnato con il download di Claude. Margini A4: 13/14/16/14 mm. */
/** Evita titoli "orfani" a fondo pagina: li lega al blocco che segue */
function keepHeadings(root) {
  const MM = 3.7795;
  $$('.rp-h, .rp-sub, .rp-ph-l, .rp-an-h, .rp-appx', root).forEach((h) => {
    const next = h.nextElementSibling;
    if (!next || h.parentElement.classList.contains('rp-hk')) return;
    const nh = next.getBoundingClientRect().height;
    const w = document.createElement('div');
    w.className = 'rp-keep rp-hk';
    h.parentNode.insertBefore(w, h);
    w.appendChild(h);
    if (nh > 0 && nh <= 140 * MM) w.appendChild(next);
    else { const sp = document.createElement('div'); sp.style.cssText = 'height:28mm;margin-bottom:-28mm'; w.appendChild(sp); }
  });
}
/** Impaginazione: sposta a pagina nuova ogni blocco che verrebbe tagliato a metà */
const PAGE_ATOMS = '.rp-legal p, .rp-hk, .rp-keep, .rp-t tr, .rp-hl, .rp-ph-row, .rp-tiles, .rp-box, .rp-quote, .rp-goal, .rp-fi, .rp-prog-h, .rp-prog-b, .rp-meso, .rp-prog-grid, .rp-kv, .rp-al, .rp-chart, .rp-2, .rp-cover, .rp-intro, .rp-note, .rp-next, .rp-alerts';
function paginate(root, H) {
  const atoms = [];
  $$(PAGE_ATOMS + ', .rp-pagebreak', root).forEach((el) => {
    if (atoms.some((a) => a.contains(el))) return;
    const top0 = root.getBoundingClientRect().top;
    const r = el.getBoundingClientRect();
    const top = r.top - top0, h = r.height;
    if (el.classList.contains('rp-pagebreak')) {
      const rem = top % H;
      // "soft": va a pagina nuova solo se sulla pagina corrente resta poco spazio
      if (rem > 1 && !(el.classList.contains('soft') && H - rem > H * 0.42)) el.style.height = (H - rem) + 'px';
      return;
    }
    if (h <= 0) return;
    if (h > H) return; // più alto di una pagina: lo dividono i suoi elementi interni
    atoms.push(el);
    const pageEnd = (Math.floor(top / H) + 1) * H;
    if (top + h > pageEnd + 0.5) {
      const gap = pageEnd - top + 3; // +3px: nessun filo del blocco resta sulla pagina precedente
      if (el.tagName === 'TR') {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="40" style="height:${gap}px;padding:0;border:0;background:#fff"></td>`;
        el.parentNode.insertBefore(tr, el);
      } else {
        const sp = document.createElement('div');
        sp.style.cssText = `height:${gap}px;margin:0;padding:0`;
        el.parentNode.insertBefore(sp, el);
      }
    }
  });
}

const SOC = { imgCache: new Map() };

function socLoadImg(src) {
  if (!src) return Promise.resolve(null);
  if (SOC.imgCache.has(src)) return SOC.imgCache.get(src);
  const p = new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  SOC.imgCache.set(src, p);
  return p;
}

/** miglioramenti reali (oltre l'errore di misura) tra base e check attuale */
function socCandidates(ctx, base) {
  if (!base) return [];
  const excl = fatExclude(fatMethod(ctx.client, ctx.check));
  const out = [];
  allMetricKeys(ctx.series).forEach((k) => {
    const m = metricDef(k);
    if (!m || m.cli === false || excl.has(k) || !['peso', 'bia', 'circ', 'pliche', 'forza', 'mob'].includes(m.g)) return;
    if (k.startsWith('reps:')) return;
    const cur = metricValue(k, ctx.check, ctx.client), bv = metricValue(k, base, ctx.client);
    if (deltaState(m, cur, bv, ctx.check, ctx.client) !== 'good') return;
    const p = deltaParts(m, cur, bv);
    const gw = { peso: 1.5, bia: 1.6, pliche: 1.4, circ: 1.4, forza: 1.3, mob: 0.4 }[m.g] || 1;
    const rel = m.u === '%' ? Math.abs(p.d) * 3 : Math.abs(p.pct ?? 0);
    out.push({ k, m, cur, base: bv, p, score: rel * gw });
  });
  return out.sort((a, b) => b.score - a.score);
}
function socShortLabel(m) {
  const map = { peso: 'Peso', pesoMedio: 'Peso', b_peso: 'Peso', b_pbf: 'Massa grassa (%)', b_mbf: 'Massa grassa', b_smm: 'Massa muscolare', b_slm: 'Massa magra', p_bf: 'Massa grassa (%)', p_sum: 'Pliche', c_vitaOmb: 'Vita', c_vitaMin: 'Vita', c_fianchi: 'Fianchi', c_spalle: 'Spalle', c_torace: 'Torace' };
  if (map[m.k]) return map[m.k];
  if (m.k.startsWith('e1rm:')) return 'Forza · ' + m.k.slice(5);
  return m.l.replace(' SX', ' sx').replace(' DX', ' dx');
}

/* ------------------------------ disegno ------------------------------ */
function rr(x, ctx, X, Y, W, H, R) {
  ctx.beginPath();
  ctx.moveTo(X + R, Y); ctx.arcTo(X + W, Y, X + W, Y + H, R); ctx.arcTo(X + W, Y + H, X, Y + H, R);
  ctx.arcTo(X, Y + H, X, Y, R); ctx.arcTo(X, Y, X + W, Y, R); ctx.closePath();
}
function wrapText(ctx, text, maxW) {
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  words.forEach((w) => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line);
  return lines;
}
function drawCover(ctx, img, X, Y, W, H, cropTop) {
  // ritaglio dall'alto (cropTop 0-0.45) poi riempimento "cover"
  const sy0 = img.height * cropTop;
  const sh0 = img.height - sy0;
  const s = Math.max(W / img.width, H / sh0);
  const sw = W / s, sh = H / s;
  const sx = (img.width - sw) / 2;
  const sy = sy0 + Math.max(0, (sh0 - sh) * 0.15);
  ctx.drawImage(img, sx, sy, sw, sh, X, Y, W, H);
}

  const c = cv.getContext('2d');

  const sans = "Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif";
  const ls = (v) => { if ('letterSpacing' in c) c.letterSpacing = v; };
  // sfondo
  const g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0A0A0F'); g.addColorStop(0.5, '#2A0632'); g.addColorStop(1, '#580064');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const glow = c.createRadialGradient(W * 0.9, H * 0.08, 10, W * 0.9, H * 0.08, W * 0.7);
  glow.addColorStop(0, 'rgba(139,47,201,0.35)'); glow.addColorStop(1, 'rgba(139,47,201,0)');
  c.fillStyle = glow; c.fillRect(0, 0, W, H);
  const P = 70;
  let y = story ? 120 : 64;
  // testata brand
  const mono = await socLoadImg(MONO_WHITE);
  if (mono) { const mh = 64, mw = (mono.width / mono.height) * mh; c.drawImage(mono, P, y, mw, mh); }
  c.fillStyle = '#fff'; c.font = `700 30px ${serif}`; c.textBaseline = 'alphabetic'; ls('3px');
  c.fillText('MS COACHING', P + 100, y + 30);
  c.fillStyle = '#D8B4FE'; c.font = `600 15px ${serif}`; ls('9px');
  c.fillText('MATTIAS SULA', P + 100, y + 58);
  ls('0px');
  // titolo
  y += story ? 250 : 182;
  c.fillStyle = '#fff'; c.font = `700 ${story ? 120 : 96}px ${serif}`;
  c.fillText(o.title, P, y);
  y += story ? 64 : 54;
  if (o.subtitle) { c.fillStyle = '#D8B4FE'; c.font = `500 ${story ? 36 : 30}px ${sans}`; c.fillText(o.subtitle, P, y); }
  y += story ? 60 : 44;
  // foto
  const hasPh = o.before && o.after;
  if (hasPh) {
    const gap = 26, bw = (W - 2 * P - gap) / 2, bh = story ? 900 : 600;
    const imgs = await Promise.all([socLoadImg(o.before.src), socLoadImg(o.after.src)]);
    [[imgs[0], o.before.label], [imgs[1], o.after.label]].forEach(([im, lab], i) => {
      const X = P + i * (bw + gap);
      c.save(); rr(0, c, X, y, bw, bh, 26); c.clip();
      c.fillStyle = '#0E0B12'; c.fillRect(X, y, bw, bh);
      if (im) drawCover(c, im, X, y, bw, bh, o.cropTop);
      const sh = c.createLinearGradient(0, y + bh - 140, 0, y + bh);
      sh.addColorStop(0, 'rgba(10,10,15,0)'); sh.addColorStop(1, 'rgba(10,10,15,0.85)');
      c.fillStyle = sh; c.fillRect(X, y + bh - 140, bw, 140);
      c.restore();
      c.fillStyle = i ? '#fff' : '#D8B4FE'; c.font = `700 22px ${sans}`; ls('4px');
      c.fillText(i ? 'DOPO' : 'PRIMA', X + 26, y + bh - 54); ls('0px');
      c.fillStyle = 'rgba(255,255,255,0.85)'; c.font = `500 22px ${sans}`;
      c.fillText(lab, X + 26, y + bh - 24);
    });
    y += bh + (story ? 60 : 40);
  } else {
    y += story ? 120 : 40;
  }
  // risultati
  const res = o.results.slice(0, 3);
  if (res.length) {
    const gap = 20, n = res.length, tw = (W - 2 * P - gap * (n - 1)) / n, th = hasPh ? (story ? 230 : 190) : (story ? 320 : 280);
    res.forEach((r, i) => {
      const X = P + i * (tw + gap);
      c.save(); rr(0, c, X, y, tw, th, 22); c.fillStyle = 'rgba(255,255,255,0.08)'; c.fill();
      c.strokeStyle = 'rgba(216,180,254,0.25)'; c.lineWidth = 2; c.stroke(); c.restore();
      c.fillStyle = '#fff';
      let fs = hasPh ? (story ? 64 : 56) : (story ? 84 : 72);
      c.font = `700 ${fs}px ${sans}`;
      while (c.measureText(r.value).width > tw - 48 && fs > 30) { fs -= 4; c.font = `700 ${fs}px ${sans}`; }
      c.fillText(r.value, X + 24, y + 34 + fs * 0.85);
      c.fillStyle = '#D8B4FE'; c.font = `500 ${story ? 28 : 24}px ${sans}`;
      wrapText(c, r.label, tw - 48).slice(0, 2).forEach((ln, j) => c.fillText(ln, X + 24, y + 60 + fs + j * (story ? 34 : 30)));
    });
    y += th;
  }
  // piede
  const cp = coachProfile();
  const handle = [cp.instagram, cp.sito].filter(Boolean).join('  ·  ');
  const fy = H - (story ? 120 : 64);
  c.fillStyle = 'rgba(255,255,255,0.9)'; c.font = `600 26px ${sans}`;
  if (handle) c.fillText(handle, P, fy);
  c.fillStyle = 'rgba(255,255,255,0.5)'; c.font = `400 17px ${sans}`;
  const disc = 'Risultati individuali: dipendono dalla persona, dal programma e dalla costanza.';
  c.textAlign = 'right'; c.fillText(disc, W - P, fy + (handle ? 0 : 0)); c.textAlign = 'left';
  if (!handle) { c.fillStyle = 'rgba(255,255,255,0.9)'; c.font = `600 26px ${sans}`; c.fillText('MS Coaching', P, fy); }
}

      body: `<div class="alert warn">${ic('lock')}<div><b>Consenso promozionale mancante.</b> ${esc(clientName(cl))} non ha acconsentito all'uso di foto e risultati per finalità promozionali (scheda cliente, sezione 14). Senza questo consenso la card non si può creare.</div></div>`,
      actions: [{ label: 'Chiudi' }, { label: 'Apri la scheda cliente', cls: 'primary', fn: () => { go({ v: 'client', clientId: cl.id, tab: 'sheet' }); } }],
    });

  }

      <div class="fld"><label>Confronto</label><div class="seg" id="soc-compare">${ctx.t0 ? `<button type="button" data-v="t0" class="${st.compare === 't0' ? 'on' : ''}">Dall'inizio</button>` : ''}${ctx.prev ? `<button type="button" data-v="prev" class="${st.compare === 'prev' ? 'on' : ''}">Ultimo blocco</button>` : ''}</div></div>
      <div class="fld"><label>Foto</label><select class="sel" id="soc-pose"></select></div>
      <div class="fld"><label>Nascondi il volto: taglia la parte alta delle foto</label><input type="range" id="soc-crop" min="0" max="45" value="${st.cropTop}"><div class="hint" id="soc-crop-v">${st.cropTop ? `Taglio del ${st.cropTop}% in alto` : 'Nessun taglio'}</div>${anon ? '<div class="hint" style="color:#92400E">Il cliente ha acconsentito solo alla forma anonima: niente nome e volto non riconoscibile.</div>' : ''}</div>
      <div class="fld"><label>Nome del cliente</label><div class="seg" id="soc-name">${[['nome', 'Nome'], ['iniziali', 'Iniziali'], ['no', 'Nessuno']].map(([k, l]) => `<button type="button" data-v="${k}" class="${st.name === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <div class="fld"><label>Risultati (massimo 3)</label><div id="soc-res" class="soc-res"></div></div>
    </div>
    <div class="soc-prev"><canvas id="soc-cv"></canvas></div>
  </div>`;
  openModal({
    title: 'Card per i social', wide: true, body,
    actions: [{ label: 'Chiudi' }, { label: `${ic('download')} Scarica PNG`, cls: 'primary', fn: async (m) => {
      const cv = m.querySelector('#soc-cv');
      const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
      const ok = await saveFile(`MS_Coaching_Card_${st.format}_${slug(clientName(cl))}_${(ctx.check.date || '').slice(0, 10)}.png`, blob);
      if (ok) toast(`${ic('check')} Card salvata.`);
      return false;
    } }],
    onOpen: (m) => {
      const cv = m.querySelector('#soc-cv');
      const fillPoses = () => {
        const ps = poses();
        const sel = m.querySelector('#soc-pose');
        sel.innerHTML = (ps.length ? ps.map(([k, l]) => `<option value="${k}" ${k === st.pose ? 'selected' : ''}>${esc(l)}</option>`).join('') : '') + `<option value="" ${!ps.length || st.pose === '' ? 'selected' : ''}>Senza foto</option>`;
        if (st.pose === null || (st.pose && !ps.some(([k]) => k === st.pose))) st.pose = ps.length ? ps[0][0] : '';
        sel.value = st.pose;
      };
      const fillRes = () => {
        const cands = socCandidates(ctx, baseOf());
        if (!st.picks) {
          // proposta: 3 risultati di famiglie diverse (niente doppioni come kg e % di grassa)
          const fam = (x) => (/^(b_pbf|b_mbf|p_bf|p_sum|p_fm)$/.test(x.k) ? 'grasso' : /^(peso|pesoMedio|b_peso)$/.test(x.k) ? 'peso' : x.k.startsWith('e1rm:') ? 'forza' : /^c_(vita|fianchi)/.test(x.k) ? 'vita' : x.m.g);
          const used = new Set(); st.picks = [];
          cands.filter((x) => x.m.g !== 'mob').forEach((x) => { if (st.picks.length < 3 && !used.has(fam(x))) { used.add(fam(x)); st.picks.push(x.k); } });
        }
        st.picks = st.picks.filter((k) => cands.some((x) => x.k === k));
        m.querySelector('#soc-res').innerHTML = cands.length ? cands.slice(0, 12).map((x) => `<label class="chk"><input type="checkbox" data-k="${esc(x.k)}" ${st.picks.includes(x.k) ? 'checked' : ''}> ${esc(socShortLabel(x.m))} <span class="muted small">${esc(x.p.txt)}</span></label>`).join('') : '<span class="small muted">Nessun miglioramento oltre l\'errore di misura in questo confronto.</span>';
        m.querySelectorAll('#soc-res input').forEach((i) => { i.onchange = () => {
          if (i.checked) { if (st.picks.length >= 3) { i.checked = false; toast('Massimo 3 risultati.'); return; } st.picks.push(i.dataset.k); } else st.picks = st.picks.filter((k) => k !== i.dataset.k);
          draw();
        }; });
      };
      const draw = async () => {
        const base = baseOf();
        const weeks = base ? Math.max(1, Math.round((daysBetween(base.date.slice(0, 10), ctx.check.date.slice(0, 10)) || 0) / 7)) : 0;
        const first = cl.anag?.nome || '';
        const ini = [cl.anag?.nome, cl.anag?.cognome].filter(Boolean).map((x) => x.trim()[0].toUpperCase() + '.').join(' ');
        const who = st.name === 'nome' && first ? `Il percorso di ${first}` : st.name === 'iniziali' && ini ? `Il percorso di ${ini}` : 'Un percorso MS Coaching';
        const cands = socCandidates(ctx, base);
        const results = st.picks.map((k) => cands.find((x) => x.k === k)).filter(Boolean).map((x) => ({ value: x.p.txt.replace(' pt', ' punti'), label: socShortLabel(x.m) }));
        const wt = (ch) => { const v = metricValue('pesoMedio', ch, cl) ?? metricValue('peso', ch, cl); return v !== null ? ` · ${fmtN(v, 1)} kg` : ''; };
        const bp = st.pose ? photoOf(base.id, st.pose) : null, ap = st.pose ? photoOf(ctx.check.id, st.pose) : null;
        await drawSocialCard(cv, {
          format: st.format, title: `${weeks} settimane`, subtitle: who, cropTop: st.cropTop / 100, results,
          before: bp ? { src: bp.dataUrl, label: fmtDate(base.date, { month: 'short', year: 'numeric' }) + wt(base) } : null,
          after: ap ? { src: ap.dataUrl, label: fmtDate(ctx.check.date, { month: 'short', year: 'numeric' }) + wt(ctx.check) } : null,
        });
      };
      const segBind = (id, key, after) => m.querySelectorAll(`#${id} button`).forEach((b) => { b.onclick = () => { st[key] = b.dataset.v; m.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b)); if (after) after(); draw(); }; });
      segBind('soc-format', 'format');
      segBind('soc-compare', 'compare', () => { st.picks = null; fillPoses(); fillRes(); });
      segBind('soc-name', 'name');
      m.querySelector('#soc-pose').onchange = (e) => { st.pose = e.target.value; draw(); };
      m.querySelector('#soc-crop').oninput = (e) => { st.cropTop = +e.target.value; m.querySelector('#soc-crop-v').textContent = st.cropTop ? `Taglio del ${st.cropTop}% in alto` : 'Nessun taglio'; draw(); };
      fillPoses(); fillRes();
      (document.fonts?.ready || Promise.resolve()).then(draw);
    },
  });
}
