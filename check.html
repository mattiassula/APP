const VAL = { ctl: null, running: false };

function dataUrlToBlob(u) {
  const [h, b64] = String(u).split(',');
  const mime = (h.match(/data:([^;]+)/) || [, 'image/jpeg'])[1];
  const bin = atob(b64 || '');
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

/** tutti i dati del check in forma di testo compatto */
function valutazioneDati(ctx) {
  const { check, client, ref, t0, series, meta } = ctx;
  const L = [];
  const a = client.anag || {};
  const age = ageFrom(a.dataNascita, check.date);
  L.push('## CLIENTE');
  L.push(`Nome: ${a.nome || 'n.d.'} · ${age !== null ? age + ' anni' : 'età n.d.'} · ${optLabel('sesso', a.sesso) || 'sesso n.d.'} · altezza ${a.altezza || 'n.d.'} cm`);
  L.push(`Obiettivo principale: ${optLabel('obiettivo', client.obiettivo?.principale) || 'n.d.'}${a.obiettivoMacro ? ' · ' + a.obiettivoMacro : ''}`);
  if (client.obiettivo?.descrizione) L.push(`Descrizione obiettivo: ${client.obiettivo.descrizione}`);
  if (client.obiettivo?.scadenze) L.push(`Scadenze: ${client.obiettivo.scadenze}`);
  if (client.storia?.esperienza) L.push(`Esperienza: ${client.storia.esperienza}`);
  if (client.storia?.puntiForti) L.push(`Punti forti/carenti dichiarati: ${client.storia.puntiForti}`);
  const inf = (client.infortuni?.passati || []).filter((r) => r.zona || r.tipo).map((r) => `${r.zona || ''} ${r.tipo || ''} ${r.anno || ''} (risolto: ${optLabel('risolto', r.risolto) || 'n.d.'}; limiti: ${r.limiti || '-'})`);
  if (inf.length) L.push(`Infortuni passati: ${inf.join('; ')}`);
  if (client.infortuni?.limitazioni) L.push(`Limitazioni di movimento: ${client.infortuni.limitazioni}`);
  if (client.riab?.attivo) L.push(`Percorso riabilitativo attivo: ${client.riab.diagnosi || ''} · fase ${client.riab.faseRecupero || 'n.d.'} · da evitare: ${client.riab.movEvitare || '-'}`);
  const scr = SCREENING_Q.map((q, i) => (client.screening?.['q' + (i + 1)] === 'si' ? `${i + 1}. ${q}` : '')).filter(Boolean);
  if (scr.length) L.push(`Screening salute, risposte SÌ: ${scr.join(' | ')}${client.screening?.dettagli ? ' · dettagli: ' + client.screening.dettagli : ''}`);
  L.push('');
  L.push(`## CHECK ATTUALE: ${meta.title} (${meta.sub}) del ${fmtDate(check.date)}${isQuick(check) ? ' · check rapido' : ''}`);
  L.push(`Confronto principale con: ${ref ? `${checkMeta(series, ref).title} del ${fmtDate(ref.date)}` : 'nessuno (è il check iniziale)'}${t0 && t0 !== ref ? ` · inizio percorso: ${fmtDate(t0.date)}` : ''}`);
  L.push(`Fase alimentare: ${optLabel('fase', check.benessere?.fase) || 'n.d.'} · protocollo pre-check rispettato: ${optLabel('protocollo', check.protocollo) || 'n.d.'}`);
  L.push('');
  L.push('## MISURE E TEST (valori; Δ = variazione; "entro errore" = sotto la soglia di errore di misura, quindi stabile)');
  const cols = series.length > 6 ? [series[0]].concat(series.slice(-5)) : series;
  const rows = historyRows(Object.assign({}, ctx, { series: cols }));
  L.push(`Colonne: ${cols.map((c) => checkMeta(series, c).short + ' ' + fmtDate(c.date)).join(' | ')}`);
  rows.forEach((r) => {
    if (r.group) { L.push(`### ${r.group}`); return; }
    const m = r.m;
    const last = r.vals.length - 1;
    const cur = r.vals[last];
    let tail = '';
    if (ref && cur !== null) {
      const rv = metricValue(m.k, ref, client);
      const st = deltaState(m, cur, rv, check, client);
      const p = deltaParts(m, cur, rv);
      const lab = (s) => (s === 'good' ? 'miglioramento reale' : s === 'bad' ? 'peggioramento reale' : s === 'stable' ? 'entro errore, stabile' : 'variazione');
      if (p) tail = ` · Δ vs confronto ${p.txt} (${lab(st)}; soglia errore ±${fmtN(errOf(m), 2)})`;
      if (t0 && t0 !== ref) { const tv = metricValue(m.k, t0, client); const p0 = deltaParts(m, cur, tv); if (p0) tail += ` · Δ dall'inizio ${p0.txt} (${lab(deltaState(m, cur, tv, check, client))})`; }
    }
    L.push(`- ${m.l} (${m.u || '-'}): ${r.vals.map((v) => (v === null ? '-' : fmtN(v, m.d))).join(' | ')}${tail}`);
  });
  const fz = (check.forza || []).filter((r) => r.es);
  if (fz.length) {
    L.push('### Test di forza a carico fisso (oggi)');
    fz.forEach((r) => { const pr = ref ? forzaRow(ref, r.es) : null; L.push(`- ${r.es}: ${r.kg} kg × ${r.reps} rip${pr ? ` (prima: ${pr.kg} kg × ${pr.reps})` : ''}`); });
  }
  const as = asymList(check, ref);
  if (as.length) {
    L.push('### Asimmetrie SX/DX (oggi; >5% attenzione, >10% criticità)');
    as.forEach((x) => L.push(`- ${x.l}: SX ${fmtN(x.sx, 1)} / DX ${fmtN(x.dx, 1)} ${x.u} → ${fmtN(x.a, 1)}%${x.pa !== null ? ` (prima ${fmtN(x.pa, 1)}%)` : ''}`));
  }
  const dol = (check.dolori || []).filter((d) => d.zona);
  if (dol.length) {
    L.push('### Dolori/fastidi (0-10)');
    dol.forEach((d) => { const p = ref ? (ref.dolori || []).find((x) => exKey(x.zona) === exKey(d.zona)) : null; L.push(`- ${d.zona}: ${d.int || '-'}/10${p ? ` (prima ${p.int || '-'}/10)` : ''} · ${d.quando || ''}`); });
  }
  const b = check.bilancio || {};
  if (b.funzionato || b.nonFunzionato) L.push(`Bilancio del blocco · ha funzionato: ${b.funzionato || '-'} · non ha funzionato: ${b.nonFunzionato || '-'}`);
  const rev = goalsReview(ctx);
  if (rev && rev.length) {
    L.push('### Obiettivi del blocco appena concluso');
    rev.forEach((r) => L.push(`- ${r.label}: ${GOAL_STATE[r.state]}${r.pct !== null ? ` (${fmtN(r.pct, 0)}% del percorso)` : ''}`));
  }
  const ng = goalsOf(check);
  if (ng.length) { L.push('### Obiettivi fissati per le prossime 12 settimane'); ng.forEach((g) => L.push(`- ${goalLabel(g)}`)); }
  const tn = [['Test, note', check.mobilita?.noteAtl], ['Tecnica e osservazioni del coach', check.tecnica], ['Postura e fastidi (coach)', check.coach?.postura], ['Punti di attenzione (coach)', check.sintesi?.attenzione], ['Impressioni psicologiche (coach)', check.coach?.psico], ['Obiettivo concordato', check.sintesi?.obiettivo], ['Focus del blocco', check.sintesi?.focus]].filter(([, v]) => v);
  if (tn.length) { L.push('### Note'); tn.forEach(([k, v]) => L.push(`- ${k}: ${String(v).replace(/\n/g, ' / ')}`)); }
  return L.join('\n');
}

function valutazionePrompt(ctx, imgLabels) {
  return `Sei l'assistente tecnico di ${S.settings.coachName || 'un personal trainer'}, personal trainer (certificazione CONI, formazione in Scienze Motorie) del servizio MS Coaching, che lavora a blocchi di 12 settimane. Scrivi la VALUTAZIONE FINALE del check qui sotto usando SOLO i dati forniti.

REGOLE
- Italiano, registro professionale e chiaro.
- Le variazioni indicate come "entro errore, stabile" NON sono cambiamenti reali: non presentarle come progressi né come peggioramenti.
- Non inventare valori e non citare misure che non ci sono.
- Niente diagnosi mediche, niente indicazioni su farmaci, integratori o diete specifiche. Se ci sono dolore in aumento o almeno 4/10, risposte "Sì" allo screening, cali di forza marcati o perdite di peso troppo rapide, segnalalo e suggerisci il confronto con il medico o il fisioterapista.
- Foto: descrivi solo ciò che si vede nel confronto (composizione corporea, definizione, postura) con prudenza e rispetto; nessun giudizio estetico. Se luce, posa o distanza sono diverse tra le foto, dillo. Se non ci sono foto, "foto" è una stringa vuota.
${imgLabels.length ? `\nIMMAGINI ALLEGATE, nell'ordine:\n${imgLabels.map((l, i) => `${i + 1}. ${l}`).join('\n')}\n` : '\nNessuna immagine allegata.\n'}
DATI
${valutazioneDati(ctx)}

FORMATO DELLA RISPOSTA: solo un oggetto JSON con queste chiavi:
{"sintesi": "4-6 frasi rivolte al cliente (dai del tu, usa il nome), oneste e motivanti, con 2-3 numeri chiave",
 "punti_forza": ["3-5 frasi brevi"],
 "aree_miglioramento": ["2-4 frasi brevi e costruttive"],

async function valutazioneImmagini(ctx, sample) {
  let max = 0;
  try { const lim = await sample.limits(); max = lim?.images?.maxCount || 0; } catch (e) { max = 0; }
  if (!max) return { images: [], labels: [] };
  const poses = PHOTO_POSES.concat((ctx.check.foto?.extra || []).map((x) => [x.key, x.label]));
  const imgs = [], labels = [];
  poses.forEach(([k, l]) => {
    const cur = photoOf(ctx.check.id, k);
    if (!cur) return;
    const rf = refPhotoFor(ctx, k);
    if (rf && imgs.length + 2 <= max) { imgs.push(dataUrlToBlob(rf.photo.dataUrl)); labels.push(`${l} · PRIMA (${fmtDate(rf.check.date)})`); }
    if (imgs.length + 1 <= max) { imgs.push(dataUrlToBlob(cur.dataUrl)); labels.push(`${l} · OGGI (${fmtDate(ctx.check.date)})`); }
  });
  return { images: imgs, labels };
}

async function generaValutazione() {
  if (eclQui()) return eclValutazione();
  if (VAL.running || !S.check) return;
  const sample = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null;
  if (!sample) { toast('La valutazione automatica funziona aprendo l\'app dall\'app Claude, con il tuo account.', 'bad', 6000); return; }
  const v0 = S.check.valutazione || {};
  if ((v0.sintesi || v0.noteCoach) && v0.edited) {
    const ok = await confirmBox('Rigenerare la valutazione?', 'La valutazione attuale, con le tue modifiche, verrà sostituita da una nuova.', 'Rigenera');
    if (!ok) return;
  }
  await flush();
  const ctx = curCtx();
  const checkId = S.check.id;
  VAL.running = true;
  VAL.ctl = new AbortController();
  const btn = $('#val-gen'), stop = $('#val-stop'), st = $('#val-status'), live = $('#val-live');
  if (btn) btn.disabled = true;
  if (stop) stop.hidden = false;
  if (st) st.innerHTML = '<span class="spin-sm"></span> Claude sta leggendo dati e foto… di solito ci vuole fino a un paio di minuti.';
  try {
    const { images, labels } = await valutazioneImmagini(ctx, sample);
    const prompt = valutazionePrompt(ctx, labels);
    const out = await sample.json(prompt, {
      images: images.length ? images : undefined, modelTier: 'default', cache: false, signal: VAL.ctl.signal,
      onText: () => { if (st) st.innerHTML = '<span class="spin-sm"></span> Claude sta scrivendo la valutazione…'; },
    });
    const arr = (x) => (Array.isArray(x) ? x.map((s) => String(s).trim()).filter(Boolean).join('\n') : String(x || '').trim());
    const target = S.checks.find((c) => c.id === checkId);
    if (!target) return;
    target.valutazione = {
      sintesi: String(out?.sintesi || '').trim(), puntiForza: arr(out?.punti_forza), aree: arr(out?.aree_miglioramento),
      foto: String(out?.foto || '').trim(), raccomandazioni: arr(out?.raccomandazioni), noteCoach: String(out?.note_coach || '').trim(),
      allerta: arr(out?.allerta), generatedAt: Date.now(), edited: false, inPdf: v0.inPdf !== false, conFoto: labels.length,
    };
    touch('check', target);
    if (S.check && S.check.id === checkId) { const box = $('#val-box'); if (box) box.innerHTML = valBodyHTML(curCtx()); }
    toast(`${ic('check')} Valutazione pronta${labels.length ? ` (analizzate ${labels.length} foto)` : ''}: rileggila e correggila se serve.`, '', 5000);
  } catch (e) {
    const code = e && e.code;
    const msg = {
      cancelled: 'Generazione interrotta.',
      not_granted: 'Per generare la valutazione serve il permesso di usare Claude da questa pagina.',
      sampling_disabled: 'Claude non è disponibile per questo account.',
      rate_limited: 'Troppe richieste in poco tempo o limite di utilizzo raggiunto: riprova tra qualche minuto.',
      image_rejected: 'Una delle foto non è stata accettata: riprova, eventualmente senza foto.',
      images_unavailable: 'In questa vista non si possono inviare foto.',
      invalid_json: 'La risposta non era nel formato atteso: riprova.',
      refused: 'Claude non ha potuto completare la valutazione con questi dati.',
      prompt_too_large: 'Troppi dati per una sola richiesta.',
      session_expired: 'Sessione scaduta: accedi di nuovo a Claude.',
    }[code] || 'Non sono riuscito a generare la valutazione: riprova tra poco.';
    if (st) st.textContent = msg;
    if (code !== 'cancelled') toast(msg, 'bad', 6000);
  } finally {
    VAL.running = false;
    const b2 = $('#val-gen'), s2 = $('#val-stop');
    if (b2) b2.disabled = false;
    if (s2) s2.hidden = true;
    if (live) live.hidden = true;
  }
}

let PDFJS = null;
async function loadPdfJs() {
  if (PDFJS) return PDFJS;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = PDFJS_URL + 'pdf.min.js'; s.onload = res; s.onerror = () => rej(new Error('Lettore PDF non disponibile: carica le foto delle pagine.')); document.head.appendChild(s); });
  PDFJS = window.pdfjsLib;
  PDFJS.GlobalWorkerOptions.workerSrc = PDFJS_URL + 'pdf.worker.min.js';
  return PDFJS;
}
async function pdfToImages(file) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  for (let i = 1; i <= Math.min(doc.numPages, 12); i++) {
    const page = await doc.getPage(i);
    const vp0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 1500 / Math.max(vp0.width, vp0.height) });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: x, viewport: vp }).promise;
    out.push(await fitDataUrl(cv.toDataURL('image/jpeg', 0.8)));
  }
  return out;
}
async function uploadSigned(files) {
  const cl = S.client;
  if (!cl || !files.length) return;
  const prog = progressBox('Preparo le pagine del modulo…');
  try {
    const imgs = [];
    for (const f of files) {
      if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) imgs.push(...await pdfToImages(f));
      else { const first = await compressImage(f, 1700, 0.8); imgs.push(first.dataUrl.length <= 230000 ? first : await fitDataUrl(first.dataUrl)); }
    }
    if (!imgs.length) throw new Error('Nessuna pagina trovata.');
    for (const p of signedPages(cl.id)) { await DB.del('photos', p.id); S.photos.delete(p.id); }
    for (let i = 0; i < imgs.length; i++) {
      const p = { id: uid(), clientId: cl.id, checkId: SIGNED, slot: 'pg' + (i + 1), page: i + 1, dataUrl: imgs[i].dataUrl, w: imgs[i].w, h: imgs[i].h, createdAt: Date.now() };
      await DB.put('photos', p); S.photos.set(p.id, p);
    }
    cl.consensi = cl.consensi || {};
    cl.consensi.firmato = true; cl.consensi.firmatoIl = todayISO();
    touch('client', cl);
    prog.close();
    toast(`${ic('check')} Modulo firmato archiviato (${imgs.length} ${imgs.length === 1 ? 'pagina' : 'pagine'}). Ora registra qui sotto le scelte del cliente.`, '', 5000);
    rerenderKeepScroll();
  } catch (e) { prog.close(); toast('Caricamento non riuscito: ' + esc(e.message || ''), 'bad', 6000); }
}

      <p class="rp-legal-i" style="margin-top:2mm"><b>Il cliente</b> (di seguito «il cliente»):</p>
      <div class="rp-fgrid">
        ${kv('Nome e cognome', v(clientName(client)), true)}
        ${kv('Nato/a a', v(a.luogoNascita))}${kv('Il', a.dataNascita ? fmtDate(a.dataNascita) : v(''))}
        ${kv('Codice fiscale', v(a.codiceFiscale))}${kv('Telefono', v(a.telefono))}
        ${kv('Residenza', v(a.indirizzo), true)}
        ${kv('E-mail', v(a.email), true)}
        ${kv('Contatto in caso di emergenza (nome e telefono)', v(a.emergenza), true)}
      </div>
      ${minor ? `<div class="rp-minor"><b>Cliente minorenne (${age} anni).</b> Il documento è sottoscritto da chi esercita la responsabilità genitoriale, che rende le dichiarazioni e i consensi per conto del minore${under14 ? '; per la diffusione di immagini di un minore di 14 anni serve il consenso di entrambi i genitori' : ''}:
        <div class="rp-fgrid" style="margin-top:2mm">${kv('Genitore/tutore 1 · nome e cognome', v(''), true)}${kv('Codice fiscale', v(''))}${kv('Telefono', v(''))}${kv('Genitore/tutore 2 · nome e cognome', v(''), true)}${kv('Codice fiscale', v(''))}${kv('Telefono', v(''))}</div></div>` : ''}
    </section>

    <section class="rp-sec"><div class="rp-h"><span class="n">${N()}</span><span class="t">Il servizio</span></div>
      <div class="rp-decl">
        ${li(`Il coach fornisce un servizio di allenamento personalizzato ${modo}, organizzato in blocchi di 12 settimane: valutazione iniziale e check periodici, programmazione degli allenamenti, monitoraggio dei progressi e indicazioni sull'esecuzione degli esercizi.`)}
        ${li('Il servizio è un\'attività motoria e sportiva, <b>non sanitaria</b>: il coach non formula diagnosi, non prescrive o modifica terapie e non elabora piani alimentari, diete o integrazioni, che restano di competenza di medici, fisioterapisti, nutrizionisti e dietisti.')}
        ${li('Il coach si impegna a svolgere il servizio con diligenza professionale e secondo le conoscenze scientifiche aggiornate. È un\'obbligazione di mezzi: i risultati dipendono anche da fattori individuali e dall\'impegno del cliente, e <b>non possono essere garantiti</b>.')}
        ${li('Per tutelare la salute del cliente, il coach può <b>sospendere o adattare</b> il programma quando mancano le condizioni di sicurezza: dolore, sintomi sospetti, parere medico richiesto e non ancora ottenuto, informazioni sulla salute non aggiornate.')}
        ${li('Corrispettivo, durata e modalità di pagamento e di recesso sono quelli concordati tra le parti al momento dell\'adesione.')}
      </div>
    </section>

    <section class="rp-sec"><div class="rp-h"><span class="n">${N()}</span><span class="t">Dichiarazioni sullo stato di salute</span></div>
      <div class="rp-decl"><p class="rp-legal-i">Il cliente, consapevole che il programma viene costruito sulle informazioni che fornisce, dichiara:</p>
        ${li('di aver risposto in modo <b>veritiero e completo</b> alle domande della scheda anamnestica e dello screening sullo stato di salute, e di non aver taciuto patologie, disturbi, infortuni, interventi, farmaci o gravidanza;')}
        ${li('di impegnarsi a comunicare <b>subito</b> al coach ogni variazione: nuove diagnosi o farmaci, infortuni, interventi, gravidanza, dolori, vertigini o malesseri durante o dopo l\'allenamento;')}
        ${li(`riguardo al certificato medico di idoneità all'attività sportiva non agonistica (D.M. 24 aprile 2013):<br>
          ${box(sc.certificato === 'si')} di esserne in possesso, valido fino al ${sc.certificato === 'si' && sc.certScadenza ? `<b>${fmtDate(sc.certScadenza)}</b>` : '<span class="rp-blank sm"></span>'}, e di consegnarne copia, impegnandosi a rinnovarlo alla scadenza;<br>
          ${box(sc.certificato === 'no')} di non esserne in possesso: il coach ne raccomanda il rilascio prima di iniziare e il cliente sceglie di procedere sotto la propria responsabilità;`)}
        ${med.length ? li(`avendo risposto «Sì» alle domande ${med.join(', ')} dello screening, di <b>non iniziare né proseguire</b> l'attività senza il parere favorevole del proprio medico, da consegnare al coach insieme a eventuali limitazioni;`) : ''}
        ${li('di essere informato/a che l\'attività fisica, anche se programmata con cura, comporta rischi (affaticamento, dolori muscolari, infortuni muscolo-scheletrici e, raramente, eventi cardiovascolari) che il programma riduce ma non può eliminare, e di accettarli consapevolmente.')}
      </div>
    </section>

    <section class="rp-sec"><div class="rp-h"><span class="n">${N()}</span><span class="t">Impegni del cliente e responsabilità</span></div>
      <div class="rp-decl">
        ${li('Il cliente segue le indicazioni ricevute, esegue il riscaldamento previsto, non modifica carichi, volumi ed esercizi senza confrontarsi con il coach e <b>interrompe subito</b> l\'esercizio in caso di dolore, vertigini, dolore al petto, mancanza di respiro o malessere, avvisando il coach.')}
        ${li('Negli allenamenti svolti in autonomia o nel percorso online, il cliente si allena in luoghi e con attrezzature sicuri, integri e adeguati, ne verifica lo stato prima dell\'uso e risponde della propria condotta e del rispetto delle regole della struttura in cui si allena.')}
        ${li('Il coach risponde del proprio operato nei limiti previsti dalla legge. Non risponde dei danni derivanti da: informazioni sulla salute non veritiere, incomplete o non aggiornate; mancato rispetto delle indicazioni ricevute; allenamenti svolti in autonomia in modo difforme dal programma; uso di attrezzature o strutture di terzi; condizioni di salute non comunicate. <b>Resta ferma la responsabilità per dolo o colpa grave</b> (art. 1229 c.c.).')}
      </div>
    </section>

    <section class="rp-sec"><div class="rp-h"><span class="n">${N()}</span><span class="t">Informativa sul trattamento dei dati</span></div>
      <p class="rp-legal-i">Ai sensi degli artt. 13 e 14 del Regolamento UE 2016/679 (GDPR) e del D.Lgs. 196/2003 come modificato dal D.Lgs. 101/2018.</p>
      <div class="rp-legal">
        <p><b>Titolare del trattamento.</b> ${titolare}. Contatti: ${p.email ? esc(p.email) : '<span class="rp-blank sm"></span>'}${p.telefono ? ` · ${esc(p.telefono)}` : ''}.</p>
        <p><b>Quali dati.</b> Dati anagrafici e di contatto, compreso il contatto di emergenza; dati relativi alla salute (risposte allo screening, infortuni, dolori, farmaci, certificato medico, indicazioni di medici e fisioterapisti), che sono «categorie particolari» ai sensi dell'art. 9 GDPR; misure antropometriche, composizione corporea e risultati dei test fisici; fotografie e video, solo se autorizzati; i messaggi scambiati con il coach.</p>
        <p><b>Perché e su quale base.</b> (a) Svolgere il servizio richiesto: programmarlo, adattarlo e monitorarne i risultati, per esecuzione del contratto (art. 6.1.b) e, per i dati sulla salute, con il consenso esplicito (art. 9.2.a); (b) fotografie e video per il monitoraggio, (c) scambio di informazioni con i professionisti sanitari indicati, (d) uso promozionale di immagini e risultati: solo con il consenso specifico (art. 6.1.a); (e) adempimenti fiscali e di legge (art. 6.1.c); (f) accertare, esercitare o difendere un diritto in sede giudiziaria (artt. 6.1.f e 9.2.f); (g) contattare la persona indicata in caso di emergenza, per tutelare un interesse vitale del cliente (art. 6.1.d).</p>
        <p><b>Obbligo o facoltà.</b> I dati anagrafici e quelli sulla salute sono necessari: senza, il servizio non può essere svolto in sicurezza. I consensi dal 2 al 4 sono facoltativi: il rifiuto non cambia il servizio.</p>
        <p><b>Come.</b> Con strumenti elettronici e cartacei e misure di sicurezza adeguate (accesso riservato al titolare, protezione con password, copie di sicurezza). I dati possono essere trattati da fornitori di servizi informatici nominati responsabili del trattamento (art. 28)${fornitori.length ? `: ${fornitori.map(esc).join('; ')}` : ''}. Se un fornitore tratta i dati fuori dall'Unione europea, il trasferimento avviene solo con le garanzie previste dagli artt. 44-49 GDPR (decisione di adeguatezza o clausole contrattuali standard approvate dalla Commissione europea). Non viene presa alcuna decisione basata unicamente su un trattamento automatizzato (art. 22). Le comunicazioni possono avvenire anche tramite app di messaggistica scelte dal cliente.</p>
        <p><b>A chi.</b> I dati non vengono diffusi né venduti. Possono essere comunicati ai professionisti sanitari indicati dal cliente (solo con il consenso 3), al consulente fiscale per gli obblighi di legge, a legali e assicurazioni in caso di contenzioso o sinistro, e alle autorità quando la legge lo richiede. Immagini e risultati vengono pubblicati solo con il consenso 4.</p>
        <p><b>Per quanto tempo.</b> Per tutta la durata del servizio e fino a ${mesi} mesi dalla sua conclusione, per consentirne l'eventuale ripresa; questo documento e le dichiarazioni sulla salute fino a 10 anni, per la tutela dei diritti delle parti (art. 2946 c.c.); i documenti fiscali per 10 anni (art. 2220 c.c.); i dati trattati in base a un consenso fino alla sua revoca.</p>
        <p><b>Diritti.</b> In ogni momento il cliente può chiedere accesso, rettifica, cancellazione, limitazione, portabilità dei dati e opporsi al trattamento (artt. 15-22 GDPR), scrivendo ai contatti del titolare. Può revocare ogni consenso senza pregiudicare la liceità del trattamento già svolto (art. 7.3) e proporre reclamo al Garante per la protezione dei dati personali (garanteprivacy.it).</p>
      </div>
    </section>

    <section class="rp-sec"><div class="rp-h"><span class="n">${N()}</span><span class="t">Consensi</span></div>
      <p class="rp-legal-i">Ogni consenso è separato e, tranne il primo, facoltativo. Si può revocare in qualsiasi momento scrivendo al titolare. Segnare una casella per ogni voce.</p>
      ${choice(1, 'Dati relativi alla salute', 'Trattamento dei dati sulla salute (art. 9.2.a GDPR) per programmare, adattare e monitorare il servizio in sicurezza. <i>Necessario: senza questo consenso il servizio non può essere svolto.</i>')}
      ${choice(2, 'Foto e video di monitoraggio', 'Fotografie della condizione fisica e video degli esercizi per valutare progressi e tecnica. Uso interno: non vengono mostrati a terzi né pubblicati.')}
      ${choice(3, 'Professionisti sanitari', `Scambio di informazioni sul percorso con i professionisti sanitari che mi seguono${prof ? ` (<b>${esc(prof)}</b>)` : ' (indicare: <span class="rp-blank sm"></span>)'}, per coordinare l'allenamento con le loro indicazioni.`)}
      ${choice(4, 'Uso promozionale e liberatoria per le immagini', `Autorizzo, ai sensi dell'art. 10 c.c. e degli artt. 96 e 97 della L. 633/1941, la pubblicazione di fotografie (anche prima/dopo) e risultati del percorso sui canali di MS Coaching (social network, sito, materiali informativi), senza limiti di territorio, a titolo gratuito e senza nulla pretendere, escluso ogni uso che pregiudichi dignità, onore e decoro. Il consenso si può revocare in ogni momento: le immagini non verranno più usate e quelle già pubblicate saranno rimosse dai canali del coach entro 30 giorni dalla richiesta.${under14 ? ' <b>Per un minore di 14 anni serve la firma di entrambi i genitori.</b>' : ''} Se acconsento: ${box(false)} con nome e volto &nbsp; ${box(false)} solo in forma anonima (senza nome, volto non riconoscibile).`)}
    </section>

    <section class="rp-sec rp-keep rp-signs"><div class="rp-h"><span class="n">${N()}</span><span class="t">Firme</span></div>
      <div class="rp-fgrid">${kv('Luogo e data', v(client.consensi?.luogoData), true)}</div>
      <p class="rp-legal-i" style="margin-top:2mm">Il cliente dichiara di aver letto l'intero documento, di averne compreso il contenuto e di riceverne copia.</p>
      <div class="rp-signrow">${signsCli}${sign(`Firma del coach · ${esc(coach)}`)}</div>
      <div class="rp-specific">
        <p class="rp-legal-i" style="margin:0 0 1mm"><b>Approvazione specifica (artt. 1341 e 1342 c.c.).</b> Il cliente dichiara di aver letto e di approvare specificamente le clausole delle sezioni 02 (sospensione o adattamento del programma, risultati non garantiti), 03 (dichiarazioni sullo stato di salute, certificato medico e accettazione dei rischi) e 04 (limitazioni di responsabilità).</p>
        <div class="rp-signrow" style="margin-top:6mm">${minor ? `${sign('Firma del genitore o tutore')}${sign('Firma del secondo genitore')}` : `${sign('Firma del cliente')}<div></div>`}</div>
      </div>
      <p class="rp-note" style="margin-top:3mm">Documento in duplice copia: una resta al cliente, una a ${esc(p.titolare)}. Siglare ogni pagina in basso.${p.email ? ` Per esercitare i diritti o revocare un consenso: ${esc(p.email)}.` : ''}</p>
    </section>`;
}
