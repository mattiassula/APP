<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MS Coaching</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MS Coaching">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // tema salvato all'ultima apertura: decide colore di sfondo e barra di stato prima che si veda qualcosa
  var TEMA = 'scuro'; try { if (localStorage.getItem('msc_tema_ingresso') === 'chiaro') TEMA = 'chiaro'; } catch (e) {}
  var SFONDO = { scuro: '#0B0810', chiaro: '#F5F1F7' };
  // barra di stato "default": l'app parte sotto la barra e arriva fino al fondo. Con "black-translucent" l'iPhone lascia una fascia nera in basso.
  document.write('<meta name="theme-color" content="' + SFONDO[TEMA] + '">');
  document.documentElement.style.background = SFONDO[TEMA];
</script>
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:inherit;transition:background-color .25s}
  #app{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;border:0;display:block;background:inherit}
  #avvio{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:inherit;transition:opacity .4s}
  #avvio img{width:88px;height:88px;border-radius:22px}
  #avvio.via{opacity:0;pointer-events:none}
</style>
</head>
<body>
<!--
  UNICA COSA DA CAMBIARE: incolla qui sotto, tra le virgolette, il link della tua app (quello che finisce con /exec).
-->
<script>var LINK_APP = 'https://script.google.com/macros/s/AKfycbwUeDvVTebZxWKhjHrNQmx4dBSzV4HU4poxPj6HJjb5Q4i6rWN0Y05_DZyQUDgVTiABjw/exec';</script>

<div id="avvio"><img src="icona-180.png" alt="MS Coaching"></div>
<script>
  // modo "apri": se l'app dentro la pagina desse problemi, aggiungi ?apri al link oppure cambia false in true
  var APRI = false || /[?&]apri\b/.test(location.search);
  if (!/^https:\/\//.test(LINK_APP)) {
    document.getElementById('avvio').innerHTML = '<p style="color:#888;font:15px Arial;padding:24px;text-align:center">Manca il link dell\'app in index.html</p>';
  } else if (APRI) {
    location.replace(LINK_APP);
  } else {
    var f = document.createElement('iframe');
    f.id = 'app'; f.src = LINK_APP; f.allow = 'clipboard-write; fullscreen';
    f.onload = function () { setTimeout(function () { document.getElementById('avvio').className = 'via'; }, 300); };
    document.body.appendChild(f);
    // iPhone dalla Home: la pagina passa sotto la barra in alto ma l'iPhone la crede piu' corta dello schermo,
    // cosi' l'app (e la barra delle icone) resta sollevata dal fondo. Qui la allungo fino al fondo vero.
    var sonda = document.createElement('div');
    sonda.style.cssText = 'position:fixed;top:0;left:0;width:0;visibility:hidden;pointer-events:none;height:env(safe-area-inset-top)';
    document.body.appendChild(sonda);
    var altezza = function () {
      var h = window.innerHeight;
      if (window.navigator.standalone && sonda.offsetHeight > 0) {
        var orizz = Math.abs(window.orientation || 0) === 90;
        var schermo = orizz ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        if (schermo > h && schermo - h < 120) h = schermo;
      }
      f.style.height = h + 'px'; f.style.bottom = 'auto';
    };
    altezza();
    window.addEventListener('resize', altezza);
    window.addEventListener('orientationchange', function () { setTimeout(altezza, 350); });
    setTimeout(altezza, 500); setTimeout(altezza, 1500);
    // l'app dice quale tema usa: lo sfondo intorno prende lo stesso colore, e la prossima apertura parte gia' giusta
    // "Resta connesso": l'app lascia qui il suo gettone di accesso (mai il PIN) e lo riprende quando si apre
    var daGoogle = function (o) { return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/.test(o); };
    window.addEventListener('message', function (ev) {
      var d = ev.data; if (!d || !daGoogle(ev.origin)) return;
      if (d.msc === 'pronto') {
        var acc = null; try { acc = JSON.parse(localStorage.getItem('msc_accesso') || 'null'); } catch (e) {}
        if (ev.source) ev.source.postMessage({ msc: 'cred', c: acc && acc.c || '', t: acc && acc.t || '' }, ev.origin);
        return;
      }
      if (d.msc === 'cred' && d.c && d.t) { try { localStorage.setItem('msc_accesso', JSON.stringify({ c: String(d.c), t: String(d.t) })); } catch (e) {} return; }
      if (d.msc === 'esci') { try { localStorage.removeItem('msc_accesso'); } catch (e) {} return; }
    });
    window.addEventListener('message', function (ev) {
      var d = ev.data; if (!d || d.msc !== 'tema') return;
      var t = d.tema === 'chiaro' ? 'chiaro' : 'scuro';
      document.documentElement.style.background = SFONDO[t];
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', SFONDO[t]);
      try { localStorage.setItem('msc_tema_ingresso', t); } catch (e) {}
    });
    setTimeout(function () { document.getElementById('avvio').className = 'via'; }, 6000);
  }
</script>
</body>
</html>
