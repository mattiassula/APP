  var altri=l.filter(function(e){return gruppi.indexOf(e.gruppo)<0});if(altri.length)o.push(['Senza gruppo',altri]);return o}

// e = esercizio da modificare; pre = nome per uno nuovo; copia = esercizio da duplicare (nuovo, con i suoi dati)
function catModulo(e,pre,dopo,copia){catCarica(function(d){var x=e||(copia?Object.assign({},copia,{nome:copia.nome+' (variante)'}):null)||{nome:pre||'',registrazione:'peso_rip',gruppo:CAT.g||'',primari:[],secondari:[],categoria:'',attrezzo:'',schema:'',unilaterale:false,tipo:'',articolazioni:'',profilo:'',descrizione:'',errori:'',varianti:'',video:'',note:''};
  var st={primari:(x.primari||[]).slice(),secondari:(x.secondari||[]).slice(),tipo:x.tipo,articolazioni:x.articolazioni,profilo:x.profilo};
  var opz=function(l,v,vuoto){return'<option value="">'+(vuoto||'–')+'</option>'+l.map(function(o){return'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+(v&&l.indexOf(v)<0?'<option selected>'+esc(v)+'</option>':'')};
  var seg=function(k,voci){return'<div class="cat-seg" data-seg="'+k+'">'+voci.map(function(v){return'<button type="button" data-v="'+esc(v[0])+'"'+(st[k]===v[0]?' class="sel"':'')+'>'+esc(v[1])+'</button>'}).join('')+'</div>'};

// ---- pannello catalogo nell'editor programma: cerca per gruppo, clic = aggiunge alla seduta aperta
function coPannelloCatalogo(){var p=$('catPan');
  if(!p){p=document.createElement('aside');p.className='cat-pan';p.id='catPan';p.setAttribute('aria-label','Catalogo esercizi');document.body.appendChild(p)}
  p.innerHTML='<header><div class="r"><h3>Catalogo esercizi</h3><button class="co-btn ico" id="catChiudi" title="Chiudi">✕</button></div><div class="co-riga"><input class="co-in" id="catPQ" placeholder="Cerca" value="'+esc(CAT.pq)+'"><select class="co-sel" id="catPG" style="width:150px"></select></div>'+
    '<div class="co-riga" style="margin-top:8px;justify-content:space-between"><small style="color:var(--muted)" id="catPInfo"></small><button class="co-btn mini" id="catPNuovo">+ Nuovo esercizio</button></div></header><div class="l" id="catPL"><div class="co-load" style="margin:16px"></div></div>';

function catLista(){var d=CAT.d,el=$('catPL');if(!d||!el)return;var P=CO.prog,s=P&&P.sedute[CO.sed],vis=catFiltra(d.esercizi,CAT.pq,CAT.pg,'tutti'),h='';
  $('catPInfo').textContent=s?'Clic per aggiungere alla seduta '+s.lettera:'';

    gr[1].forEach(function(e){h+='<button class="cat-e" data-pn="'+esc(e.nome)+'"><span class="tx"><b>'+esc(e.nome)+(e.confermato?'':'<span class="cat-dc">da confermare</span>')+'</b><small>'+esc(catCar(e)||'Caratteristiche da indicare')+'</small></span><span class="piu">+</span></button>'})});
  el.innerHTML=h||'<div class="co-vuoto" style="padding:20px">Nessun esercizio. Puoi aggiungerlo con "Nuovo esercizio".</div>';
  tutti('#catPL [data-pn]').forEach(function(b){b.onclick=function(){catAggiungi(b.dataset.pn)}})}
function catAggiungi(nome){var P=CO.prog;if(!P||CO.vista!=='cliente'||CO.tab!=='prog'){toast('Apri il programma di un cliente per aggiungere esercizi');return}
  var s=P.sedute[CO.sed];
  // riempie la prima riga vuota, altrimenti ne aggiunge una
  var vuota=s.esercizi.filter(function(e){return!(e.nome||'').trim()})[0];
  if(vuota)vuota.nome=nome;else{if(s.esercizi.length>=P.SLOT){toast('Massimo '+P.SLOT+' esercizi per seduta');return}
    s.esercizi.push({k:0,n:'',nome:nome,serie:'',rip:'',rec:'',rir:'',tut:'',tecnica:'',note:'',sett:{}})}
  coSporco(true);var y=window.scrollY;rProg();window.scrollTo(0,y);toast(nome+' aggiunto alla seduta '+s.lettera)}

// ---------- area coach: grafici dell'editor programma, aggiornati mentre scrivi (aggiunta da tools/porta-pagina.py)
// I calcoli sono in app/src/coach/statistiche.js (window.MSC_STAT), con le regole dello stimolo decise da Matti il 24/11.
var EG={w:1,m:'serie'};
var EG_ST=[['neurale','Neurale','var(--st-neu)'],['meccanico','Meccanico','var(--st-mec)'],['metabolico','Metabolico','var(--st-met)']];
// colore delle linee per seduta nei grafici (netti, non i pastello del calendario)
function egColSt(z){var x=EG_ST.filter(function(q){return q[0]===z})[0];return x?x[2]:'inherit'}
function egEtSt(t){if(!t)return'–';return t.split(' / ').map(function(z){return'<span style="color:'+egColSt(z)+';font-weight:600">'+esc(z)+'</span>'}).join(' / ')}
function egColSed(L){return'var(--s'+('ABCDEFG'.indexOf(L)+1)+')'}
function egN(v,dec){if(v==null||v==='')return'–';var x=dec?Math.round(v*10)/10:Math.round(v);return String(x).replace('.',',')}
function egPct(v,tot){return tot?Math.round(v/tot*100):0}
// barra a pila: parti = [[valore, colore, etichetta, classe]]
function egBarra(parti){var tot=parti.reduce(function(a,p){return a+p[0]},0);if(!tot)return'<div class="eg-bar"></div>';
  return'<div class="eg-bar" role="img" aria-label="'+esc(parti.filter(function(p){return p[0]}).map(function(p){return p[2]+' '+egPct(p[0],tot)+'%'}).join(', '))+'">'+
    parti.filter(function(p){return p[0]>0}).map(function(p){var q=egPct(p[0],tot);return'<i class="'+(p[3]||'')+(/pr-cam|tp-iso/.test(p[1])?' chiaro':'')+'" style="width:'+(p[0]/tot*100)+'%;'+(p[1]?'background:'+p[1]:'')+'" title="'+esc(p[2]+': '+q+'%')+'">'+(q>=9&&p[1]?q+'%':'')+'</i>'}).join('')+'</div>'}
function egLeg(parti,unita){var tot=parti.reduce(function(a,p){return a+p[0]},0);
  return'<div class="eg-leg">'+parti.filter(function(p){return p[0]>0||!p[3]}).map(function(p){return'<span><i class="'+(p[3]||'')+'" style="'+(p[1]?'background:'+p[1]:'')+'"></i>'+esc(p[2])+' <b>'+egPct(p[0],tot)+'%</b>'+(unita?' <span style="color:var(--muted)">('+egN(p[0],1)+' '+unita+')</span>':'')+'</span>'}).join('')+'</div>'}
function egCatalogo(){var P=CO.prog;return window.MSC_STAT.mappaCatalogo(P.catalogo||[])}

function coAggGrafici(){var P=CO.prog,el=$('coGraf');if(!P||!el||!window.MSC_STAT)return;var M=window.MSC_STAT,s=P.sedute[CO.sed];
  if(EG.w>P.W)EG.w=1;
  var v=M.valoriSeduta(s.esercizi,EG.w,egCatalogo()),h='';
  var wsel='<select class="co-sel" id="egW" aria-label="Settimana">';for(var w=1;w<=P.W;w++)wsel+='<option value="'+w+'"'+(w===EG.w?' selected':'')+'>Settimana '+w+'</option>';wsel+='</select>';
  h+='<div class="eg-h"><h4>Grafici della seduta '+esc(s.lettera)+(s.nome?' · '+esc(s.nome):'')+'</h4>'+wsel+'<small>Si aggiornano mentre scrivi. In settimana 2 e dopo contano i cambi della progressione.</small></div>';
  if(!v.esercizi){el.innerHTML=h+'<div class="eg-vuoto">I grafici compaiono quando scrivi gli esercizi della seduta.</div>';egEventi();coAggSettimane();return}
  h+='<div class="eg-num"><div><b>'+v.esercizi+'</b><span>Esercizi</span></div><div><b>'+v.serie+'</b><span>Serie</span></div>'+
    '<div><b>'+egN(v.ripetizioni)+'</b><span>Ripetizioni</span>'+(v.serieMax||v.serieTempo?'<em>'+[v.serieMax?'+ '+v.serieMax+' serie a MAX':'',v.serieTempo?'+ '+v.serieTempo+' a tempo':''].filter(Boolean).join(', ')+'</em>':'<em>intervalli: valore medio</em>')+'</div>'+
    '<div><b>'+egN(v.rirMedio,1)+'</b><span>RIR medio</span><em>pesato sulle serie</em></div><div><b>≈ '+Math.round(v.tempo/60)+'′</b><span>Tempo stimato</span></div></div>';
  // stimolo
  var st=v.stimolo,pv=M.prevalenza(st),parti=EG_ST.map(function(z){return[st[z[0]],z[2],z[1]]});if(st.senza)parti.push([st.senza,'','Senza stimolo (a tempo o senza ripetizioni)','nc']);
  h+='<div class="eg-g"><section class="eg-p largo"><h5>Stimolo<span>% delle serie</span></h5>'+(pv?'<p class="eg-prev">Prevalenza <b style="color:'+egColSt(pv.z)+'">'+esc(pv.z)+' '+pv.pct+'%</b></p>':'')+egBarra(parti)+egLeg(parti,'serie');
  h+='<table class="eg-es"><tbody>'+v.righe.map(function(r){return'<tr><td title="'+esc(r.nome)+'">'+esc(r.nome)+'</td><td style="white-space:nowrap;color:var(--muted)">'+(r.serie||'–')+' × '+esc(r.rip||'–')+'</td><td'+(r.aMano?' class="man"':'')+'>'+egEtSt(r.aMano||r.auto)+'</td><td style="text-align:right"><select class="co-sel" data-stim="'+r.j+'" aria-label="Stimolo di '+esc(r.nome)+'"><option value="">Dalle ripetizioni'+(r.auto?' ('+esc(r.auto)+')':'')+'</option>'+
    EG_ST.map(function(z){return'<option value="'+z[0]+'"'+(r.aMano===z[0]?' selected':'')+'>A mano: '+z[1].toLowerCase()+'</option>'}).join('')+'</select></td></tr>'}).join('')+'</tbody></table></section>';
  h+=egOmino(s);
  // caratteristiche dal catalogo (percentuale di esercizi)
  var pr=v.profilo,ar=v.articolazioni,tp=v.tipo,nc=['Non classificato','nc'];
  var pPr=[[pr.ascendente,'var(--pr-asc)','Ascendente'],[pr.discendente,'var(--pr-dis)','Discendente'],[pr['a campana'],'var(--pr-cam)','A campana'],[pr.nessuno,'var(--g0)','Non applicabile'],[pr.nc,'',nc[0],nc[1]]];
  var pAr=[[ar.mono,'var(--ar-mono)','Monoarticolari'],[ar.bi,'var(--ar-bi)','Biarticolari'],[ar.nc,'',nc[0],nc[1]]];
  var pTp=[[tp.multi,'var(--tp-multi)','Multiarticolari'],[tp.isolamento,'var(--tp-iso)','Isolamento'],[tp.nc,'',nc[0],nc[1]]];
  h+='<section class="eg-p largo"><h5>Profili di resistenza<span>% degli esercizi</span></h5>'+egBarra(pPr)+egLeg(pPr)+'</section>';
  h+='<section class="eg-p"><h5>Mono o biarticolari<span>muscolo bersaglio, % esercizi</span></h5>'+egBarra(pAr)+egLeg(pAr)+'</section>';
  h+='<section class="eg-p"><h5>Multiarticolari o isolamento<span>% esercizi</span></h5>'+egBarra(pTp)+egLeg(pTp)+'</section>';
  // da guardare
  var av='';v.avvisi.forEach(function(a){av+='<li><span class="eg-dot"></span><span class="t"><b>'+esc(a.nome)+'</b>: '+esc(a.testo)+'</span></li>'});
  v.nonClassificati.forEach(function(n){av+='<li><span class="eg-dot nc"></span><span class="t"><b>'+esc(n)+'</b> non è nel catalogo: resta fuori da profili, mono/bi e multi/isolamento</span><button class="co-btn mini" data-egadd="'+esc(n)+'">Aggiungi al catalogo</button></li>'});
  if(v.daConfermare)av+='<li><span class="eg-dot nc"></span><span class="t">'+(v.daConfermare===1?'1 esercizio ha':v.daConfermare+' esercizi hanno')+' le caratteristiche proposte da Eclipsis, non ancora confermate</span><button class="co-btn mini" id="egConf">Apri Esercizi</button></li>';
  h+='<section class="eg-p largo"><h5>Da guardare<span>il recupero non cambia lo stimolo, lo segnala solo</span></h5>'+(av?'<ul class="eg-av">'+av+'</ul>':'<div class="eg-vuoto">Niente da segnalare: recuperi coerenti con lo stimolo e tutti gli esercizi nel catalogo.</div>')+'</section></div>';
  el.innerHTML=h;egEventi();coAggSettimane()}
function egEventi(){var P=CO.prog,s=P.sedute[CO.sed];
  if($('egW'))$('egW').onchange=function(){EG.w=+this.value;coAggGrafici()};
  tutti('#coGraf [data-stim]').forEach(function(x){x.onchange=function(){var e=s.esercizi[+x.dataset.stim];if(!e)return;e.stim=x.value;coSporco(true);coAggGrafici()}});
  tutti('#coGraf [data-egadd]').forEach(function(b){b.onclick=function(){catModulo(null,b.dataset.egadd)}});
  if($('egConf'))$('egConf').onclick=function(){CAT.f='dac';CAT.g='';coVai('esercizi')}}

// ---- settimane: ogni seduta in ogni settimana, e il totale della settimana secondo il calendario
var EG_M=[['serie','Serie'],['ripetizioni','Ripetizioni'],['rir','RIR medio'],['tempo','Tempo (min)'],['stimolo','Stimolo']];
function egVal(v,m){if(!v||!v.esercizi&&m!=='tempo')return null;if(m==='rir')return v.rirMedio;if(m==='tempo')return v.tempo?Math.round(v.tempo/60):null;return v[m]}
function egStCella(st){var tot=st.neurale+st.meccanico+st.metabolico;if(!tot)return'<span style="color:var(--muted)">–</span>';var pv=window.MSC_STAT.prevalenza(st);
  return'<div class="egw-st">'+egBarra(EG_ST.map(function(z){return[st[z[0]],z[2],z[1]]}))+'<small>'+esc(pv.z.slice(0,4))+'. '+pv.pct+'%</small></div>'}
function coAggSettimane(){var P=CO.prog,el=$('coGrafW');if(!P||!el||!window.MSC_STAT)return;var M=window.MSC_STAT,r=M.settimane(P,egCatalogo()),m=EG.m;
  var sed=P.sedute.filter(function(s){return s.esercizi.some(function(e){return(e.nome||'').trim()})});
  var h='<h3>Settimane</h3><p class="sub">I valori programmati di ogni seduta in ogni settimana, con i cambi della progressione. Il totale conta le sedute messe nel calendario della settimana.</p>';
  h+='<div class="egw-m">'+EG_M.map(function(x){return'<button data-egm="'+x[0]+'"'+(m===x[0]?' class="sel"':'')+'>'+x[1]+'</button>'}).join('')+'</div>';
  if(!sed.length){el.innerHTML=h+'<div class="co-vuoto">Compare quando scrivi gli esercizi delle sedute.</div>';egEventiW();return}
  if(m!=='stimolo')h+=egGrafSett(r,m,sed);
  else h+='<div class="eg-leg" style="margin:0 0 10px">'+EG_ST.map(function(z){return'<span><i style="background:'+z[2]+'"></i>'+z[1]+'</span>'}).join('')+'</div>';
  h+='<div class="co-scroll"><table class="co-t egw-t"><thead><tr><th>Seduta</th>';for(var w=1;w<=r.W;w++)h+='<th class="num">Sett '+w+'</th>';h+='</tr></thead><tbody>';
  sed.forEach(function(s){h+='<tr><td class="sed"><i style="background:'+egColSed(s.lettera)+'"></i>'+esc(s.lettera)+(s.nome?' · '+esc(s.nome):'')+'</td>';var prima=null;
    r.perSeduta[s.lettera].forEach(function(v,i){if(m==='stimolo'){h+='<td>'+egStCella(v.stimolo)+'</td>';return}var x=egVal(v,m),ug=i&&x===prima;prima=x;h+='<td class="v'+(ug?' ug':'')+'">'+egN(x,m==='rir')+'</td>'});h+='</tr>'});
  h+='<tr class="tot"><td>Totale settimana</td>';r.totale.forEach(function(t){if(m==='stimolo'){h+='<td>'+egStCella(t.stimolo)+'</td>';return}
    var x=m==='rir'?t.rirMedio:m==='tempo'?(t.tempo?Math.round(t.tempo/60):null):t[m];h+='<td class="v">'+(t.sedute?egN(x,m==='rir'):'<span style="color:var(--muted)">–</span>')+'</td>'});

// ---------- area coach: attivita' dei clienti e programmi in scadenza in "Da guardare oggi" (aggiunta da tools/porta-pagina.py)
// Migliorie prese da Hevy (Matti, 25/11). Dati da co_oggi (attivita, fineProgramma), seduta da co_seduta, commento da co_commentaSeduta.
var AT_GG=['lun','mar','mer','gio','ven','sab','dom'];
function atGiorno(k){if(!k)return'';var p=k.split('-'),g=new Date(+p[0],+p[1]-1,+p[2]);return AT_GG[(g.getDay()+6)%7]+' '+p[2]+'/'+p[1]}
function atKg(v){return v==null?'':String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' kg'}
function atNum(v){return String(v).replace('.',',')}
// le due card nuove, prima delle altre
function coOggiAttivita(d){var h=coOggiErrori(d),a=d.attivita||[],f=d.fineProgramma||[];
  h+='<div class="co-card at-feed"><h3>Attività dei clienti'+(a.length?' <span class="co-pill" style="margin-left:6px">'+a.length+'</span>':'')+'</h3><p class="sub">Ultimi 7 giorni. Apri una seduta o un video per vederli e commentarli: il commento arriva al cliente in chat.</p>';
  if(!a.length)h+='<div class="co-vuoto" style="padding:14px 0">Nessuna attività negli ultimi 7 giorni.</div>';
  else h+='<div class="at-lista">'+a.map(function(x){
    if(x.tipo==='video')return'<div class="at-riga" data-atvid="'+esc(x.id)+'" data-atcod="'+esc(x.codice)+'"><div class="at-ic vid"></div><div class="at-t"><b><span class="at-cod">'+esc(x.codice)+'</span>'+(x.nome?' · '+esc(x.nome):'')+' · Video: '+esc(x.esercizio)+'</b>'+
      '<span>'+(x.sett?'Settimana '+x.sett:'Video di esecuzione')+(x.nota?' · “'+esc(x.nota.length>60?x.nota.slice(0,60)+'…':x.nota)+'”':'')+'</span></div>'+

// ---------- area coach: seduta registrata dal coach e statistiche per esercizio (aggiunta da tools/porta-pagina.py)
// Matti 25/11 (idee prese da Hevy, codice e grafica nostri). Dati da co_registra / co_salvaRegistrazione / co_statEsercizio.
function rgNum(v){return v==null||v===''?'':String(v).replace('.',',')}
function rgPrev(p){return[p.serie&&p.rip?p.serie+' × '+p.rip:p.serie||p.rip,p.rir?'RIR '+p.rir:'',p.pct?p.pct+'% 1RM':'',p.rec?'rec '+p.rec:''].filter(Boolean).join(' · ')}
function rgSerie(q){return(q.kg?rgNum(q.kg)+' × ':'')+q.rip}

// ---- registrare (o correggere) una seduta al posto del cliente
function coRegistraApri(cod,w,sid){coModal('<div class="co-load"></div>').querySelector('.box').classList.add('at-box','rg-box');
  coChiama('co_registra',[cod,w||'',sid||''],function(d){coRegistraMostra(d)},function(t){coChiudi();toast(t)})}
function rgRiga(e,i,q){var pv=e.prima&&e.prima.serie[i],ph=pv?{kg:pv.kg?rgNum(pv.kg):'',rip:pv.rip}:{kg:'',rip:String(e.previsto.rip||'').replace(/[^0-9-]/g,'').split('-').pop()};
  return'<div class="rg-s" data-n="'+(i+1)+'"><span class="rg-n">S'+(i+1)+'</span><input class="co-in rg-kg" inputmode="decimal" maxlength="7" placeholder="'+esc(ph.kg||'kg')+'" value="'+esc(q&&q.kg!=null?rgNum(q.kg):'')+'" aria-label="Kg serie '+(i+1)+'"><i>kg ×</i>'+
    '<input class="co-in rg-rip" inputmode="numeric" maxlength="3" placeholder="'+esc(ph.rip||'rip')+'" value="'+esc(q?q.rip:'')+'" aria-label="'+(e.previsto.iso?'Secondi':'Ripetizioni')+' serie '+(i+1)+'"><i>'+(e.previsto.iso?'sec':'rip')+'</i></div>'}
function coRegistraMostra(d){
  var opz=function(n,sel){var h='';for(var i=1;i<=n;i++)h+='<option value="'+i+'"'+(i===sel?' selected':'')+'>Settimana '+i+'</option>';return h};
  var h='<div class="rg-mod"><div class="at-mh"><div><div class="eyebrow">'+esc(d.codice)+(d.nome?' · '+esc(d.nome):'')+'</div><h3>'+(d.esiste?'Correggi la seduta':'Registra una seduta')+'</h3></div><button class="co-btn ico" onclick="coChiudi()" title="Chiudi">✕</button></div>';
  h+='<p class="rg-sub">La scrivi tu al posto del cliente: la ritrova nella sua app, con colori e record come le sue.</p>';
  h+='<div class="rg-scelta"><label><span class="lab">Settimana</span><select class="co-sel" id="rgW">'+opz(d.settimane,d.sett)+'</select></label>'+
    '<label><span class="lab">Seduta</span><select class="co-sel" id="rgSid">'+d.sedute.map(function(s){return'<option value="'+esc(s.id)+'"'+(s.id===d.sid?' selected':'')+'>Seduta '+esc(s.lettera)+(s.titolo?' · '+esc(s.titolo):'')+'</option>'}).join('')+'</select></label>'+
    '<label><span class="lab">Data</span><input type="date" class="co-in" id="rgData" max="'+esc(d.oggi)+'" value="'+esc(d.data)+'"></label></div>';
  if(d.esiste)h+='<div class="rg-gia">Questa seduta c\'è già'+(d.daCoach?' (l\'hai scritta tu)':' (scritta dal cliente)')+': stai correggendo i suoi dati. Una serie che svuoti sparisce.</div>';
  h+='<div class="rg-es">'+d.esercizi.map(function(e,j){
    return'<div class="rg-e" data-id="'+esc(e.id)+'"><div class="rg-et"><div><b>'+esc(e.nome)+'</b><small>'+esc(rgPrev(e.previsto))+'</small>'+
      (e.prima?'<small class="rg-pv">Sett. '+e.prima.w+': '+e.prima.serie.map(rgSerie).map(function(x){return esc(rgNum(x))}).join(' · ')+'</small>':'')+'</div>'+
      (e.prima?'<button class="co-btn rg-copia" data-j="'+j+'" title="Riempie le serie con quelle della volta prima">Come la volta prima</button>':'')+'</div>'+
      '<div class="rg-ss">'+e.serie.map(function(q,i){return rgRiga(e,i,q)}).join('')+'</div>'+
      '<div class="rg-piu"><button class="rg-add" data-j="'+j+'"'+(e.serie.length>=6?' hidden':'')+'>+ Serie</button>'+
      '<label class="rg-rir"><span>RIR</span><input class="co-in" inputmode="decimal" maxlength="4" value="'+esc(rgNum(e.rir))+'" placeholder="'+esc(e.previsto.rir||'-')+'"></label>'+
      '<input class="co-in rg-nota" maxlength="500" placeholder="Nota (la vede anche il cliente)" value="'+esc(e.nota)+'"></div></div>'}).join('')+'</div>';
  h+='<div class="az"><button class="co-btn" onclick="coChiudi()">Annulla</button><button class="co-btn pri" id="rgSalva">'+(d.esiste?'Salva le correzioni':'Salva la seduta')+'</button></div></div>';
  var m=coModal(h);m.querySelector('.box').classList.add('at-box','rg-box');
  var ricarica=function(){coRegistraApri(d.codice,$('rgW').value,$('rgSid').value)};
  $('rgW').onchange=function(){coRegistraApri(d.codice,this.value,'')};
  $('rgSid').onchange=ricarica;
  tutti('#coModal .rg-add').forEach(function(b){b.onclick=function(){var e=d.esercizi[+b.dataset.j],box=b.closest('.rg-e').querySelector('.rg-ss'),n=box.children.length;
    if(n>=6)return;box.insertAdjacentHTML('beforeend',rgRiga(e,n,null));if(n+1>=6)b.hidden=true;box.lastChild.querySelector('.rg-kg').focus()}});
  tutti('#coModal .rg-copia').forEach(function(b){b.onclick=function(){var e=d.esercizi[+b.dataset.j],el=b.closest('.rg-e'),box=el.querySelector('.rg-ss');
    e.prima.serie.forEach(function(q,i){if(!box.children[i])box.insertAdjacentHTML('beforeend',rgRiga(e,i,null));var r=box.children[i];
      r.querySelector('.rg-kg').value=q.kg?rgNum(q.kg):'';r.querySelector('.rg-rip').value=q.rip});
    if(box.children.length>=6)el.querySelector('.rg-add').hidden=true}});
  $('rgSalva').onclick=function(){var b=this,dati={w:+$('rgW').value,sid:$('rgSid').value,data:$('rgData').value,esercizi:tutti('#coModal .rg-e').map(function(el){
      return{id:el.dataset.id,serie:[].map.call(el.querySelectorAll('.rg-s'),function(r){return{kg:r.querySelector('.rg-kg').value,rip:r.querySelector('.rg-rip').value}}),
        rir:el.querySelector('.rg-rir input').value,nota:el.querySelector('.rg-nota').value}})};
    b.disabled=true;var tx=b.textContent;b.textContent='Salvo...';
    coChiama('co_salvaRegistrazione',[d.codice,dati],function(s){toast('Seduta salvata: il cliente la ritrova nella sua app');CO.pan=null;coSedutaMostra(s);
      if(CO.vista==='cliente'&&CO.cod===d.codice&&CO.tab==='pan')coPanoramica(d.codice)},
    function(t){b.disabled=false;b.textContent=tx;toast(t)})}}

// ---- statistiche di un esercizio con il massimale stimato (solo per il coach)
function coStatApri(cod,nome,indietro){coModal('<div class="co-load"></div>').querySelector('.box').classList.add('at-box');
  coChiama('co_statEsercizio',[cod,nome||''],function(d){coStatMostra(d,indietro)},function(t){coChiudi();toast(t)})}
function coStatMostra(d,indietro){var kg=d.unita==='kg',tile=function(l,v,s){return'<div><b>'+v+'</b><span>'+l+'</span>'+(s?'<small>'+s+'</small>':'')+'</div>'};
  var h='<div class="st-mod">'+(indietro?'<button class="co-indietro vd-ind" id="stInd">‹ '+esc(indietro[0])+'</button>':'')+
    '<div class="at-mh"><div><div class="eyebrow">'+esc(d.codice)+(d.nomeCliente?' · '+esc(d.nomeCliente):'')+' · Statistiche</div>'+
    '<select class="co-sel st-sel" id="stNome" aria-label="Esercizio">'+d.esercizi.map(function(n){return'<option'+(n===d.nome?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></div>'+
    '<button class="co-btn ico" onclick="coChiudi()" title="Chiudi">✕</button></div>';
  if(!d.sedute.length){h+='<div class="co-vuoto" style="padding:26px 0">Ancora nessuna serie registrata per questo esercizio.</div></div>'}
  else{
    h+='<div class="at-num st-num">'+(kg?
      tile('Massimale stimato',d.massimale?rgNum(d.massimale.v)+' kg':'–',d.massimale?'da '+rgNum(d.massimale.kg)+' × '+d.massimale.rip+' · '+coD(d.massimale.data):'servono serie fino a 12 rip')+
      tile('Carico migliore',rgNum(d.kgMax.kg)+' kg',d.kgMax.rip+' rip · '+coD(d.kgMax.data))+
      tile('Volume migliore',atKg(d.volumeMax.v),'in una seduta · '+coD(d.volumeMax.data)):
      tile('Ripetizioni migliori',d.ripMax.rip+' rip','in una serie · '+coD(d.ripMax.data))+tile('Sedute',d.sedute.length,'con questo esercizio')+tile('Ultima volta',coD(d.sedute[d.sedute.length-1].data),'settimana '+d.sedute[d.sedute.length-1].w))+'</div>';
    var pt=d.sedute.filter(function(s){return kg?s.stima:true}).map(function(s){return{e:'S'+s.w,v:kg?s.stima.v:s.migliore.rip,r:s.record}});
    h+='<div class="st-graf"><div class="sc-riga"><span>'+(kg?'Massimale stimato per seduta':'Ripetizioni migliori per seduta')+'</span><b>'+(pt.length?rgNum(pt[pt.length-1].v)+' '+(kg?'kg':'rip'):'')+'</b></div>'+
      (pt.length>1?scLinea(pt,kg?'kg':'rip',130,640):'<div class="sc-mut" style="padding:10px 0">Il grafico parte dalla seconda seduta.</div>')+'</div>';
    if(kg&&d.perRip.length)h+='<div class="st-sez"><div class="lab">Carico migliore per ripetizioni</div><div class="st-pr">'+d.perRip.map(function(x){
      return'<div><b>'+x.rip+' rip</b><span>'+rgNum(x.kg)+' kg</span>'+(x.stima?'<small>≈ '+rgNum(x.stima)+' kg</small>':'')+'</div>'}).join('')+'</div></div>';
    h+='<div class="st-sez"><div class="lab">Sedute</div><div class="at-scroll"><table class="at-tab st-tab"><thead><tr><th>Data</th><th>Serie</th>'+(kg?'<th>Volume</th><th>Stima</th>':'<th>Rip totali</th>')+'</tr></thead><tbody>'+
      d.sedute.slice().reverse().map(function(s){return'<tr><td class="st-d">'+esc(coD(s.data))+'<small>Sett. '+s.w+'</small></td><td>'+s.serie.map(function(q){return'<span class="at-s">'+esc(rgSerie(q).replace('.',','))+'</span>'}).join('')+'</td>'+
        (kg?'<td class="at-rr">'+atKg(s.volume)+'</td><td class="at-rr">'+(s.stima?rgNum(s.stima.v)+' kg':'–')+(s.record?' <span class="co-pill at-rec">Record</span>':'')+'</td>':'<td class="at-rr">'+s.rip+(s.record?' <span class="co-pill at-rec">Record</span>':'')+'</td>')+'</tr>'}).join('')+'</tbody></table></div></div>';
    h+='<p class="at-leg">'+(kg?'Stima dalla serie migliore fino a 12 ripetizioni (media delle formule di Epley e Brzycki): è un\'indicazione, non un massimale testato. La vedi solo tu.':'Esercizio senza carico: conto le ripetizioni. La vedi solo tu.')+'</p></div>'}
  var m=coModal(h);m.querySelector('.box').classList.add('at-box');
  $('stNome').onchange=function(){coStatApri(d.codice,this.value,indietro)};
  if(indietro)$('stInd').onclick=indietro[1]}

// ---------- dati personali e account (passo 2 delle app native, 25/11). Aggiunta da tools/porta-pagina.py
// Consensi al primo accesso, Profilo > Privacy e consensi / Scarica i miei dati / Elimina account, accesso > Password dimenticata.
// Calcoli in app/src/logica/consensi.js, server: funzione "account" e export_my_data.
var AC={stato:null};
// foglio in basso nello stile della pagina; si chiude con la X, toccando fuori o con il tasto indietro (nativo.js)
function acFoglio(html,fisso){acChiudi();var o=document.createElement('div');o.className='riep on ac-fg'+(fisso?' ac-fisso':'');o.id='acFg';
  o.innerHTML='<div class="sh">'+(fisso?'':'<button class="ac-x" aria-label="Chiudi">✕</button>')+html+'</div>';document.body.appendChild(o);
  if(!fisso){o.querySelector('.ac-x').onclick=acChiudi;o.onclick=function(ev){if(ev.target===o)acChiudi()}}return o}
function acChiudi(){var o=$('acFg');if(o)o.remove()}
function acErr(id,t){var e=$(id);if(e)e.textContent=t||''}

// ---- consensi: dopo l'accesso, se mancano (o sono cambiati i testi) si chiedono prima di tutto
function acControlla(){chiama('consensi',[CRED],function(d){AC.stato=d;if(d.daChiedere)acConsensi(d)},function(){})}
function acVoce(v,mod){return'<label class="ac-v"><input type="checkbox" data-ac="'+v.kind+'"'+(v.dato&&v.aggiornato?' checked':'')+(mod&&v.obbligatorio?' checked disabled':'')+'><span><b>'+esc(v.titolo)+(v.obbligatorio&&!mod?' <i>obbligatorio</i>':'')+'</b>'+esc(v.testo)+'</span></label>'}
function acConsensi(d){
  var h='<div class="eyebrow">Prima di iniziare</div><h1>La tua privacy</h1>'+
    '<p class="ac-p">I tuoi dati li vedete solo tu e il tuo coach. Leggi l\'<a href="'+esc(d.privacyUrl)+'" target="_blank" rel="noopener">informativa privacy</a> e scegli.</p>'+
    d.voci.map(function(v){return acVoce(v,false)}).join('')+
    '<div class="lerr" id="acE"></div><button class="entra" id="acOk">Accetta e continua</button><button class="ac-link" id="acNo">Non accetto</button>';
  acFoglio(h,true);
  $('acOk').onclick=function(){var s={},b=this;tutti('#acFg [data-ac]').forEach(function(i){s[i.dataset.ac]=i.checked});
    if(!s.privacy||!s.health){acErr('acE','Per usare il sito servono i due consensi obbligatori.');return}
    b.disabled=true;b.textContent='Salvo...';
    chiama('salvaConsensi',[CRED,s],function(x){AC.stato=x;acChiudi();toast('Grazie, tutto salvato')},function(t){b.disabled=false;b.textContent='Accetta e continua';acErr('acE',t)})};
  $('acNo').onclick=function(){acFoglio('<div class="eyebrow">Consensi</div><h1>Senza consensi l\'app non funziona</h1><p class="ac-p">Per salvare i tuoi allenamenti e farli vedere al coach servono i consensi obbligatori. Se hai dubbi, parlane con il tuo coach. Puoi tornare quando vuoi.</p>'+
    '<button class="entra" id="acTorna">Torna ai consensi</button><button class="ac-link" id="acEsci">Esci dall\'app</button>',true);
    $('acTorna').onclick=function(){acConsensi(d)};$('acEsci').onclick=function(){acChiudi();esci('')}}}

// ---- Profilo > Privacy e consensi: si vede cosa si e' accettato e quando; si cambia solo il consenso alle foto
function acPrivacy(){var o=acFoglio('<div class="eyebrow">Profilo</div><h1>Privacy e consensi</h1><div class="sk" style="height:180px"></div>');
  chiama('consensi',[CRED],function(d){AC.stato=d;if(!$('acFg'))return;
    var dq=function(v){return v.quando?' <small>dal '+esc(String(v.quando).slice(8,10)+'/'+String(v.quando).slice(5,7)+'/'+String(v.quando).slice(0,4))+'</small>':''};
    o.querySelector('.sh').innerHTML='<button class="ac-x" aria-label="Chiudi">✕</button><div class="eyebrow">Profilo</div><h1>Privacy e consensi</h1>'+
      '<p class="ac-p"><a href="'+esc(d.privacyUrl)+'" target="_blank" rel="noopener">Leggi l\'informativa privacy</a></p>'+
      d.voci.map(function(v){return'<div class="ac-r"><div><b>'+esc(v.titolo.replace(' (facoltativo)',''))+'</b>'+dq(v)+'</div>'+
        (v.obbligatorio?'<span class="ac-si">'+(v.dato?'Dato':'No')+'</span>':'<button class="ac-sw'+(v.dato?' on':'')+'" data-acf="'+esc(v.kind)+'" role="switch" aria-checked="'+v.dato+'"><i></i></button>')+'</div>'}).join('')+
      '<p class="ac-p ac-pic">Per ritirare i consensi obbligatori elimina l\'account (in fondo al Profilo): con l\'account si cancellano tutti i tuoi dati.</p><div class="lerr" id="acE"></div>';
    o.querySelector('.ac-x').onclick=acChiudi;
    var msg={photos:['Foto dei progressi attive','Foto dei progressi spente'],ai:['Valutazione con AI permessa','Valutazione con AI spenta: il coach scrive a mano']};
    tutti('#acFg [data-acf]').forEach(function(b){b.onclick=function(){var k=b.dataset.acf,si=!b.classList.contains('on');b.disabled=true;
      chiama('consensoFacoltativo',[CRED,k,si],function(x){AC.stato=x;b.disabled=false;b.classList.toggle('on',si);b.setAttribute('aria-checked',si);toast((msg[k]||['Consenso dato','Consenso tolto'])[si?0:1])},function(t){b.disabled=false;acErr('acE',t)})}})},
    function(t){if($('acFg'))o.querySelector('.sh').innerHTML='<button class="ac-x" onclick="acChiudi()">✕</button><div class="vuoto">'+esc(t)+'</div>'})}

// ---- Profilo > Scarica i miei dati: un file con tutto quello che l'app sa di te (formato JSON, si apre con qualsiasi editor)
function acScarica(b){if(b){b.disabled=true;b.dataset.t=b.textContent;b.textContent='Preparo il file...'}
  var fine=function(){if(b){b.disabled=false;b.textContent=b.dataset.t}};
  chiama('esportaDati',[CRED],function(d){fine();var blob=new Blob([d.testo],{type:'application/json'});
    if(window.MSC_NATIVO&&MSC_NATIVO.salvaFile){MSC_NATIVO.salvaFile(blob,d.nome,'I miei dati MS Coaching').catch(function(){toast('File non salvato')});return}
    var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=d.nome;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('File scaricato')},
    function(t){fine();toast(t)})}

// ---- Profilo > Elimina account: password di nuovo, poi via tutto (account, dati, foto, chat, video, appuntamenti)
function acElimina(){
  acFoglio('<div class="eyebrow">Profilo</div><h1>Elimina account</h1>'+
    '<p class="ac-p">Cancelli per sempre il tuo account e tutti i tuoi dati: allenamenti, misure, foto, chat, video e appuntamenti. Non si può annullare.</p>'+

    '<div class="lerr" id="acE"></div><button class="entra ac-rosso" id="acVia">Elimina per sempre</button><button class="ac-link" id="acAnn">Annulla</button>');

      function(t){b.disabled=false;b.textContent='Elimina per sempre';acErr('acE',t)})}}

function mcMetriche(e){var u=e.u||{a:'kg',b:'rip',rec:true};if(u.rec)return[['kg','Carico migliore'],['vol','Volume'],['mig','Serie migliore']];

function mcGrafico(e){var ms=mcMetriche(e);if(!ms.some(function(x){return x[0]===MC.met}))MC.met=ms[0][0];var m=MC.met,pts=mcPunti(e,m),u=e.u||{b:'rip'};

  if(!pts.length)return h+'<div class="vuoto" style="padding:18px">Ancora nessun dato per questo grafico.</div></div>';
  var W_=300,H_=120,pl=14,pr=14,pt=18,pb=18,vs=pts.map(function(x){return x.v}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);if(mx===mn){mx+=1;mn-=1}

  var d=pts.map(function(x,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.v).toFixed(1)}).join(' '),len=0;for(var i=1;i<pts.length;i++)len+=Math.hypot(X(i)-X(i-1),Y(pts[i].v)-Y(pts[i-1].v));

  var s='<svg viewBox="0 0 '+W_+' '+H_+'"><defs><linearGradient id="gmc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--amethyst);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--amethyst);stop-opacity:0"/></linearGradient></defs>';
  if(area)s+='<path class="area" d="'+area+'" style="fill:url(#gmc)"/>';s+='<path class="lin" d="'+d+'" style="--len:'+Math.ceil(len+1)+'"/>';

  var ult=pts[pts.length-1],best=pts.reduce(function(a,b){return b.v>a.v?b:a});

// valore di una settimana: l'ultimo cambio fino a quella settimana, altrimenti la base (come nell'editor e nell'app del cliente)
function pdfVal(e,w,c){for(var x=w;x>=2;x--){var o=e.sett&&e.sett[x];if(o&&o[c]!==''&&o[c]!=null)return String(o[c])}return e[c]==null?'':String(e[c])}
function pdfCambia(e,w,c){return w>1&&pdfVal(e,w,c)!==pdfVal(e,w-1,c)}
function pdfIso(r){return/(^|\s)\d+\s*(["″']|s\b|sec)/i.test(String(r||''))}
function pdfRip(r){r=String(r||'');return/^max$/i.test(r)?'MAX':r}
function pdfData(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function pdfD(d){return d?d.getDate()+' '+PDF_MESI[d.getMonth()]+' '+d.getFullYear():''}
function pdfEsc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  var ini=pdfData(P.inizio),fine=ini?new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+P.W*7-1):null;
  return{cod:cod,nome:nome||'',W:P.W,inizio:ini,fine:fine,obiettivo:P.obiettivo||'',frequenza:P.frequenza||'',nota:P.progressione||'',
    settimane:P.settimane.slice(0,P.W).map(function(s){return{fase:s.fase||'',giorni:(s.giorni||[]).map(function(g){return g==='Riposo'?'':g||''})}}),sedute:sedute}}

function pdfPills(e,w){var r=pdfRip(pdfVal(e,w,'rip')),rir=pdfVal(e,w,'rir'),pct=e.p1rm?pdfVal(e,w,'pct'):'';
  return'<div class="pdf-pills"><span>'+pdfEsc((pdfVal(e,w,'serie')||'–')+' × '+(r||'–')+(pdfIso(r)?' tenuta':''))+'</span>'+(rir!==''?'<span>RIR '+pdfEsc(rir)+'</span>':'')+(e.rec?'<span>Rec '+pdfEsc(e.rec)+'</span>':'')+
    (pct?'<span>'+pdfEsc(pct)+'% 1RM</span>':'')+(e.tut?'<span>TUT '+pdfEsc(e.tut)+'</span>':'')+(e.tecnica?'<span class="t">'+pdfEsc(e.tecnica)+'</span>':'')+'</div>'}
function pdfNota(e){return e.note&&String(e.note).trim()?'<div class="pdf-nota"><b>Nota del coach</b> · '+pdfEsc(String(e.note).trim())+'</div>':''}

// contenuto a blocchi: {html} oppure {tab,cls,testa,riga} (righe di tabella) oppure {nuova:true} per iniziare una pagina
function pdfBlocchi(D){
  var b=[],per=pdfD(D.inizio)+(D.fine?' – '+pdfD(D.fine):'');
  var colDi=function(l){var s=D.sedute.filter(function(x){return x.l===l})[0];return s?s.col:'#eee'};
  var titolo=D.nome||D.cod;
  b.push({nuova:true,primo:true});
  b.push({html:'<div class="pdf-eroe"><div class="ey pdf-m"><i></i>Il tuo programma · '+pdfEsc(D.cod)+'</div><h1>'+pdfEsc(titolo)+'</h1><div class="sot"><b>'+D.W+' settimane</b>'+(per?' · '+pdfEsc(per):'')+'</div>'+
    ((D.obiettivo||D.frequenza)?'<div class="chips">'+(D.obiettivo?'<span>Obiettivo: '+pdfEsc(D.obiettivo)+'</span>':'')+(D.frequenza?'<span>'+pdfEsc(D.frequenza)+'</span>':'')+'</div>':'')+'</div>'});
  b.push({html:'<div class="pdf-lab pdf-m">Calendario</div>',conProssimo:true});
  var th='<thead><tr><th>Sett.</th><th>Fase</th>'+PDF_GG.map(function(g){return'<th>'+g+'</th>'}).join('')+'</tr></thead>';
  D.settimane.forEach(function(s,i){b.push({tab:'cal',cls:'pdf-cal',testa:th,riga:'<tr><td>'+(i+1)+'</td><td class="fa">'+pdfEsc(s.fase)+'</td>'+
    s.giorni.slice(0,7).map(function(l){return'<td>'+(l?'<span class="pdf-lt" style="background:'+colDi(l)+'">'+pdfEsc(l)+'</span>':'<span class="rp">·</span>')+'</td>'}).join('')+'</tr>'})});
  b.push({html:'<div class="pdf-lab pdf-m">Le sedute</div><div class="pdf-sed">'+D.sedute.map(function(s){return'<div class="pdf-card"><span class="pdf-lt" style="background:'+s.col+'">'+s.l+'</span><div><b>'+pdfEsc(s.nome||('Seduta '+s.l))+'</b><span class="n">'+s.es.length+(s.es.length===1?' esercizio':' esercizi')+'</span></div></div>'}).join('')+'</div>'});
  if(D.nota.trim())b.push({html:'<div class="pdf-lab pdf-m">Progressione</div><div class="pdf-card"><p class="pdf-nt">'+pdfEsc(D.nota.trim())+'</p></div>'});
  b.push({html:'<div class="pdf-come"><b>Come leggere la scheda</b><br>Serie × ripetizioni · <b>RIR</b> = ripetizioni che restano "in tasca" a fine serie · <b>Rec</b> = recupero tra le serie · <b>TUT</b> = tempo di ogni ripetizione · <b>% 1RM</b> = carico sul tuo massimale · <b>40" tenuta</b> = isometria, tieni la posizione per quei secondi. In fondo trovi una pagina per ogni settimana con le caselle per scrivere kg e ripetizioni.</div>'});
  D.sedute.forEach(function(s){
    b.push({nuova:true});
    b.push({html:'<div class="pdf-eroe"><div class="ey pdf-m"><i style="background:'+s.col+'"></i>Seduta '+s.l+' · '+s.es.length+(s.es.length===1?' esercizio':' esercizi')+'</div><h1>'+pdfEsc(s.nome||('Seduta '+s.l))+'</h1>'+(s.nota?'<div class="nota">'+pdfEsc(s.nota)+'</div>':'')+'</div>'});
    b.push({html:'<div class="pdf-lab pdf-m">Esercizi · valori della settimana 1</div>',conProssimo:true});
    s.es.forEach(function(e,i){b.push({html:'<div class="pdf-card pdf-es"><div class="num">'+(i<9?'0':'')+(i+1)+'</div><div class="tx"><div class="nm">'+pdfEsc(e.nome)+'</div>'+pdfPills(e,1)+pdfNota(e)+'</div></div>'})});
    if(D.W>1){
      // a gruppi di 8 settimane, cosi' la tabella sta nella pagina in verticale
      for(var a=1;a<=D.W;a+=8){var z=Math.min(D.W,a+7),ws=[];for(var w=a;w<=z;w++)ws.push(w);
        b.push({html:'<div class="pdf-lab pdf-m">Settimana per settimana'+(D.W>8?' · '+a+'-'+z:'')+'</div>',conProssimo:true});
        var tp='<thead><tr><th>Esercizio</th>'+ws.map(function(w){return'<th>S'+w+'</th>'}).join('')+'</tr></thead>';
        s.es.forEach(function(e){b.push({tab:'pr'+s.l+a,cls:'pdf-pr',testa:tp,riga:'<tr><td>'+pdfEsc(e.nome)+'</td>'+ws.map(function(w){
          var ch=['serie','rip','rir','pct'].some(function(k){return(k!=='pct'||e.p1rm)&&pdfCambia(e,w,k)}),rir=pdfVal(e,w,'rir'),pct=e.p1rm?pdfVal(e,w,'pct'):'';
          return'<td'+(ch?' class="ch"':'')+'><b>'+pdfEsc(pdfVal(e,w,'serie')+'×'+pdfRip(pdfVal(e,w,'rip')))+'</b>'+(rir!==''?'<i>RIR '+pdfEsc(rir)+'</i>':'')+(pct?'<i>'+pdfEsc(pct)+'%</i>':'')+'</td>'}).join('')+'</tr>'})});
        b.push({html:'<p class="pdf-leg2"><span class="pdf-sw"></span>cambia rispetto alla settimana prima</p>'});
      }
    }
  });
  // pagine settimana per settimana, da compilare in palestra (valori gia' giusti per quella settimana)
  D.settimane.forEach(function(st,wi){var w=wi+1,giorni=[];st.giorni.slice(0,7).forEach(function(l,g){var s=D.sedute.filter(function(x){return x.l===l})[0];if(s)giorni.push([g,s])});
    if(!giorni.length)return;
    b.push({nuova:true});
    b.push({html:'<div class="pdf-eroe mini"><div class="ey pdf-m"><i></i>Settimana '+w+' di '+D.W+(st.fase?' · '+pdfEsc(st.fase):'')+'</div><h1>Settimana '+w+'</h1><div class="sot">'+giorni.map(function(x){return PDF_GG[x[0]]+' '+x[1].l}).join(' · ')+'</div></div>'});
    giorni.forEach(function(x){var s=x[1];
      b.push({html:'<div class="pdf-sdh pdf-m"><span class="pdf-lt" style="background:'+s.col+'">'+s.l+'</span>'+PDF_GG[x[0]]+' · <b>'+pdfEsc(s.nome||('Seduta '+s.l))+'</b></div>',conProssimo:true});
      s.es.forEach(function(e,i){var n=Math.max(1,Math.min(6,parseInt(pdfVal(e,w,'serie'),10)||3)),iso=pdfIso(pdfVal(e,w,'rip'));
        b.push({html:'<div class="pdf-card pdf-wx"><div class="tx"><div class="nm">'+(i+1)+'. '+pdfEsc(e.nome)+'</div>'+pdfPills(e,w)+pdfNota(e)+'</div><div class="pdf-box">'+
          Array.apply(null,{length:n}).map(function(_,k){return'<div><small>S'+(k+1)+'</small>'+(iso?'<i>sec</i>':'<i>kg</i><i>rip</i>')+'</div>'}).join('')+'</div></div>'})})});
  });
  return{blocchi:b,per:per};
}

function pdfTesta(D,per,primo){return'<div class="pdf-hd'+(primo?'':' pic')+'"><img src="'+PDF_LOGO+'" alt="MS Coaching"><div class="r pdf-m">'+(primo?'Programma di allenamento':pdfEsc(D.cod))+(primo?'':'<b>'+pdfEsc(D.nome||'Programma di allenamento')+'</b>')+'</div></div>'}

// impagina misurando davvero l'altezza: se un blocco non ci sta va nella pagina dopo; le tabelle ripetono l'intestazione
function pdfImpagina(box,D){var x=pdfBlocchi(D),pagine=[],pg=null,corpo=null,tab=null,tabK='';
  function nuova(primo){pg=document.createElement('div');pg.className='pdf-pg';pg.innerHTML=pdfTesta(D,x.per,primo)+'<div class="pdf-corpo"></div><div class="pdf-pie pdf-m"><span>MS Coaching · Mattias Sula</span><span class="pn"></span></div>';
    box.appendChild(pg);pagine.push(pg);corpo=pg.querySelector('.pdf-corpo');tab=null;tabK=''}
  // altezza occupata davvero (scrollHeight non basta: con overflow nascosto non scende mai sotto l'altezza della pagina)
  function usato(){var u=corpo.lastElementChild;if(!u)return 0;var mb=parseFloat(getComputedStyle(u).marginBottom)||0;return u.getBoundingClientRect().bottom+mb-corpo.getBoundingClientRect().top}
  function pieno(){return usato()>corpo.clientHeight+1}
  var bl=x.blocchi;
  for(var i=0;i<bl.length;i++){var k=bl[i];
    if(k.nuova){nuova(!!k.primo);continue}
    if(k.html){var d=document.createElement('div');d.innerHTML=k.html;var el=d.firstElementChild&&d.children.length===1?d.firstElementChild:d;corpo.appendChild(el);tab=null;tabK='';
      // un titolo non resta da solo in fondo alla pagina
      if(pieno()||(k.conProssimo&&usato()>corpo.clientHeight-110)){corpo.removeChild(el);nuova(false);corpo.appendChild(el)}continue}
    if(k.tab){if(!tab||tabK!==k.tab){tab=document.createElement('table');tab.className=k.cls;tab.innerHTML=k.testa+'<tbody></tbody>';corpo.appendChild(tab);tabK=k.tab}
      var tb=tab.tBodies[0];tb.insertAdjacentHTML('beforeend',k.riga);
      if(pieno()){tb.removeChild(tb.lastElementChild);if(!tb.rows.length)corpo.removeChild(tab);
        nuova(false);tab=document.createElement('table');tab.className=k.cls;tab.innerHTML=k.testa+'<tbody>'+k.riga+'</tbody>';corpo.appendChild(tab);tabK=k.tab}}}
  pagine.forEach(function(p,i){p.querySelector('.pn').textContent=D.cod+' · pagina '+(i+1)+' di '+pagine.length});
  return pagine}

function pdfCarica(src){return new Promise(function(ok,no){if(window.html2pdf)return ok();var s=document.createElement('script');s.src=src;s.onload=function(){ok()};s.onerror=function(){no(new Error('Non riesco a caricare il generatore di PDF. Controlla la connessione e riprova.'))};document.head.appendChild(s)})}
function pdfLogo(){if(PDF_LOGO)return Promise.resolve();return fetch(new URL('../coach/logo-pdf.png',location.href).href).then(function(r){if(!r.ok)throw new Error('logo');return r.blob()}).then(function(b){return new Promise(function(ok){var f=new FileReader();f.onload=function(){PDF_LOGO=f.result;ok()};f.readAsDataURL(b)})})}

// crea il file: una pagina A4 alla volta, cosi' nessuna riga viene tagliata a meta'
function pdfCrea(D){var box=document.createElement('div');box.className='pdf-contenitore';box.style.cssText='position:fixed;left:-10000px;top:0;width:210mm;z-index:-1';
  box.innerHTML='<style>'+PDF_CSS+'</style>';document.body.appendChild(box);
  var pagine=pdfImpagina(box,D);
  var opt={margin:0,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2.4,useCORS:true,backgroundColor:'#ffffff',logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true}};
  var w=window.html2pdf().set(opt).from(pagine[0]).toPdf();
  pagine.slice(1).forEach(function(p){w=w.get('pdf').then(function(pdf){pdf.addPage()}).from(p).toContainer().toCanvas().toPdf()});
  return w.outputPdf('blob').then(function(b){box.remove();return b},function(e){box.remove();throw e})}

function pdfConsegna(blob,nome){var f=null;try{f=new File([blob],nome,{type:'application/pdf'})}catch(e){}
  var tocco=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  // telefono: foglio di condivisione (Salva su File, WhatsApp, Stampa); computer: scarica il file
  if(tocco&&f&&navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:nome}).catch(function(e){if(e&&e.name==='AbortError')return;pdfScarica(blob,nome)});
  pdfScarica(blob,nome);return Promise.resolve()}
function pdfScarica(blob,nome){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000)}

function coEsportaPdf(){var P=CO.prog,b=$('coPdf');if(!P)return;var D=pdfDati(P,CO.cod||'',(CO.cli&&CO.cli.nome)||'');
  if(!D.sedute.length){toast('Il programma non ha ancora esercizi da mettere nel PDF.');return}
  if(b){b.disabled=true;b.textContent='Preparo il PDF...'}
  var fine=function(){if(b){b.disabled=false;b.textContent='Esporta PDF'}};
  Promise.all([pdfCarica(new URL('../check/vendor/html2pdf.bundle.min.js',location.href).href),pdfLogo()]).then(function(){return pdfCrea(D)}).then(function(blob){
    var nome='Programma_'+(D.cod||'cliente')+(P.inizio?'_'+P.inizio:'')+'.pdf';fine();
    if(CO.sporco)toast('Nel PDF ci sono anche le modifiche non ancora salvate');
    return pdfConsegna(blob,nome)}).catch(function(e){fine();toast(e&&e.message&&!/logo/.test(e.message)?e.message:'Non sono riuscito a creare il PDF. Riprova.')})}

// pulsante accanto a "Salva come modello", anche dal telefono
(function(){var o=window.rProg;if(typeof o!=='function')return;
  window.rProg=function(){var r=o.apply(this,arguments);var m=$('coSalvaMod');
    if(m&&!$('coPdf')){m.insertAdjacentHTML('afterend','<button class="co-btn" id="coPdf" title="Scarica il programma in PDF, da mandare al cliente o stampare">Esporta PDF</button>');$('coPdf').onclick=coEsportaPdf}
    return r}})();

  dove=Math.max(0,Math.min(dove,s.esercizi.length));s.esercizi.splice(dove,0,c);coSporco(true);rProg();

// ---------- Ripetizioni oppure Durata, esercizio per esercizio (Matti 27/11). Aggiunta da tools/porta-pagina.py
// Nella colonna Ripetizioni dell'editor una tendina sceglie "Rip" o "Durata". Con Durata scrivi i secondi (45) e nel programma
// resta 45": e' il formato che l'app del cliente gia' riconosce come isometria (secondi tenuti con il cronometro,
// fuori da volume, record e massimale). Vale anche per le celle della progressione per settimana di quell'esercizio.
var CO_DUR=typeof WeakMap!=='undefined'?new WeakMap():null;
function coTempoRip(r){r=String(r||'').toLowerCase().replace(/[’`]/g,"'").replace(/[”″]/g,'"').trim();
  return /^\d+(?:[.,]\d+)?\s*(?:"|''|s|sec|secondi)(?:\s*(?:per|x)\s*(?:gamba|braccio|lato))?$/.test(r)||/^\d+\s*(?:'|min)(?:\s*\d+\s*(?:"|''|s|sec))?$/.test(r)}
function coSecRip(r){r=String(r||'').replace(/[’`]/g,"'").replace(/[”″]/g,'"');if(!coTempoRip(r))return'';var m=/(\d+)\s*(?:'|min)/.exec(r),t=0;if(m){t=+m[1]*60;r=r.replace(m[0],'')}var x=/(\d+)/.exec(r);if(x)t+=+x[1];return t?String(t):''}
function coDurata(e){if(CO_DUR&&CO_DUR.has(e))return CO_DUR.get(e);if(coTempoRip(e.rip))return true;
  var s=e.sett||{};return Object.keys(s).some(function(w){return s[w]&&coTempoRip(s[w].rip)})}
// quello che scrivi nella casella Durata: 45 diventa 45"; 1'30" o 90" restano come sono
function coValDurata(v){v=String(v||'').trim();if(!v)return'';if(/^\d{1,4}$/.test(v))return v+'"';return v}
function coCambiaModo(j,dur){var P=CO.prog,s=P&&P.sedute[CO.sed],e=s&&s.esercizi[j];if(!e)return;if(CO_DUR)CO_DUR.set(e,dur);
  // le ripetizioni non diventano secondi (e viceversa): quello che non c'entra con il nuovo modo si svuota
  if(dur!==coTempoRip(e.rip))e.rip='';
  if(e.sett)Object.keys(e.sett).forEach(function(w){var o=e.sett[w];if(o&&o.rip&&dur!==coTempoRip(o.rip))o.rip=''});
  coSporco(true);rProg();var i=document.querySelector('#coTab table.co-es input[data-e="'+j+'"][data-c="rip"]:not([data-w])');if(i)i.focus();
  toast(dur?'Durata: scrivi i secondi, per esempio 45':'Ripetizioni: per esempio 8-12 o MAX')}
function coSegnaDurata(i,e){var w=i.dataset.w,v=w?((e.sett&&e.sett[w]&&e.sett[w].rip)||''):e.rip;
  i.dataset.dur='1';i.value=coSecRip(v)||(coTempoRip(v)?'':v);i.setAttribute('inputmode','numeric');
  if(w){var ph=coSecRip(coEff(e,+w,'rip'));i.placeholder=ph||'sec'}else i.placeholder='sec';
  i.title='Secondi di tenuta, per esempio 45'}
(function(){var o=window.rProg;if(typeof o!=='function')return;
  window.rProg=function(){var r=o.apply(this,arguments),P=CO.prog,t=document.querySelector('#coTab table.co-es');if(!P||!t)return r;var s=P.sedute[CO.sed];
    var th=tutti('#coTab table.co-es thead th').filter(function(x){return x.textContent==='Ripetizioni'})[0];if(th)th.textContent='Rip. o durata';
    tutti('#coTab table.co-es input[data-c="rip"]:not([data-w])').forEach(function(i){var j=+i.dataset.e,e=s.esercizi[j];if(!e)return;var dur=coDurata(e);
      var box=document.createElement('div');box.className='co-rip'+(dur?' dur':'');i.parentNode.insertBefore(box,i);
      box.innerHTML='<select class="co-sel co-modo" data-modo="'+j+'" aria-label="Ripetizioni o durata per '+esc(e.nome||'questo esercizio')+'"><option value="rip">Rip</option><option value="dur"'+(dur?' selected':'')+'>Durata</option></select>';
      box.appendChild(i);if(dur){coSegnaDurata(i,e);box.insertAdjacentHTML('beforeend','<span class="u">sec</span>')}});
    tutti('#coTab [data-modo]').forEach(function(x){x.onchange=function(ev){ev.stopPropagation();coCambiaModo(+x.dataset.modo,x.value==='dur')}});
    // progressione per settimana: le celle Rip di un esercizio a durata chiedono secondi
    tutti('#coTab input[data-c="rip"][data-w]').forEach(function(i){var e=s.esercizi[+i.dataset.e];if(e&&coDurata(e))coSegnaDurata(i,e)});
    return r};
  // dopo il salvataggio normale del campo (coInput), il numero scritto diventa 45"
  // in ascolto sul documento: l'evento arriva qui dopo coInput, che sta su #coMain
  document.addEventListener('input',function(ev){var i=ev.target,P=CO.prog;if(!P||!i.dataset||!i.dataset.dur||CO.tab!=='prog')return;var s=P.sedute[CO.sed],e=s&&s.esercizi[+i.dataset.e];if(!e)return;
    var v=coValDurata(i.value),w=i.dataset.w;if(w){e.sett=e.sett||{};var q=e.sett[w]||(e.sett[w]={serie:'',rip:'',rir:''});q.rip=v}else e.rip=v;
    if(typeof coAggTempo==='function')coAggTempo();
    if(typeof coAggProgr==='function'){coAggProgr(+i.dataset.e);tutti('#coMain input[data-e="'+i.dataset.e+'"][data-w][data-c="rip"]').forEach(function(x){if(x.dataset.dur){var ph=coSecRip(coEff(e,+x.dataset.w,'rip'));x.placeholder=ph||'sec'}})}})})();

// ---------- editor del programma piu' veloce (Matti 27/11). Aggiunta da tools/porta-pagina.py
// Annulla e Ripeti (30 passi), Duplica seduta, scorciatoie da tastiera.

// ---- Annulla / Ripeti: una foto del programma prima di ogni modifica. Mentre scrivi nella stessa casella le lettere
// contano come una sola modifica. Si riparte da zero quando apri un altro programma o salvi.
var CO_UNDO={P:null,ora:'',indietro:[],avanti:[],campo:null,quando:0,max:30,inCorso:false};
function coFoto(){var P=CO.prog;return JSON.stringify({W:P.W,inizio:P.inizio,obiettivo:P.obiettivo,frequenza:P.frequenza,progressione:P.progressione,settimane:P.settimane,sedute:P.sedute})}
function coUndoInizia(){var P=CO.prog;CO_UNDO.P=P;CO_UNDO.ora=P?coFoto():'';CO_UNDO.indietro=[];CO_UNDO.avanti=[];CO_UNDO.campo=null;coUndoBottoni()}
function coUndoSegna(){var U=CO_UNDO,P=CO.prog;if(U.inCorso||!P)return;if(U.P!==P){coUndoInizia();return}
  var f=coFoto();if(f===U.ora)return;
  var ev=window.event,t=ev&&ev.type==='input'?ev.target:null,ad=Date.now();
  // lettere nella stessa casella entro 2 secondi = un solo passo
  if(!(t&&t===U.campo&&ad-U.quando<2000)){U.indietro.push(U.ora);if(U.indietro.length>U.max)U.indietro.shift()}
  U.campo=t;U.quando=ad;U.ora=f;U.avanti=[];coUndoBottoni()}
function coUndoApplica(f){var P=CO.prog,d=JSON.parse(f);['W','inizio','obiettivo','frequenza','progressione','settimane','sedute'].forEach(function(k){P[k]=d[k]});
  CO.sed=Math.min(CO.sed,P.sedute.length-1);CO_UNDO.inCorso=true;coSporco(true);CO_UNDO.inCorso=false;CO_UNDO.ora=f;CO_UNDO.campo=null;rProg();coUndoBottoni()}
function coAnnullaPasso(){var U=CO_UNDO;if(!CO.prog||U.P!==CO.prog||!U.indietro.length){toast('Niente da annullare');return}U.avanti.push(U.ora);coUndoApplica(U.indietro.pop());toast('Modifica annullata')}
function coRipetiPasso(){var U=CO_UNDO;if(!CO.prog||U.P!==CO.prog||!U.avanti.length){toast('Niente da ripetere');return}U.indietro.push(U.ora);coUndoApplica(U.avanti.pop());toast('Modifica ripetuta')}
function coNelProg(){return CO.vista==='cliente'&&CO.tab==='prog'&&!!CO.prog}
function coUndoBottoni(){var u=$('coUndo'),r=$('coRedo');if(!u)return;var ok=coNelProg()&&CO_UNDO.P===CO.prog;
  u.style.display=r.style.display=ok?'':'none';u.disabled=!(ok&&CO_UNDO.indietro.length);r.disabled=!(ok&&CO_UNDO.avanti.length)}
(function(){var o=window.coSporco;if(typeof o!=='function')return;
  window.coSporco=function(v){var r=o.apply(this,arguments);if(v&&coNelProg())coUndoSegna();else if(!v&&CO_UNDO.P&&CO.prog===CO_UNDO.P)coUndoInizia();return r}})();
(function(){var b=$('coAnnB');if(!b)return;
  b.insertAdjacentHTML('beforebegin','<button class="co-btn ico co-und" id="coUndo" title="Annulla l\'ultima modifica (Ctrl+Z)" aria-label="Annulla l\'ultima modifica">↶</button><button class="co-btn ico co-und" id="coRedo" title="Ripeti (Ctrl+Shift+Z)" aria-label="Ripeti la modifica">↷</button>');
  $('coUndo').onclick=coAnnullaPasso;$('coRedo').onclick=coRipetiPasso})();

// ---- Duplica seduta: copia nome, nota ed esercizi (con la progressione) in un'altra seduta
function coDuplicaSeduta(){var P=CO.prog,s=P.sedute[CO.sed];if(!s.esercizi.some(function(e){return e.nome})){toast('Questa seduta non ha ancora esercizi da copiare');return}
  var op=P.sedute.map(function(q,i){if(i===CO.sed)return'';var n=q.esercizi.filter(function(e){return e.nome}).length;
    return'<option value="'+i+'">'+q.lettera+(q.nome?' · '+esc(q.nome):'')+(n?' ('+n+' esercizi, verranno sostituiti)':' (vuota)')+'</option>'}).join('');
  var vuota=P.sedute.findIndex(function(q,i){return i!==CO.sed&&!q.esercizi.some(function(e){return e.nome})});
  coModal('<h3>Duplica la seduta '+s.lettera+(s.nome?' · '+esc(s.nome):'')+'</h3><p>Copio nome, nota ed esercizi con la progressione per settimana. Poi la cambi come vuoi. Ricordati di metterla nei giorni delle Settimane.</p><span class="lab">Copia in</span><select class="co-sel" id="coDupIn">'+op+'</select><div class="az"><button class="co-btn" onclick="coChiudi()">Annulla</button><button class="co-btn pri" id="coDupOk">Duplica</button></div>');
  if(vuota>=0)$('coDupIn').value=String(vuota);
  $('coDupOk').onclick=function(){var i=+$('coDupIn').value,d=P.sedute[i];if(!d)return;
    var es=JSON.parse(JSON.stringify(s.esercizi.filter(function(e){return e.nome}))).slice(0,P.SLOT);es.forEach(function(e){e.k=0});
    d.nome=s.nome?s.nome+(d.nome===s.nome?'':' (copia)'):d.nome;d.nota=s.nota;d.esercizi=es;coChiudi();CO.sed=i;coSporco(true);rProg();toast('Seduta copiata in '+d.lettera+'. Annulla con Ctrl+Z')}}

// ---- tastiera: Invio = stessa casella della riga sotto, Ctrl+D = duplica la riga, Ctrl+Z / Ctrl+Shift+Z = annulla / ripeti,
// Ctrl+C / Ctrl+V fuori dalle caselle di testo = copia / incolla l'esercizio della riga scelta
var CO_RIGA=-1;
function coDuplicaRiga(j){var P=CO.prog,s=P.sedute[CO.sed],e=s.esercizi[j];if(!e)return;if(s.esercizi.length>=P.SLOT){toast('Seduta piena: massimo '+P.SLOT+' esercizi');return}
  var c=JSON.parse(JSON.stringify(e));c.k=0;s.esercizi.splice(j+1,0,c);coSporco(true);rProg();CO_RIGA=j+1;
  var i=document.querySelector('#coTab table.co-es input.nome[data-e="'+(j+1)+'"]');if(i){i.focus();i.select()}}
document.addEventListener('focusin',function(ev){var t=ev.target;if(t&&t.closest&&t.closest('#coTab table.co-es')&&t.dataset&&t.dataset.e!=null)CO_RIGA=+t.dataset.e});
document.addEventListener('keydown',function(ev){if(!document.body.classList.contains('coach')||!coNelProg()||$('coModal').classList.contains('on'))return;
  var t=ev.target,mod=ev.metaKey||ev.ctrlKey,k=(ev.key||'').toLowerCase(),testo=t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(checkbox|radio|button)$/.test(t.type)));
  if(mod&&k==='z'){ev.preventDefault();if(ev.shiftKey)coRipetiPasso();else coAnnullaPasso();return}
  if(mod&&k==='y'){ev.preventDefault();coRipetiPasso();return}
  var inTab=t&&t.closest&&t.closest('#coTab table.co-es');
  if(mod&&k==='d'&&inTab&&t.dataset.e!=null){ev.preventDefault();coDuplicaRiga(+t.dataset.e);return}
  if(ev.key==='Enter'&&!mod&&inTab&&t.tagName==='INPUT'&&t.dataset.e!=null&&!t.dataset.w){
    // stessa colonna, riga sotto (ultima riga: nuovo esercizio)
    ev.preventDefault();var j=+t.dataset.e,c=t.dataset.c,dir=ev.shiftKey?-1:1;
    var n=document.querySelector('#coTab table.co-es input[data-e="'+(j+dir)+'"][data-c="'+c+'"]:not([data-w])');
    if(n){n.focus();if(n.select)n.select()}else if(dir>0&&$('coAgg')&&!$('coAgg').disabled&&t.value){$('coAgg').click();var x=document.querySelector('#coTab table.co-es input[data-e="'+(j+1)+'"][data-c="'+c+'"]');if(x)x.focus()}
    return}
  if(mod&&!testo&&(k==='c'||k==='v')&&typeof coCopiaEs==='function'){var P=CO.prog,s=P.sedute[CO.sed];
    if(k==='c'&&s.esercizi[CO_RIGA]&&!(window.getSelection&&String(window.getSelection()))){ev.preventDefault();coCopiaEs(s.esercizi[CO_RIGA],s.lettera)}
    else if(k==='v'&&coAppLeggi()){ev.preventDefault();coIncollaEs(s,CO_RIGA>=0&&CO_RIGA<s.esercizi.length?CO_RIGA+1:s.esercizi.length)}}});

(function(){var o=window.rProg;if(typeof o!=='function')return;
  window.rProg=function(){var r=o.apply(this,arguments);if(CO.prog&&CO_UNDO.P!==CO.prog)coUndoInizia();coUndoBottoni();
    var ag=$('coAgg');if(ag&&!$('coDupS'))ag.insertAdjacentHTML('afterend','<button class="co-btn" id="coDupS" title="Copia questa seduta in un\'altra">Duplica seduta</button>');
    if($('coDupS'))$('coDupS').onclick=coDuplicaSeduta;
    var tb=document.querySelector('#coTab table.co-es');if(tb&&!$('coTasti'))tb.closest('.co-scroll').insertAdjacentHTML('afterend','<div class="co-nota co-tasti" id="coTasti">Tastiera: <kbd>Invio</kbd> riga sotto · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplica la riga · <kbd>Ctrl</kbd>+<kbd>Z</kbd> annulla · <kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>V</kbd> fuori dalle caselle copia e incolla l\'esercizio</div>');
    return r}})();
// fuori dal Programma i pulsanti Annulla/Ripeti spariscono
(function(){['rCliente','coVai'].forEach(function(n){var o=window[n];if(typeof o!=='function')return;window[n]=function(){var r=o.apply(this,arguments);coUndoBottoni();return r}})})();

// ======================================================================================================
// valori di un esercizio in una settimana: quello scritto in quella settimana, altrimenti quello che arriva da prima
function coVale(e,w,c){if(w>=2){var o=e.sett&&e.sett[w];if(o&&o[c]!==''&&o[c]!=null)return String(o[c])}return String(coEff(e,w,c)||'')}
function coScrivi(e,w,c,v){if(w<2){e[c]=v;return}e.sett=e.sett||{};var o=e.sett[w]||(e.sett[w]={serie:'',rip:'',rir:'',pct:''});o[c]=v}
function coFmt(x){x=Math.round(x*10)/10;return String(x)}
// sposta un numero o un intervallo (8-10, 1-2) di d; null se il valore non e' un numero (MAX, 45", vuoto)
var CO_LIM={serie:[1,20],rip:[1,100],rir:[0,10],pct:[0,100]};
function coSposta(v,d,c){v=String(v||'').trim().replace(',','.');var L=CO_LIM[c]||[0,999],cl=function(x){return Math.min(L[1],Math.max(L[0],x))};
  var m=/^(\d+(?:\.\d+)?)$/.exec(v);if(m)return coFmt(cl(+m[1]+d));
  m=/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)$/.exec(v);if(m&&c!=='serie')return coFmt(cl(+m[1]+d))+'-'+coFmt(cl(+m[2]+d));
  return null}

// ---- Progressione in un clic: su un esercizio o su tutta la seduta. Regole pronte che riempiono la regola libera.
var CO_REGOLE=[['rir','RIR −1 ogni settimana',{c:'rir',d:-1,o:1}],['serie','+1 serie ogni 2 settimane',{c:'serie',d:1,o:2}],
  ['doppia','Doppia progressione: ripetizioni +1 a settimana dentro l\'intervallo, poi si riparte',{c:'rip',doppia:true}],
  ['pct','%1RM +2,5 ogni settimana',{c:'pct',d:2.5,o:1}],['libera','Regola libera',{c:'rir',d:-1,o:1}]];
var CO_CAMPI=[['serie','Serie'],['rip','Ripetizioni'],['rir','RIR'],['pct','%1RM']];
// calcola i nuovi valori senza toccare il programma: {righe:[{e,nome,val:{w:v}}], saltati:[nomi]}
function coCalcolaRegola(es,R){var out={righe:[],saltati:[]};
  es.forEach(function(e){if(!e.nome)return;if(R.c==='pct'&&!e.p1rm){out.saltati.push(e.nome+' (senza %1RM)');return}
    var val={},prima=coVale(e,R.da-1,R.c),ok=true;

// elenco clienti con filtri e colonna "ultimi 7 giorni" (sostituisce rClienti della pagina: in JS vale l'ultima definizione)
var SC_FILTRI=[['tutti','Tutti'],['attivi','Attivi'],['scadenza','In scadenza'],['pagare','Da pagare'],['spariti','Spariti'],['sospesi','Sospesi']];
function scFiltro(c,f){var acc=coGiorniDa(c.accesso),sc=c.scadenza?-coGiorniDa(c.scadenza):null;
  if(f==='attivi')return c.attivo;if(f==='sospesi')return !c.attivo;if(f==='scadenza')return c.attivo&&sc!==null&&sc<=14;
  if(f==='pagare')return /da pagare|sospes/i.test(c.pagamento);if(f==='spariti')return c.attivo&&(c.accesso?acc>=7:coGiorniDa(c.creato)>=7);return true}

      '<td>'+(d7&&d7.previste?'<b>'+d7.fatte+'/'+d7.previste+'</b>'+(d7.saltate?' <span class="co-pill no">'+d7.saltate+' saltat'+(d7.saltate===1?'a':'e')+'</span>':''):'<span style="color:var(--muted)">-</span>')+'</td>'+

// ---------- editor del programma
// ---------- tempo stimato della seduta (regole di Mattias, 21/11/2026): riscaldamento 5', ripetizione 5" o somma del TUT,
// recupero vuoto 90", cambio esercizio 2', MAX = 12 ripetizioni, range = media, superserie: recupero solo dopo l'ultimo esercizio
var CO_T={risc:300,rip:5,rec:90,cambio:120,max:12};
function coRipN(r){r=String(r||'').toLowerCase().replace(',','.');if(!r.trim())return{n:0};var x=/per\s+(gamba|braccio|lato)|\bx\s*lato/.test(r)?2:1;
  var sec=/(\d+(?:\.\d+)?)\s*(?:"|''|s\b|sec)/.exec(r);if(sec&&!/\d\s*-\s*\d/.test(r.replace(sec[0],'')))return{sec:+sec[1]*x};
  if(/max/.test(r))return{n:CO_T.max*x};var m=/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/.exec(r);if(m)return{n:(+m[1]+ +m[2])/2*x};
  m=/(\d+(?:\.\d+)?)/.exec(r);return{n:m?+m[1]*x:0}}
function coTutS(t){t=String(t||'').toUpperCase();if(!/\d/.test(t))return 0;var s=0;t.split(/[-\/ ]+/).forEach(function(q){if(q==='X')s+=1;else if(/^\d+(\.\d+)?$/.test(q))s+=+q});return s}
function coRecS(r){r=String(r||'').replace(',','.').replace(/[’`]/g,"'").replace(/[”″]/g,'"').trim();if(!r)return CO_T.rec;
  var mm=/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*('|min)/.exec(r);if(mm)return(+mm[1]+ +mm[2])/2*60;
  var ss=/(\d+)\s*-\s*(\d+)\s*("|s\b|sec)?/.exec(r);if(ss&&!/'/.test(r))return(+ss[1]+ +ss[2])/2;
  var t=0,a=/(\d+(?:\.\d+)?)\s*(?:'|min)/.exec(r),b=/(\d+(?:\.\d+)?)\s*(?:"|''|s\b|sec)/.exec(r.replace(a?a[0]:'',''));
  if(a)t+=+a[1]*60;if(b)t+=+b[1];if(a||b)return t;var n=parseFloat(r);if(isNaN(n))return CO_T.rec;return n<=5?n*60:n}
function coTempo(sed,w){var es=sed.esercizi.filter(function(e){return(e.nome||'').trim()}),bl=[],tot=0;
  es.forEach(function(e){var g=/^([A-Z])\d+$/i.exec((e.n||'').trim()),ult=bl[bl.length-1];if(g&&ult&&ult.g===g[1].toUpperCase())ult.e.push(e);else bl.push({g:g?g[1].toUpperCase():null,e:[e]})});
  var nb=0;bl.forEach(function(b){var giri=0,lav=[];
    b.e.forEach(function(e){var sr=parseInt(w>1?coEff(e,w+1,'serie')||e.serie:e.serie,10)||0,rp=coRipN(w>1?coEff(e,w+1,'rip'):e.rip),tu=coTutS(e.tut)||CO_T.rip;
      lav.push({sr:sr,set:rp.sec!=null?rp.sec:rp.n*tu});if(sr>giri)giri=sr});
    if(!giri)return;nb++;
    for(var g=1;g<=giri;g++){lav.forEach(function(l){if(l.sr>=g)tot+=l.set});if(g<giri)tot+=coRecS(b.e[b.e.length-1].rec)}});
  if(!nb)return 0;return CO_T.risc+tot+CO_T.cambio*(nb-1)}
function coMin(s){return Math.round(s/60)}
function coTempoInfo(sed){var P=CO.prog,t1=coTempo(sed,1);if(!t1)return null;var mi=t1,ma=t1;
  var cambia=sed.esercizi.some(function(e){return e.sett&&Object.keys(e.sett).length});
  if(cambia)for(var w=2;w<=P.W;w++){var t=coTempo(sed,w);if(t<mi)mi=t;if(t>ma)ma=t}
  return{t:t1,mi:mi,ma:ma}}
function coAggTempo(){var P=CO.prog;if(!P)return;coAggGrafici();var s=P.sedute[CO.sed],i=coTempoInfo(s),el=$('coTempo');
  if(el)el.innerHTML=i?'<b>≈ '+coMin(i.t)+' min</b> tempo stimato'+(coMin(i.mi)!==coMin(i.ma)?' in settimana 1 · da '+coMin(i.mi)+' a '+coMin(i.ma)+' min con la progressione':'')+'<span>Riscaldamento 5′ · ripetizione 5″ o TUT · recupero vuoto 90″ · cambio esercizio 2′ · MAX = 12</span>':'<span style="margin:0">Il tempo stimato compare quando scrivi esercizi e serie.</span>';
  tutti('#coSedTabs [data-tt]').forEach(function(x){var q=coTempoInfo(P.sedute[+x.dataset.tt]);x.textContent=q?' · '+coMin(q.t)+'′':''})}
function coEff(e,w,c){for(var x=w-1;x>=2;x--){var o=e.sett&&e.sett[x];if(o&&o[c]!==''&&o[c]!=null)return o[c]}return e[c]||''}
function coColore(l){var P=CO.prog,i=P.lettere.indexOf(l);return i>=0?P.sedute[i].colore:''}
function coSettCorr(){var P=CO.prog;if(!P.inizio)return 0;var g=coGiorniDa(P.inizio);return g<0?0:Math.min(P.W,Math.floor(g/7)+1)}
function rProg(){var P=CO.prog,sc=coSettCorr(),h='';
  h+='<div class="co-card"><h3>Impostazioni del programma</h3><p class="sub">Programma di '+P.W+' settimane, fino a '+P.S+' sedute da '+P.SLOT+' esercizi.</p><div class="co-form">'+
    '<div><span class="lab">Inizio (lunedì della settimana 1)</span><input class="co-in" type="date" data-p="inizio" value="'+esc(P.inizio)+'"></div>'+
    '<div><span class="lab">Obiettivo</span><input class="co-in" data-p="obiettivo" value="'+esc(P.obiettivo)+'" maxlength="120"></div>'+
    '<div><span class="lab">Frequenza</span><input class="co-in" data-p="frequenza" value="'+esc(P.frequenza)+'" maxlength="40" placeholder="es. 4 a settimana"></div>'+
    '<div class="largo co-riga" style="flex-wrap:wrap"><button class="co-btn" id="coCarDa">Carica da un modello o da un altro cliente</button><button class="co-btn" id="coSalvaMod">Salva come modello</button></div>'+
    '<div class="largo"><span class="lab">Progressione (nota per te e per il cliente)</span><textarea class="co-in" data-p="progressione" maxlength="1500">'+esc(P.progressione)+'</textarea></div></div></div>';
  // settimane
