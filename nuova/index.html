function coApplica(d,da,dopo){var P=CO.prog,tagli=[];
  if((d.sedute||[]).slice(P.S).some(function(s){return s.esercizi&&s.esercizi.length}))tagli.push('le sedute oltre la '+P.lettere[P.S-1]);
  if((d.sedute||[]).some(function(s){return(s.esercizi||[]).length>P.SLOT}))tagli.push('gli esercizi oltre il '+P.SLOT+'° per seduta');
  if((d.settimane||[]).length>P.W)tagli.push('le settimane oltre la '+P.W);
  var fai=function(){P.obiettivo=d.obiettivo||P.obiettivo;P.frequenza=d.frequenza||'';P.progressione=d.progressione||'';
    P.sedute.forEach(function(s,i){var q=(d.sedute||[])[i]||{nome:'',nota:'',esercizi:[]};s.nome=q.nome||'';s.nota=q.nota||'';
      s.esercizi=(q.esercizi||[]).slice(0,P.SLOT).map(function(e){var o={k:0,n:e.n||'',nome:e.nome||'',serie:String(e.serie||''),rip:e.rip||'',rec:e.rec||'',rir:e.rir||'',tut:e.tut||'',tecnica:e.tecnica||'',note:e.note||'',sett:{}};

    var sw=d.settimane||[],ultima=sw.length?sw[sw.length-1]:{fase:'',giorni:[]};
